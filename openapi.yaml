# courier's HTTP surface, per cafaye/core/docs/openapi-conventions.md.
#
# This file now describes every route courier's router serves except two, and the
# two are named here: `/healthz` and `/readyz` are infrastructure probes that run
# before auth, routing and the rest of the platform exist, and no customer codes
# against them. A document that claims to describe courier and quietly omits part
# of it is worse than one that says what it covers — which is why the omissions
# are declared in this header *and* enforced by
# `test/courier_web/openapi_document_test.exs`, which fails if this file and
# `lib/courier_web/router.ex` disagree in either direction.
#
# `GET` and `PUT /v1/notification_preferences/{user_id}` were in the router with
# tests behind them and absent from here, which is the drift this file's check now
# prevents from recurring. They are the other half of the public surface, not an
# afterthought, and they are documented as thoroughly as the webhooks.
#
# > **Every operation in this document is authenticated, and exactly two of them
# > are not authenticated by a token.** They are the two exceptions, and they are
# > named here because a blanket claim is the shape that hides the first
# > exception — and this file now has two, for two different reasons, so the
# > blanket claim had to be replaced rather than extended.
# >
# > **`receiveResendReport` is authenticated by a SIGNATURE.** An inbound provider
# > webhook is not a tenant operation. Resend signs its webhook with Svix and sends
# > no bearer token, so a principal would answer every delivery with a `401`; and
# > behind no plug at all it would be an unauthenticated `POST` that records
# > suppressions, which is a denial of service on the whole product delivered by
# > the feature meant to prevent it. Core settles it, in
# > `docs/openapi-conventions.md` §Auth: "Inbound webhooks are **not**
# > JWT-authenticated: they are signed, per the sender's convention, and the
# > receiver checks the signature before parsing." So the operation declares
# > `security: [{webhookSignature: []}]` and nothing else, and the document can say
# > that truthfully because the router agrees:
# > `test/courier_web/router_test.exs` asserts it is **not** behind the
# > authenticated pipeline and that it is behind `:api`.
# >
# > Its `401` therefore does not mean "no bearer token", and it is a reusable
# > response of its own (`SignatureRejected`) rather than the `Unauthorized` every
# > other operation shares — the same decision `MessageSuppressed` and
# > `NotificationPreferencesNotFound` made, for the same reason: a different
# > meaning wants a different sentence.
# >
# > **`oneClickUnsubscribe` and `unsubscribeByLink` are authenticated by the
# > OPAQUE TOKEN IN THEIR PATH**, and they declare `security: []` — which says
# > "this operation presents no credential scheme", **not** "this operation is
# > unauthenticated". The distinction is the point, and it is worth reading twice
# > because `security: []` is exactly the spelling courier-05 used by mistake:
# >
# >   * RFC 8058 §3.1 forbids this request from carrying authorization at all —
# >     "The POST request MUST NOT include cookies, HTTP authorization, or any
# >     other context information." A mail client holds no bearer token, sends no
# >     cookie, and is not allowed to send either. Behind
# >     `CourierWeb.Plugs.Principal` **every one-click unsubscribe in the world
# >     would be a 401**, and Gmail and Yahoo require the button to work.
# >   * What the token *is* is stated in full in the `UnsubscribeToken` parameter:
# >     32 bytes of `:crypto.strong_rand_bytes/1`, stored only as a SHA-256, with
# >     the address nowhere in it. An unknown one is a **404**, not a 401, because
# >     it is a resource address rather than a presented credential.
# >
# > So these two are the only operations in this file that a generated client has
# > no business calling, and the document says so on each of them. They are here
# > because `test/courier_web/openapi_document_test.exs` holds this file and the
# > router to each other in both directions: a route the router serves and this
# > file does not describe is a method the next generated client will not have,
# > and an operation filed under `/v1` that cannot take a bearer token is a method
# > a generated client *will* call wrongly. Both failure modes are worse than the
# > two exceptions above.
# >
# > **Two of core's own rules therefore report on these three operations, and that
# > is measured rather than assumed.** `cafaye-contract lint` fails
# > `openapi.paths-are-versioned` for all three paths and
# > `openapi.idempotency-key` for the two `POST`s — the same two rules, on the
# > same two grounds, before and after this packet added a third operation
# > (`/inbound/resend` was already reported by both at `2.2.0`). The harness
# > cannot know that a mail client is not a tenant or that a mail client is
# > forbidden by RFC 8058 §3.1 from sending a header, and both are load-bearing
# > enough to be worth a contract violation rather than a compromise: version
# > these paths and a generated client sends a bearer token to a mail client that
# > will never present one.
# >
# > The two notification-preferences operations, which are the other half of that
# > history, were once served with `security: []` and a `> DECISION NEEDED
# > (courier-05)` above this line recording the gap. That is closed: both are
# > behind the plug, `info.version` went to **2.0.0**, and the cost was paid then
# > because there was no 2.x client. `receiveResendReport` is the first operation
# > in this file with `security` other than `bearerAuth`, and it is not a gap — it
# > is the only way an inbound webhook can be authenticated truthfully.
# > `oneClickUnsubscribe` and `unsubscribeByLink` are the second and third, and
# > each says in its own description what stands in for the credential.
#
# The three answers on those two operations are the same three the webhooks give,
# because they go through the same plug and are decided in the same context:
#
#   * **anonymous → 401**, from `CourierWeb.Plugs.Principal`, whose default
#     resolver authenticates nobody — so a courier deployed without identity's JWT
#     verifier locks these routes rather than serving them.
#   * **another account → 404**, for a user whose stored preferences belong to
#     somebody else. Not a 403: core's conventions forbid a 403 that leaks the
#     existence of a resource the caller cannot see.
#   * **a user nobody has written preferences for → 200**, with the defaults. The
#     404 above is deliberately narrow — courier holds no foreign key to identity's
#     users, so with no stored rows it knows nothing about the user, and a 404
#     would be courier claiming to know something about the requester it does not
#     know.
#
# **A user's preferences belong to an account, and the account is recorded rather
# than asked for.** `notification_preferences.account_id` is written from the
# principal, never from a request, and the unique index stays on
# `(user_id, notification_type)` — a user has one set of preferences, not one per
# account, so the account is the row's owner rather than part of its identity.
# The consequence a caller can observe: the **first** authenticated `PUT` for a
# user id is what records the owning account, because courier cannot ask identity
# which account a user belongs to. An account that writes for an unwritten user id
# claims that user and gets no access to anything that existed.
#
# ## What courier does not return, and why that is written down here
#
# A document that omits a reachable response is worse than one that says what it
# covers, so the omissions are declared rather than left to be found. Each of the
# following was measured against this repository's endpoint rather than read off
# it, and each is the reason no operation below declares it:
#
#   * **403 `forbidden`** — nothing sends it. `CourierWeb.Plugs.Principal`
#     answers 401 for an anonymous caller and 503 when it cannot ask identity,
#     and never 403; and a resource in another account is a 404, because core
#     forbids a 403 that leaks existence. courier has no role a claim could
#     grant it, so there is no input to a 403.
#   * **409 on a duplicate `url`** — a duplicate `url` is a **422** whose
#     `errors[0].code` is `taken`, which is the status convention's
#     "semantically wrong", not a conflict. The 409s that *are* declared are for
#     `Idempotency-Key` and for `sendMessage`, below.
#   * **415 `unsupported_media_type`** — the parser is configured
#     `pass: ["*/*"]`, so an unknown content type is neither parsed nor refused.
#     The request reaches the controller and is answered 422 for the field it did
#     not carry.
#   * **429 `rate_limited`** — there is no limiter. Thirty rapid reads answer
#     thirty 200s and thirty rapid writes answer thirty 201s.
#
# ## 503 `unavailable` is declared on every authenticated operation, and this line is what changed
#
# It used to sit in the list above with the note "only `GET /readyz` sends it",
# which was true and is no longer. `sendMessage` has a dependency courier does not
# control — an SMTP relay — and a send has to be able to say so:
#
#   * **the provider refused.** A 4xx or 5xx from the relay, a refused credential,
#     a socket that would not open. Nothing was sent, no outbox row was written,
#     and the retry is safe.
#   * **courier cannot deliver at all.** `COURIER_MAIL_ADAPTER` names an adapter
#     that never opens a socket, or names none. This is the same predicate
#     `Courier.MailerAdapter` checks at boot, asked a third time per request — not
#     because the boot gate is insufficient, but because **the refusal has to be
#     visible to the caller**. A courier that booted with a silent adapter would
#     otherwise answer 200, write an outbox row and publish
#     `courier.email.delivered` for mail nobody receives, which is the whole
#     failure the adapter work exists to end.
#
# **AND NOW EVERY OPERATION BEHIND `CourierWeb.Plugs.Principal` HAS ONE, because
# authentication is a network hop.** courier resolves a caller by asking identity's
# `POST /v1/introspections` about the token the request carries — identity's token is
# opaque, so there is no claim to read and no key to verify against. That means a
# dependency courier does not control sits on the request path of every `/v1`
# operation, and every one of them can now answer:
#
#   * **identity is unreachable, slow or erroring.**
#   * **courier's own credential is wrong** — identity answers 401 for a credential
#     it does not accept and 403 for one that may not ask about the token it named.
#     Both are facts about THIS DEPLOYMENT, not about the caller's token.
#   * **identity answered in a shape courier cannot read.**
#
# It is 503 and not 500 because courier is fine and its dependency is not, and that
# is the difference between a generated client retrying and a generated client
# filing a bug against courier.
#
# **AND IT IS NOT A 401, which is the part worth reading twice.** A 401 says "your
# credential is not acceptable". identity being down says nothing of the sort, and a
# customer holding a perfectly good token who is told 401 will rotate it — and still
# be refused. So the one case where a 503 would be *wrong* (a genuinely dead token)
# is the case identity answers `200 {"active": false}` for, and courier turns that
# into a 401 like any other refusal.
#
# **AND IT IS NOT A 200-either.** The alternative was to let the request through when
# identity could not be reached. That is a resolver that fails OPEN under load, and
# it is worse than the locked door courier shipped for a year: it does not fail, it
# quietly serves.
#
# `GET /readyz` still sends a 503, and still is not an operation in this document.
# `test/courier_web/plugs/principal_config_test.exs` holds this section to the
# router in both directions: every operation behind the principal plug declares a
# 503, and no operation outside it claims one.
#
# ## Idempotency-Key, and what each of the three answers means
#
# All three mutating `POST`s accept `Idempotency-Key`, as core's conventions
# require of a POST that can be retried safely. `createWebhookEndpoint` registers a
# destination that will receive at-least-once deliveries, and a caller that timed
# out on it has no other way to learn whether the first attempt landed. `sendMessage`
# is the strongest case of the three: a send is not idempotent by HTTP's definition,
# so a caller that timed out and retried without the header **mails somebody twice**,
# and there is no way for courier to tell the two messages apart afterwards.
#
# courier-12 measured that courier did **not** implement this, and said so here
# rather than declaring a contract for behaviour that was not there. That gap is
# closed as of courier-14, and this section is rewritten rather than deleted, so
# the reader can see that the header was once accepted and ignored and is now the
# mechanism the 409s below exist for.
#
#   * **Same key, same body, already answered** — the stored response, byte for
#     byte, with `Idempotency-Replayed: true`. For `createWebhookEndpoint` that
#     response carries the signing secret, which exists in exactly one 201 and
#     cannot be re-derived, so a client that lost the first response to a timeout
#     gets the secret back from its retry.
#   * **Same key, different body** — 409 `idempotency_key_reused`.
#   * **Same key, same body, first attempt still running** — 409 `conflict`.
#     Core's five sentences do not describe the concurrent case, and this is
#     courier's answer: not `idempotency_key_reused`, because the bodies are
#     identical and saying otherwise is a lie a retry loop is built on, and not a
#     503, because nothing is unavailable. `conflict` is core's own word for a
#     request that collides with current state.
#
# Three things the header does **not** do, each measured rather than assumed:
#
#   * **A request with no key is processed normally** and records nothing. A
#     retry without a key is the client's bug, and it is answered as though the
#     key were absent.
#   * **Only a 2xx is stored.** A 4xx leaves the key free immediately, so a
#     client that fixed its request and retried with the same key gets its new
#     answer rather than a 409 about a key it never reused; a 5xx leaves it free
#     too, so a transient courier failure is not pinned for a day.
#   * **A key that is not a uuid is a 422.** courier-12 measured that a non-uuid
#     and a 5000-character key were both accepted without complaint; the second
#     of those was a string in a unique index, paid for by every write.
#
# Retention is 24 hours, scoped to the `(account, endpoint, key)` triple with
# `endpoint` the concrete path. REPORT-courier-14-coreversion.md has the
# measurements, including the two Elixir behaviours that had to be discovered the
# hard way and are now written into the code that depends on them.
#
# ## The inbound provider surface, and why its 400 is signed-only
#
# `POST /inbound/resend` is the first operation here with **no `Idempotency-Key`**
# and the only one authenticated by something other than a bearer token, and both
# are decisions rather than gaps. The reasoning is long and it lives in the code —
# `CourierWeb.InboundReports`'s moduledoc and `CourierWeb.InboundController`'s — so
# what this header records is the two consequences a client needs and cannot
# derive:
#
#   * **A provider retry is a 200, not a 409.** Delivery is at-least-once and a
#     provider delivering the same report twice is normal, not an error.
#     Deduplication is `email_suppressions`'s unique index on
#     `(provider, provider_event_id)`, which `Courier.Inbound.Resend` derives from
#     the report's own **content** rather than from the `webhook-id` header — a
#     stronger key, because one delivery can name many recipients and keying on the
#     header would collapse a broadcast into one row. The second delivery answers
#     `200` with `data.duplicates` above zero and writes nothing.
#   * **The 400 is reachable only by somebody holding the signing secret.** The
#     obvious way to check this operation's 400 — POST a body that is not JSON, as
#     `test/courier_web/openapi_error_responses_test.exs` does for every other
#     operation — gets a **401**, and that is the security property rather than an
#     inconvenience: courier refuses before it reads a byte of the body, so a forged
#     request is told nothing about whether its payload parsed.
#     `openapi_error_responses_test.exs` therefore asks this operation its 400 with a
#     **signed** malformed body, which is the only way to reach the status, and the
#     test says so where it does it.
#
# And the one thing this surface never does, which is stated here because the
# operation is the only place a suppression could leak: **no response on this
# operation carries an email address.** Not the `200` counts, not a `422`'s
# `detail`, not a log-derived value echoed back. `email_suppressions` has no
# `account_id` and is not exposed through any route, so an address in a response is
# a way to ask courier questions about mailboxes it holds. The address appears in
# courier's **logs**, which is where `Courier.Inbound.Resend`'s refusals put it and
# where `POST /v1/messages`'s 409 does not.
#
# ## Two other facts about this surface, because a reader is owed them
#
#   * **`?order=` and `?offset=` are accepted and ignored.** Core's standard
#     request shape is `?limit=&cursor=&order=asc|desc`; courier paginates
#     oldest-first only, so a request carrying `order` is answered as if it were
#     not there, and `offset` is ignored for the reason core gives for banning it.
#     Neither is declared below, because neither is honoured.
#   * **`limit` is capped silently.** `?limit=99999` is a 200 answering with at
#     most 100 rows, not a 422. The cap is real and is stated in the parameter;
#     what a client cannot see from here is that it was applied.
#
# ## Why `400` is on some operations and not others
#
# `CourierWeb.Plugs.ParseBody` wraps `Plug.Parsers`, and that reads a request body
# for `POST`, `PUT`, `PATCH` and `DELETE` — and for no other verb. So the 400 is
# reachable on exactly the operations that carry one of those verbs, which is not
# the same as "every operation that takes input": `GET` sends no body and is
# refused by neither the parser nor anything else, and a `400` declared on a `GET`
# is a case a client writes and can never run.
#
# `DELETE` is the one that reads wrong. A `DELETE` carries no body in any sensible
# client, so it looks bodyless, and a document that omits its 400 looks right —
# until a client that does send one is answered with a body nobody documented. It
# is declared for that reason, and
# `test/courier_web/openapi_error_responses_test.exs` checks the agreement in both
# directions so neither half can drift back.
openapi: 3.1.0

info:
  # The document's own semantic version, which moves with the document and not
  # with the `/v1` prefix. The prefix changes only on a breaking change, and then
  # this number changes in the same commit.
  #
  # This is a **major** bump and the first one this document has taken, so the
  # reason is stated rather than implied by the number. No path changed, no
  # operation was added or removed, and no response body changed shape — but
  # `GET` and `PUT /v1/notification_preferences/{user_id}` went from `security:
  # []` to requiring a bearer token, which is a change to what a client has to
  # send and therefore a breaking change to the contract rather than an additive
  # one. A client generated from 1.4.0 sends no token and receives a 401.
  #
  # The previous bump (1.3.0 → 1.4.0, courier-14) was a minor one for the
  # opposite reason: `Idempotency-Key` and the two 409s it can now answer describe
  # what courier began doing, and a client that sends no key is unaffected.
  #
  # The bump to 2.1.0 is minor, and it is the additive kind core's conventions
  # describe: one new operation (`POST /v1/messages`) and no change to any
  # existing path, verb, request field or response shape. A client generated from
  # 2.0.0 keeps working against it, which is what makes it minor.
  #
  # The bump to 2.2.0 is minor for the same reason, and with one addition worth
  # naming because it is not additive in the usual sense: one new operation
  # (`POST /inbound/resend`), a new `webhookSignature` security scheme, and three
  # new reusable responses — and **no existing path, verb, request field or
  # response shape changed at all**. A client generated from 2.1.0 keeps working
  # against it unchanged, including the nine operations that were already there
  # and the document-level `security` they inherit.
  #
  # The inbound operation is not in `/v1` and that is deliberate rather than an
  # exception to core's "path under /v1" checklist: `/v1` is courier's versioned
  # contract with a **tenant**, every operation under it takes a bearer token, and
  # PLAN.md MD6 has the platform generating client SDKs from this file — so an
  # operation filed under `/v1` that cannot take a bearer token is a method a
  # generated client will call wrongly. The checklist's line is about the
  # customer-facing API; an inbound webhook is not one.
  #
  # The bump to 2.4.0 is minor, and it is the additive kind core's conventions
  # describe: four new operations on two new paths (`GET /v1/notifications`,
  # `GET /v1/notifications/unread_count`, `POST /v1/notifications/{id}/seen` and
  # `POST /v1/notifications/{id}/read`) and **no existing path, verb, request
  # field or response shape changed at all**. A client generated from 2.3.0 keeps
  # working against it, which is what makes it minor.
  version: 2.4.0
  title: caFaye courier
  description: |
    Transactional email, notification preferences, in-app notifications, and
    outbound webhooks.

    courier delivers events to customer HTTP endpoints using the
    [Standard Webhooks](https://www.standardwebhooks.com) signature scheme, so a
    delivery is verified with an official library and nothing has to be written
    about courier's scheme.
  contact:
    name: courier
    email: courier@cafaye.com
  license:
    name: Proprietary - All rights reserved. See LICENSE in the cafaye/courier repository.

servers:
  - url: https://courier.cafaye.com
    description: production
  - url: http://localhost:4000
    description: local

tags:
  - name: webhook endpoints
    description: |
      Where an account registers the URLs courier delivers events to, and the
      signing secrets those deliveries are signed with.
  - name: notification preferences
    description: |
      What a user has been asked to receive, per notification type and per channel.
      Silence is not consent: a user courier has never seen, or a type a user has
      never mentioned, is on.
  - name: notifications
    description: |
      The in-app notification record: something that happened, addressed to one
      person, with whether they have seen it and read it. The recipient is the
      caller's own identity subject, resolved from the token — never from the
      request — so these operations read the caller's own inbox and nobody else's.
  - name: messages
    description: |
      courier's send path, over HTTP. One operation, and it is the only door into
      it — everything else in this service reads or configures what a send will
      do rather than causing one.
  - name: inbound reports
    description: |
      What a mail provider reports back about a recipient: a hard bounce, a spam
      complaint, a temporary failure. courier acts on the first two by suppressing
      the address, and this is the only operation in this document a **provider**
      calls — signed, not token-authenticated, because a provider is not a tenant.
  - name: unsubscribe
    description: |
      The [RFC 8058](https://www.rfc-editor.org/rfc/rfc8058) one-click endpoint
      every bulk message's `List-Unsubscribe` header points at. A **mail client**
      calls it, on the recipient's behalf, with no session and no credential
      header; the opaque token in the path is the whole of the authorization.
      Nothing here is for a generated client.

security:
  - bearerAuth: []

paths:
  /inbound/resend:
    post:
      tags: [inbound reports]
      operationId: receiveResendReport
      summary: One provider report about one or more recipients
      # `webhookSignature`, not `bearerAuth` and **not** an empty `security: []`.
      # The empty form is what this document spent courier-16 removing from two
      # operations, and it would be wrong here for a different reason: it tells a
      # generated client the operation is unauthenticated, which is the opposite of
      # the truth. The truth is that it is authenticated by a signature the
      # *sender* computes, and naming the mechanism is the only way a document can
      # say that. See this file's header.
      security:
        - webhookSignature: []
      description: |
        Delivers one Resend deliverability report, and answers what courier did
        with it. This is the door `Courier.Suppressions` was written for: until it
        existed, `email_suppressions` was written by nothing but tests, a customer's
        hard-bounced address went on being mailed forever, and a sending domain's
        reputation died of a cause no dashboard names.

        ## Who this is for

        **Resend, not a customer.** It is authenticated by the Svix signature on
        the request, never by a bearer token, and it is deliberately outside `/v1`
        for the same reason: `/v1` is this service's contract with a tenant.

        ## What a 200 means, and what it counts

        The signature verified, courier read the report, and the counts say what
        happened to each recipient. There is no status for "courier read it and did
        nothing", so the counts carry that distinction:

        | `data` field | meaning |
        | --- | --- |
        | `received` | reports the payload contained — one per **recipient**, so a broadcast to five addresses is 5 |
        | `recorded` | suppression rows newly written, which is what stops courier mailing that mailbox |
        | `duplicates` | reports courier already held, written by a redelivery |
        | `ignored` | temporary failures, which courier deliberately records nothing about |
        | `events` | `courier.email.bounced` / `.complained` rows published |

        `recorded` and `events` are the same number in every case except one, and
        the difference is deliberate: a report whose `Message-ID` names a send
        courier made publishes an event, and one that names nothing courier
        recognises records the suppression and publishes no event. **The
        suppression is the load-bearing half** — the address is not going to be
        mailed again whatever courier can say about which message it was — so the
        row is written and the missing event is a log line, not a rollback that
        would throw the row away with it.

        ## A redelivery is a 200, and this operation takes no `Idempotency-Key`

        A provider retries a webhook it got no answer for. That is **normal**:
        delivery is at-least-once. A second delivery of the same report is answered
        `200` with `data.duplicates` above zero and **writes nothing** — the row and
        its event are both already there.

        The deduplication is `email_suppressions`'s unique index on
        `(provider, provider_event_id)`, and the key is derived from the report's
        own **content** rather than from the `webhook-id` header. That is the one
        place this departs from the reference implementation's advice, and the
        reason is a broadcast: one delivery carries one `webhook-id` and a `to` of
        every address it reached, so keying on the header would collapse five
        bounced addresses into one suppression and go on mailing four of them for
        ever. The content-derived key records one row per address and a redelivery
        is still one row per address.

        `Idempotency-Key` is absent, and the reason is that the header a provider
        sends is one no provider sends: the retry identity here is the Svix
        signature, and the storage that makes it free is the unique index above.

        ## The order, and what it means for the statuses

        The signature is checked **before the body is parsed**, and nothing
        upstream decodes it either — this operation's body is deliberately left
        unparsed by the endpoint's `Plug.Parsers` so the bytes that arrive are the
        bytes that were signed. Spec §Signature scheme names parse-then-re-
        serialize as "a very common failure mode" of verification.

        Two statuses follow from that order, and both are worth a client reading
        twice:

          * **An unsigned request is a 401, whatever its body.** A forged request
            is told nothing about whether its payload parsed, because courier never
            looked.
          * **The 400 is reachable only with a valid signature.** A body that is not
            JSON, *signed correctly*, is a 400 — there is no field to name and
            nothing to correct, which is core's own line for 400 against 422. The
            same body unsigned is a 401.

        ## Refusals that are courier's own, not the provider's

        `500` means **courier** is misconfigured — no signing secret, or one it
        cannot decode. It is deliberately not a 401: a route answering 401 to its
        own misconfiguration is indistinguishable from one under attack, and the
        operator's first question would be the wrong one. `503` means the report
        could not be written; the transaction unwound, so nothing is half-recorded
        and the retry is safe.

        ## What a caller cannot see

        **No response on this operation carries an email address.** Not the counts,
        not a 422's `detail`, not a value echoed back from the payload. The
        suppression table has no `account_id` and is not exposed through any route,
        so an address in a response would be a way to ask courier questions about
        mailboxes it holds — the same posture as the 409 on `sendMessage`, which
        does not echo one either. The address appears in courier's **logs**, where
        `Courier.Inbound.Resend`'s refusals put it.
      parameters:
        - $ref: '#/components/parameters/SvixId'
        - $ref: '#/components/parameters/SvixTimestamp'
        - $ref: '#/components/parameters/SvixSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendReport'
            examples:
              bounced:
                summary: A permanent bounce — the recipient's mailbox does not exist
                value:
                  type: email.bounced
                  created_at: '2026-11-22T23:41:12.126Z'
                  data:
                    email_id: 56761188-7520-42d8-8898-ff6fc54ce618
                    message_id: <courier-6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061@cafaye.com>
                    to: [bounced@example.com]
                    from: Acme <onboarding@resend.dev>
                    subject: Sending this example
                    bounce:
                      type: Permanent
                      subType: General
                      message: The recipient's email address does not exist.
                      diagnosticCode: ['550 5.1.1 The email account that you tried to reach does not exist.']
              complained:
                summary: A spam complaint — the recipient pressed a button
                value:
                  type: email.complained
                  created_at: '2026-11-22T23:41:12.126Z'
                  data:
                    email_id: 56761188-7520-42d8-8898-ff6fc54ce618
                    message_id: <courier-6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061@cafaye.com>
                    to: [complained@example.com]
                    from: Acme <onboarding@resend.dev>
                    subject: Sending this example
              delayed:
                summary: A temporary failure, which courier records nothing about
                value:
                  type: email.delivery_delayed
                  created_at: '2026-11-22T23:41:12.126Z'
                  data:
                    email_id: 56761188-7520-42d8-8898-ff6fc54ce618
                    message_id: <courier-6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061@cafaye.com>
                    to: [delayed@example.com]
      responses:
        '200':
          description: The report was read; the counts say what courier did with it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InboundReportCounts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignatureRejected' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ReportNotActionable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ReportNotRecorded' }

  /unsubscribe/{token}:
    parameters:
      - $ref: '#/components/parameters/UnsubscribeToken'
    get:
      tags: [unsubscribe]
      operationId: unsubscribeByLink
      summary: Unsubscribe, for a client that only ever follows a link
      security: []
      description: |
        The same effect as `oneClickUnsubscribe`, over `GET`, for the clients that
        only fetch. RFC 8058 §3.2 says the one-click POST target is "the same as
        the one in the GET action for a manual unsubscription", and some mail
        clients and some corporate link scanners only ever follow a link — so a
        bulk sender whose header points at a `405` has not met the requirement by
        the clients people actually use.

        **The response is JSON, not a confirmation page.** courier renders no
        HTML at all: it is an API-only service, and this operation is the first
        thing in this document a person might open in a browser. The consequence is
        stated rather than hidden — somebody who follows the link by hand sees a
        small JSON object saying the same thing the mail client's button would
        have done, and there is no prettier version of it here.

        ## Who this is for, and what authenticates it

        **A mail client or a person, on the recipient's behalf.** Not a tenant and
        not a provider, which is why it is outside `/v1` and declares no security
        scheme at all:

          * RFC 8058 §3.1: "The POST request MUST NOT include cookies, HTTP
            authorization, or any other context information." A mail client holds
            no bearer token, sends no cookie, and is forbidden from sending either.
          * The **token in the path is the whole of the authorization** — 32 bytes
            of cryptographic randomness, stored only as a SHA-256 — and it is a
            resource address rather than a presented credential, which is why an
            unknown one is a `404` and not a `401`.

        `security: []` says "this operation presents no credential scheme", which
        is true and is *not* the same as "this operation is unauthenticated" — the
        token is checked, and an `UnsubscribeToken` parameter is declared
        describing exactly what it is.

        ## No redirect, ever

        RFC 8058 §3.1: "The mail sender MUST NOT return an HTTPS redirect, since
        redirected POST actions have historically not worked reliably, and many
        browsers have turned redirected HTTP POSTs into GETs." So a success is the
        `200` below and no status on this operation carries a `Location` header.
        A redirect here would be the one thing that works for a browser and
        silently breaks the mail client that matters.

        ## Nothing in a response is about a mailbox

        `{"data": {"status": "unsubscribed"}}` and nothing else — no address, no
        user id, no notification type, on any status. This is an unauthenticated
        surface, so anything echoed back is available to whoever found the URL, and
        the token is not a session.
      responses:
        '200':
          description: This notification type is off for this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnsubscribeResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UnsubscribeNotRecorded' }
    post:
      tags: [unsubscribe]
      operationId: oneClickUnsubscribe
      summary: Unsubscribe, as a mail client does it in one click
      security: []
      description: |
        The door every bulk message's `List-Unsubscribe` header points at. RFC
        8058 §3.1 requires the sender to advertise a one-click endpoint with

            List-Unsubscribe: <https://…/unsubscribe/{token}>
            List-Unsubscribe-Post: List-Unsubscribe=One-Click

        and the mail client then POSTs to that URI on the recipient's behalf, with
        no session, no cookie and no confirmation page. Gmail's and Yahoo's
        bulk-sender requirements, in force since June 2024, are enforced against
        exactly this.

        Everything about who calls this, what authenticates it, and why there is no
        redirect is on `unsubscribeByLink` above — the two operations differ only
        in the verb, which is §3.2's own arrangement.

        ## The body is ignored, and the content type is not required

        RFC 8058 §3.2 says the receiver "sends the key/value pair in the
        `List-Unsubscribe-Post` header as the request body", and gives
        `application/x-www-form-urlencoded` or `multipart/form-data` as the
        encodings. **courier reads none of it.** The same section says "Since there
        is no provision for extra POST arguments, any information about the message
        or recipient is encoded in the URI" — so a body is by definition
        informational, and a body that is absent, empty, urlencoded, multipart or
        something else entirely reaches the same two answers. The `400` below is
        the one exception and it is not about this operation's logic: it is
        `Plug.Parsers` refusing a body it was told to parse and could not, which
        is a body that is not valid JSON on a route configured to read JSON.

        ## A replay is the same 200, and it writes nothing

        A mail client is entitled to retry: a `POST` that timed out is a `POST`
        courier cannot distinguish from one that worked. So the second call answers
        the **same status with the same body**, writes nothing, and publishes no
        second event — the deduplication is the stored preference itself, not a
        header. A `409` would send the client round a retry loop over something
        that is already true.

        `Idempotency-Key` is absent for the same reason it is absent on
        `receiveResendReport`, and for one more: `CourierWeb.Plugs.Idempotency` is
        scoped to a principal, and RFC 8058 §3.1 forbids this request from
        carrying authorization at all.

        ## What it changes, and what it does not

        It records the recipient's own answer — `email_enabled: false` for that
        user and that notification type — so the next send of that type is refused
        with the `422` `sendMessage` already returns for a declined preference, and
        it publishes `courier.notification.suppressed` with
        `reason: "preference_off"`.

        **It is scoped to one notification type and does not touch the rest.** A
        bulk unsubscribe is not a fact about the mailbox, and courier's suppression
        list *is* a fact about the mailbox: an `email_suppressions` row refuses a
        password reset as firmly as it refuses a newsletter, so an unsubscribe
        written there would be a person who stops receiving product updates and
        then cannot reset their password.

        And it is **reversible**: the preference it writes is visible through
        `GET /v1/notification_preferences/{user_id}` and can be put back through
        the `PUT` beside it. A suppression row cannot, by construction.
      responses:
        '200':
          description: This notification type is off for this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnsubscribeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UnsubscribeNotRecorded' }

  /v1/messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send one transactional message
      security:
        - bearerAuth: [messages:write]
      description: |
        Sends one of courier's transactional messages and answers with what
        happened. This is the operation the platform's password reset, email
        verification, email change and team invitation flows call; until it
        existed those endpoints were reachable-looking and none of them could
        complete.

        ## What a 200 means, precisely

        **The provider accepted the message for delivery, and courier wrote the
        `courier.email.delivered` outbox row in the same transaction.** It does
        **not** mean the mail arrived. A submission protocol's whole reply is
        "accepted for delivery"; courier has no delivery receipt and will not
        imply one it does not hold. `data.status` therefore reads `accepted` and
        never `delivered` — a field reading `delivered` would be courier claiming
        a fact about somebody else's inbox that courier cannot know yet.

        The send is **synchronous**: the preference check, the suppression check,
        the provider's dial and the outbox row all happen inside the request, so
        this response is the real outcome rather than a receipt for an intention.
        The consequence is that a 409 below is a refusal the caller can act on,
        which a queued contract could not give them — the answer would arrive after
        the response, and a caller who cannot tell "suppressed" from "sent" retries
        forever.

        ## Three refusals, told apart by status and `code`

        A client branches on `code` and not on `detail`, so the three outcomes
        below are distinguishable without parsing prose:

        | outcome | status | `code` | retry? |
        | --- | --- | --- | --- |
        | accepted for delivery | 200 | — | — |
        | the recipient's mailbox is suppressed | 409 | `conflict` | **no** |
        | the request is wrong, or the user declined this type | 422 | `validation_failed` | after fixing it |
        | the provider refused, or courier cannot deliver | 503 | `unavailable` | yes, same key |

        **A suppressed mailbox is a 409, not a 422**, and the reason is that it is
        not a property of the request. A hard bounce and a spam complaint are
        facts about a *mailbox*, recorded by a provider and not chosen by this
        caller, and courier's suppression list is not exposed through any route —
        so this response is the only place the fact can surface. 409 `conflict` is
        core's own code for a request colliding with the current state of a
        resource, and it is the status that tells a generated client not to try
        again. A 422 would tell the caller to change a request that cannot be
        changed.

        **A declined preference is a 422**, the opposite answer on purpose. The
        user declining is visible through `GET /v1/notification_preferences/{user_id}`,
        it is changeable through the `PUT` beside it, and `errors[]` — which core
        reserves for 422 and nothing else — can name `type` as the field at
        fault.

        **A provider refusal is a 503 and not a 500**, because courier is fine and
        its dependency is not. Nothing was sent and no row was written, so the
        retry is safe; and a failed request **releases** its `Idempotency-Key`
        rather than storing the failure, so a retry is not locked out for 24 hours.

        ## Authentication

        Required, and not as a formality: an unauthenticated `POST` to a mail
        egress is an open relay, and it is the one surface where that would be
        true rather than theoretical. courier does not guess an account for an
        anonymous caller, and a deployment without identity's JWT verifier locks
        this route rather than serving it. The account comes from the principal
        and **never from the body** — a body carrying `account_id` is a 422 naming
        that field.

        ## Why there is no `from`, and no `text`/`html`

        Both are deliberate refusals of the obvious design, and the argument is
        the same: courier sends *transactional* mail it renders from its own
        templates, and a caller that could choose the sender would be a phishing
        relay wearing the platform's sending domain — a cost borne by every other
        tenant. So the sender and the subjects are configuration
        (`COURIER_MAIL_*`), a body carrying `from` is a 422, and the bodies come
        from templates keyed on `type`. What remains of "at least one of
        text/html" is a check on the **rendered** message rather than on the
        request: courier refuses to send a message with neither body, because
        `Swoosh` would accept it and answer a provider-shaped id, and a bodiless
        mail reported as delivered is the exact silent default this service has
        spent two packets refusing.

        ## Idempotency

        Send `Idempotency-Key` and a retry with the same key and the same body
        returns the first response byte for byte with `Idempotency-Replayed:
        true`, having sent **one** mail. Omit it and a retry sends a second mail:
        a send is not idempotent by HTTP's definition, and that is the caller's
        own problem rather than something courier hides. The header is documented
        here because silence about it would be the worse answer.

        ## What a caller cannot see

        The suppression list is never exposed through a route. A 409 says a
        mailbox cannot be written to and does **not** echo the address back, and
        `email_suppressions` carries no `account_id` — so the refusal is a fact
        about a mailbox rather than about another tenant's data, and it is the
        same posture the send path takes when it answers "no mail went out" rather
        than "here is a list".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              welcome:
                summary: A welcome message
                value:
                  type: welcome
                  user_id: 6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061
                  to: kaka@example.com
                  name: Kaka
              password_reset:
                summary: A password reset, which needs a link
                value:
                  type: password_reset
                  user_id: 6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061
                  to: kaka@example.com
                  url: https://cafaye.com/reset?token=6f5d4c3b
              email_change_current:
                summary: The warning to the current address, which carries the confirmation link
                value:
                  type: email_change_current
                  user_id: 6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061
                  to: kaka@example.com
                  url: https://cafaye.com/email-changes/confirm?token=6f5d4c3b
              email_change_new:
                summary: The notice to the new address, which names the address it is moving from
                value:
                  type: email_change_new
                  user_id: 6f5d4c3b-2a19-4e8f-9c07-1b2d3e4f5061
                  to: new@example.com
                  previous_email: kaka@example.com
      responses:
        '200':
          description: The provider accepted the message for delivery
          headers:
            Idempotency-Replayed:
              $ref: '#/components/parameters/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SendMessageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/MessageSuppressed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/notification_preferences/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [notification preferences]
      operationId: getNotificationPreferences
      summary: What this user has been asked to receive
      security:
        - bearerAuth: [notifications:read]
      description: |
        Every notification type courier sends, with this user's stored answers
        filled in and the defaults used where there are none. A `GET` never writes.

        **An unwritten user is a 200, not a 404.** identity owns the user table.
        courier is asked about a user id and answers with that user's
        preferences, which for a user who has never touched the settings is
        three types, all on. A 404 would be courier claiming to know something
        about the requester it does not know.

        **A user whose preferences belong to another account is a 404**, and
        that is the one case where the previous sentence does not apply: there is
        a resource, it is not the caller's, and a 403 would confirm it exists.
        The 404 appears only once somebody has written preferences for that user
        id — see this document's header for why the account is recorded rather
        than asked of identity, and what that means for who owns an unwritten
        user id.
      responses:
        '200':
          description: Every notification type, with this user's answers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotificationPreferencesNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

    put:
      tags: [notification preferences]
      operationId: updateNotificationPreferences
      summary: Apply a batch of preferences
      security:
        - bearerAuth: [notifications:write]
      description: |
        Stores a batch and answers with the state the user now has — the same
        shape a `GET` returns, so a settings page does not have to follow a write
        with a read to render.

        **A rejected batch writes nothing.** The entries are validated together
        before any of them is stored, so a typo in the third entry cannot leave
        the first two applied and the user looking at a half-saved settings page.
        Applying the same batch twice is the same answer: this operation is
        idempotent by construction, because it stores the state it is given rather
        than accumulating deltas.

        `user_id` comes from the path and is never read from the body. A body
        that names a different user cannot write that user's preferences.

        `account_id` cannot be named by a request at all: it is not a field of a
        preference entry, so an entry carrying one is a 422 naming
        `preferences[0].account_id`, and one beside the batch names nothing this
        operation reads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  minItems: 1
                  description: |
                    The entries to store. A type or channel not named here is left
                    alone, so a client that knows about one setting can send one
                    entry without overwriting the rest.
                  items:
                    type: object
                    required: [notification_type]
                    properties:
                      notification_type:
                        $ref: '#/components/schemas/NotificationType'
                      email_enabled:
                        type: boolean
                        default: true
                      push_enabled:
                        type: boolean
                        default: true
                        description: |
                          Stored and returned because the API is the user's
                          settings, but nothing sends push, so a `true` here does
                          not mean courier will send a push.
            examples:
              - preferences:
                  - notification_type: welcome
                    email_enabled: false
      responses:
        '200':
          description: The stored state, the same shape a `GET` returns
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotificationPreferencesNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's own notifications, newest first
      security:
        - bearerAuth: [notifications:read]
      description: |
        One page of the caller's own in-app notifications, newest first. The
        recipient is the caller's identity subject, resolved from the token by
        `CourierWeb.Plugs.Principal` — never from the request — so the path
        carries no user id and there is nothing for a caller to guess.

        **A caller nobody has written notifications for gets `[]`, not an
        404.** courier owns no users, so most recipients have never been written
        for, and an empty inbox is the ordinary case rather than an error.

        The list is ordered by `inserted_at` descending and then `id`, so the
        order is total: two rows sharing a timestamp are ordered by a uuid, which
        is arbitrary but stable, and a list that reshuffled between two identical
        calls would be a pagination bug with no error message anywhere.

        ## Query parameters

        * `unread=true` — only the ones with no `read_at`. The string `"true"`
          and nothing else; anything else, including absent, means all of them.
        * `limit` — how many. Defaults to 25, capped at 100. A non-integer or
          non-positive value is the default rather than an error: it is a query
          parameter, not a mistake anybody is helped by a 422 for.
        * `after` — an RFC 3339 timestamp, the cursor for "the page before". Only
          notifications older than it are returned. A value that does not parse
          is ignored rather than refused, for the same reason `limit` is.

        ## What a caller cannot see

        `account_id` is courier's tenancy key and is never in a query, a body, or
        a response: the account is the caller's because the token says so, and a
        caller that could name an account would be a caller who could read
        another tenant's inbox. An `account_id` in a query string is ignored.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: unread
          in: query
          required: false
          description: |
            `true` for only the unread ones. Anything else, including absent,
            means all of them.
          schema: { type: string, enum: ['true'] }
        - name: after
          in: query
          required: false
          description: |
            An RFC 3339 timestamp. Only notifications older than it are
            returned — this is the cursor for "the page before", a timestamp
            rather than an offset, so two notifications written in the same
            microsecond cannot make it skip one.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One page of the caller's notifications
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/notifications/unread_count:
    get:
      tags: [notifications]
      operationId: getUnreadCount
      summary: How many of the caller's notifications are unread
      security:
        - bearerAuth: [notifications:read]
      description: |
        The number an unread badge shows, and the reason `read_at` exists rather
        than a boolean: "seen" is not "read", and a badge that counted seen would
        fall the moment somebody scrolled past something.

        The recipient is the caller's identity subject, resolved from the token —
        never from the request — so this counts the caller's own unread
        notifications and nobody else's.
      responses:
        '200':
          description: The unread count
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [unread]
                    properties:
                      unread:
                        type: integer
                        minimum: 0
                        description: How many of the caller's notifications have not been read.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/NotificationId'

    post:
      tags: [notifications]
      operationId: markNotificationSeen
      summary: Mark one of the caller's notifications seen
      security:
        - bearerAuth: [notifications:write]
      description: |
        Sets `seen_at` on one of the caller's notifications — "it appeared in a
        list" — and answers with the row. Idempotent in the sense that matters: a
        second call returns the same row with the **first** `seen_at` still in it,
        because "when did they first see it" is a fact and a call that moved it
        would be answering a different question with the same function.

        **A row in another account, or one that is not this recipient's, is a
        404**, and so is an id that is not a uuid at all. Not a 403: core's
        conventions forbid a 403 that leaks the existence of a resource the caller
        cannot see, and the two questions — "does this belong to you?" and "does
        this exist?" — are the same question for a row the caller cannot see.

        This operation takes no `Idempotency-Key`, and that is a decision rather
        than an omission: the mark is idempotent by construction, so a retry is
        safe without a key, and the header is for a POST whose repeat would do
        the work twice.
      responses:
        '200':
          description: The notification, with `seen_at` set
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotificationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'

    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one of the caller's notifications read
      security:
        - bearerAuth: [notifications:write]
      description: |
        Sets `read_at` — and `seen_at`, because opening something is a stronger
        statement than seeing it, and a deep link can open a notification that was
        never in a list. Answers with the row.

        Idempotent, and it never clears either timestamp: a second call returns
        the same row with the **first** `read_at` and `seen_at` still in them.
        The database agrees — `check (read_at is null or seen_at is not null)`
        refuses a row that is read and unseen — so these two functions cannot
        disagree even if a future caller forgets.

        **A row in another account, or one that is not this recipient's, is a
        404**, for the reason `markNotificationSeen` gives.
      responses:
        '200':
          description: The notification, with `read_at` and `seen_at` set
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotificationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/webhook_endpoints:
    get:
      tags: [webhook endpoints]
      operationId: listWebhookEndpoints
      summary: List the caller's webhook endpoints
      description: |
        Cursor-paginated, oldest first. Disabled endpoints are included:
        disabling is not deleting, and the row carries the failure count and the
        reason delivery stopped.
      security:
        - bearerAuth: [webhooks:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

    post:
      tags: [webhook endpoints]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        The signing secret is returned **once**, in this response, and cannot be
        retrieved afterwards. Store it before leaving the response. A url courier
        will not send to is refused with a 422 whose `errors[0].code` names the
        class — `blocked_scheme`, `blocked_host`, `blocked_address`,
        `dns_failure` — because a well-formed url that resolves to a private
        address is a different problem from a typo and the customer needs to be
        told which one they have.
      security:
        - bearerAuth: [webhooks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: |
                    An absolute http(s) URL. `file:`, `ftp:`, `gopher:`, `data:`
                    and `javascript:` are refused, as are loopback, link-local
                    (including `169.254.169.254`), RFC1918 and unique-local
                    addresses — by literal address *and* by what the host
                    resolves to.
                  examples:
                    - https://hooks.example.com/cafaye
                description:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Registered, with the signing secret
          headers:
            Idempotency-Replayed:
              $ref: '#/components/parameters/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        required: [secret]
                        properties:
                          secret:
                            type: string
                            pattern: '^whsec_[A-Za-z0-9+/]+=*$'
                            description: |
                              The Standard Webhooks signing secret, base64
                              encoded behind the `whsec_` prefix. Shown once.

                              This field deliberately carries NO example value.
                              A secret of this kind is not usefully
                              exemplified — the only real one a caller will
                              ever see is the one this response hands back,
                              and a made-up example in a public specification
                              costs more than it teaches: GitHub's secret
                              scanning matches the `whsec_`-plus-base64 SHAPE
                              rather than the content, this repository is
                              public, and every realistic example value pushed
                              here opened an alert that somebody then had to
                              resolve. Five were opened on 2026-10-01 and all
                              five were documentation or test fixtures.

                              The `pattern` above is the machine-readable
                              contract: `whsec_`, then base64. A conforming
                              secret is 32 random bytes, so it base64-decodes
                              to nothing readable — which is also the quick
                              way to tell a real one from a fixture. The
                              third-party test vector in
                              `test/courier/inbound/signature_test.exs` is
                              svix's own published worked example and is the
                              one intentional literal in this repository; it
                              pins signature verification against a party
                              other than this repository and should not be
                              removed to satisfy a scanner. An alert on any
                              other `whsec_` value that decodes to nothing
                              readable is a real one: stop, rotate, and
                              investigate.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >-
            The `Idempotency-Key` was reused with a different body, or its first
            request is still in flight. The two are distinguished by `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                reused:
                  summary: Same key, different body
                  value:
                    type: https://errors.cafaye.com/idempotency_key_reused
                    title: Idempotency key reused
                    status: 409
                    detail: That Idempotency-Key was already used for a different request body.
                    code: idempotency_key_reused
                    trace_id: 0af7651916cd43dd8448eb211c80319c
                in_flight:
                  summary: Same key, first request still running
                  value:
                    type: https://errors.cafaye.com/conflict
                    title: Conflict
                    status: 409
                    detail: That Idempotency-Key is still being processed.
                    code: conflict
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/webhook_endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/EndpointId'

    get:
      tags: [webhook endpoints]
      operationId: getWebhookEndpoint
      summary: Fetch one webhook endpoint
      security:
        - bearerAuth: [webhooks:read]
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

    patch:
      tags: [webhook endpoints]
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint
      description: |
        A new `url` is a new destination and passes the same checks as a create.
        Fields that are not named are left alone, and the signing secret never
        changes here: a customer who edits a description must not have every
        delivery start failing verification for a day.
      security:
        - bearerAuth: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                status:
                  $ref: '#/components/schemas/WebhookEndpointStatus'
      responses:
        '200':
          description: The endpoint as it now is
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

    delete:
      tags: [webhook endpoints]
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint
      security:
        - bearerAuth: [webhooks:write]
      responses:
        '204':
          description: Removed. No body.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/webhook_endpoints/{id}/test:
    parameters:
      - $ref: '#/components/parameters/EndpointId'

    post:
      tags: [webhook endpoints]
      operationId: testWebhookEndpoint
      summary: Send a signed test payload to the endpoint
      description: |
        Sends a signed `ping` and reports what the receiver answered. The response
        is `200` whether or not the endpoint accepted it: the caller's request
        was well-formed and courier did what it was asked, which is a different
        fact from courier being unable to test. Read `data.delivered`.

        This is not a delivery. It writes no `webhook_deliveries` row, counts no
        attempt, and does not move the endpoint's circuit breaker — a customer
        testing their own endpoint and getting a 500 has learned something true,
        and charging their circuit for asking would punish them for using the
        diagnostic.

        `Idempotency-Key` applies here too, and it matters more than it looks: a
        retried ping with the same key is answered from the stored response, so
        the customer's endpoint receives **one** signed request rather than two. A
        test endpoint that receives duplicates is a support question.
      security:
        - bearerAuth: [webhooks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The ping was sent; `delivered` says whether it was accepted
          headers:
            Idempotency-Replayed:
              $ref: '#/components/parameters/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [delivered, status_code, duration_ms]
                    properties:
                      delivered:
                        type: boolean
                        description: Whether the receiver answered 2xx.
                      status_code:
                        type: integer
                        nullable: true
                        description: The receiver's status, or null if nothing answered.
                      duration_ms:
                        type: integer
                        description: How long the attempt took.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >-
            The `Idempotency-Key` was reused with a different body, or its first
            request is still in flight. The two are distinguished by `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                reused:
                  summary: Same key, different body
                  value:
                    type: https://errors.cafaye.com/idempotency_key_reused
                    title: Idempotency key reused
                    status: 409
                    detail: That Idempotency-Key was already used for a different request body.
                    code: idempotency_key_reused
                    trace_id: 0af7651916cd43dd8448eb211c80319c
                in_flight:
                  summary: Same key, first request still running
                  value:
                    type: https://errors.cafaye.com/conflict
                    title: Conflict
                    status: 409
                    detail: That Idempotency-Key is still being processed.
                    code: conflict
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An **opaque** token issued by identity, presented as
        `Authorization: Bearer <token>`. There is no claim document inside it and
        no published key set to verify one against: identity's token is `cafaye_`
        plus random bytes and the row holds a SHA-256 of it. So courier does not
        verify it locally — courier **asks identity**,
        `POST /v1/introspections`, and reads the answer.

        The `bearerFormat` below is deliberately absent rather than `JWT`. It was
        `JWT`, and it was wrong: a client reading `bearerFormat: JWT` builds a
        client that parses a token courier never parses. `type: http` with
        `scheme: bearer` is the whole of what courier actually checks, and a
        document that overstates a credential is a document a generated client is
        built wrong from.

        ## The scopes below are declared and NOT enforced
        Every operation here names a scope — `webhooks:read`, `notifications:write`,
        `messages:write` — and **courier does not check any of them yet.** That is
        a decision with a measured reason rather than an omission:

          * courier parses the scope set out of identity's answer, under **both**
            claim names (`scopes` and `scope`, which identity emits byte for byte
            because the fleet has not agreed on one), and carries it on the
            principal;
          * identity's scope vocabulary is a **closed set of six** —
            `accounts:read`, `accounts:write`, `accounts:delete`,
            `oidc_clients:write`, `audit_log:read`, `account_invitations:write`
            — and **not one of the five names declared below can be minted by
            it.** A check written today would refuse every credential identity is
            able to issue.

        So these names are the **intent**, and the thing courier actually enforces
        is tenancy: is there a principal, and is the resource in that principal's
        `account_id`. The day identity's vocabulary grows these names, the check is
        one comparison and nothing else in this document moves. What this document
        must not do is claim a 403 — it does not, and `CourierWeb.Plugs.Principal`
        does not send one.

    webhookSignature:
      type: apiKey
      in: header
      name: svix-signature
      description: |
        **Not a token: a signature the sender computes over the body.**

        This is the [Standard Webhooks](https://www.standardwebhooks.com) scheme,
        the one courier signs its *outbound* deliveries with, read from the other
        side — Resend signs with [Svix](https://docs.svix.com), which is the scheme
        Standard Webhooks was standardised from, so the identical base string,
        algorithm, `v1` prefix and space-delimited rotation list apply in both
        directions. A receiver can therefore verify a delivery from this service
        and courier can verify one from Resend with the same reference
        implementation.

        It is declared as an `apiKey`-in-header scheme because that is what
        OpenAPI 3.1 has for "a credential in a header that is not a bearer token",
        and it is declared **rather than left as `security: []`** because an empty
        `security` tells a generated client the operation is *unauthenticated*,
        which is the opposite of the truth. This operation is authenticated; the
        credential just happens to be computed rather than issued.

        The three headers it needs are declared as parameters on the operation —
        `svix-id`, `svix-timestamp` and `svix-signature` — because this scheme
        **names the one header here but requires all three**, and a document that
        declared only the one would be telling a client to send a signature with
        nothing to sign.

  parameters:
    SvixId:
      name: svix-id
      in: header
      required: true
      description: |
        The delivery's own id. It is part of the signed base string
        (`msg_id.timestamp.payload`), so it cannot contain a full stop — a dot
        would let a sender append fields to a string the receiver treats as
        verified.

        courier does **not** use it as an idempotency key, and the operation's
        description says why: one delivery can name many recipients, and keying on
        the header would collapse a broadcast into one suppression.
      schema: { type: string, minLength: 1, pattern: '^[^.]+$' }

    SvixTimestamp:
      name: svix-timestamp
      in: header
      required: true
      description: |
        When the delivery was signed, as a bare integer of seconds since the epoch.
        It must be a bare integer: the receiver builds the base string from the
        header's own bytes, so a lenient parse would verify one string and act on
        another.

        It is also courier's **replay window**. A signature outside ±300 seconds is
        refused even when it is otherwise correct, which is the other half of
        replay protection — the unique index handles a replay *inside* the window,
        and the window handles one outside it.
      schema: { type: integer }

    SvixSignature:
      name: svix-signature
      in: header
      required: true
      description: |
        The signature, as `v1,<base64 HMAC-SHA256>` over
        `svix-id.svix-timestamp.body`.

        **Space-delimited, and that is not incidental**: a producer rotating its key
        sends the current and the previous signature together, and an unrecognised
        identifier in the list is skipped rather than refused so it cannot stop the
        `v1` entry beside it from being found. So courier's key rotation needs no
        downtime and no coordination beyond the provider-side change.

        The comparison is constant-time. A verifier that is merely correct is not
        enough — the scheme's own guidance is that failing to compare in constant
        time "can expose consumers to timing-attacks and turn them into signing
        oracles".

        The `webhook-` prefixed spellings are accepted as well, because the scheme
        says headers "should be prefixed with `webhook-`" and Svix sends `svix-`
        unless an account is white-labelled.
      schema: { type: string, pattern: '^v1,[A-Za-z0-9+/=]+' }

    UserId:
      name: user_id
      in: path
      required: true
      description: |
        A uuid from identity. courier does not own users and holds no foreign key
        to them, so this is checked for *shape* and nothing else: a non-uuid is a
        422 before the body is looked at, and a well-formed id courier has never
        seen is a 200 with the defaults.
      schema: { type: string, format: uuid }

    EndpointId:
      name: id
      in: path
      required: true
      description: The endpoint's uuid.
      schema: { type: string, format: uuid }

    NotificationId:
      name: id
      in: path
      required: true
      description: |
        The notification's uuid. Checked for shape only — a non-uuid is a 404
        rather than a 422, because the two questions "does this belong to you?"
        and "does this exist?" are the same question for a row the caller cannot
        see, and a distinct answer for a malformed id would be an oracle that
        tells a caller which ids are well-formed.
      schema: { type: string, format: uuid }

    UnsubscribeToken:
      name: token
      in: path
      required: true
      description: |
        **The authorization, and also the resource's address** — which is why a
        token that names nothing is a `404` and not a `401`.

        32 bytes of `:crypto.strong_rand_bytes/1`, URL-safe base64 with no
        padding, so 43 characters. courier stores only a SHA-256 of it: the token
        exists in the `List-Unsubscribe` header of one message and in the mail
        client that received it, so a database dump is not a list of mailboxes
        anybody can unsubscribe.

        RFC 8058 §3.1 asks for exactly this — "The URI SHOULD include an opaque
        identifier or another hard-to-forge component **in addition to, or
        instead of,** the plaintext names of the list and the subscriber" — and §6
        gives the reason it is not optional: a malicious mailer could otherwise
        send spam carrying links to a victim list and cause unsubscriptions "as a
        side effect of users reporting the spam".

        **The token never names the address.** It is opaque, so an attacker who
        reads this parameter out of somebody's mail learns nothing about anybody's
        mailbox beyond what the `To:` header already said, and the row behind it
        is found by digest rather than by parsing.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'

    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 25, capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor from a previous page's `page.next_cursor`. Clients must
        not parse it; courier's encoding may change without notice. A cursor
        courier did not issue is a 422.
      schema: { type: string }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A uuid the client chooses, which makes a retry of this request free.

        Send it, and a retry with the **same** key and the **same** body returns
        the first response byte for byte with `Idempotency-Replayed: true` — for
        `createWebhookEndpoint` that includes the signing secret, which exists in
        exactly one response and cannot be re-derived. Without it a caller that
        timed out cannot know whether the first attempt landed, and retrying a
        webhook registration produces a second destination courier will sign for.

        Three cases, and a client can tell them apart by `code`:

        | you sent | you get | `code` |
        | --- | --- | --- |
        | same key, same body, already answered | the first response, with `Idempotency-Replayed: true` | — |
        | same key, different body | 409 | `idempotency_key_reused` |
        | same key, same body, first attempt still running | 409 | `conflict`; retry the same request shortly |

        Omitting the header is not an error: the request is processed normally,
        and a retry without a key is the client's own problem. A key that is not a
        uuid is a 422 — the header is a uuid because an unbounded string in a
        unique index is a cost every write pays.

        The key is scoped to the `(account, endpoint, key)` triple, and `endpoint`
        is the **concrete** path, so the same key used to test two different
        endpoints is two different keys. Retention is 24 hours, after which the
        key behaves as though it had never been used. Only a 2xx is stored, so a
        request that failed leaves the key free to use again immediately.
      schema: { type: string, format: uuid }

    IdempotencyReplayed:
      name: Idempotency-Replayed
      in: header
      required: false
      description: |
        `true`, and **only** on a response that is a stored replay of an earlier
        request rather than the answer to the one in front of courier. A client
        that receives it knows the mutation happened exactly once. Absent on every
        first response, and absent on every request sent without a key.
      schema:
        type: string
        enum:
          - 'true'

  schemas:
    SendMessageRequest:
      type: object
      required: [type, user_id, to]
      description: |
        What to send, to whom, and who it is about.

        **The vocabulary is closed.** An unknown field is a 422 naming it, rather
        than a field courier silently discards — a misspelled `emai_enabled` that
        was ignored would leave a caller believing a setting had taken effect.
        `account_id` is in that set: the account is the principal's and never the
        body's.
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        user_id:
          type: string
          format: uuid
          description: |
            The user this send is about, and the key the recipient's preferences
            are read by. Checked for shape only — courier holds no foreign key to
            identity's users. A non-uuid is a 422: it could key no preference and
            attribute no event.
        to:
          type: string
          format: email
          description: |
            The recipient. courier's payload calls this field `email` because that
            is what the platform's event payloads carry; over HTTP it is `to`,
            which is the mail vocabulary.

            This address is checked against courier's suppression list before
            anything is sent, so a mailbox that hard-bounced or reported a previous
            message as spam is a **409 `conflict`** — see the operation.
        name:
          type: string
          nullable: true
          maxLength: 255
          description: |
            The recipient's display name, used in the greeting. Optional; courier
            falls back to a bare greeting when it is absent.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The link the message carries — the reset link, the invitation link,
            the confirmation link. Required by `password_reset`,
            `team_invitation` and `email_change_current` and unused by `welcome`,
            which is why its absence is a 422 naming `url` rather than a silently
            linkless mail.
        account_name:
          type: string
          maxLength: 255
          description: Required by `team_invitation` only.
        invited_by:
          type: string
          maxLength: 255
          description: Required by `team_invitation` only.
        role:
          type: string
          maxLength: 255
          description: |
            The role offered by a `team_invitation`. Optional and unvalidated
            against any list — courier has no role vocabulary of its own, and
            inventing one would put a second source of truth next to identity's.
        reason:
          type: string
          maxLength: 255
          description: |
            Which of the two `account_security` facts happened — `password reset`
            or `email address changed`. Required by that type only: the template
            branches on it, and a notice that does not name which one happened
            forces the reader to guess between two different remediations.
        previous_email:
          type: string
          format: email
          maxLength: 255
          description: |
            The address the account is moving from, carried by `email_change_new`
            so the new address's owner is told where the account lived before.
            Required by that type only.

    SendMessageResult:
      type: object
      required: [message_id, event_id, notification_type, user_id, status]
      properties:
        message_id:
          type: string
          description: |
            courier's id for this message, and the one on the wire as the
            `Message-ID` header. A bounce or a complaint quoting it can be tied
            back to this send, which is the entire reason it is returned.
        event_id:
          type: string
          format: uuid
          description: |
            The `courier.email.delivered` outbox row written in the same
            transaction as the send, so a caller can correlate its own send with
            the event every subscriber on the bus sees.
        notification_type:
          $ref: '#/components/schemas/NotificationType'
        user_id:
          type: string
          format: uuid
          description: The user this send was about, as the body named them.
        status:
          type: string
          enum: [accepted]
          description: |
            Always `accepted`, and never `delivered`. A submission protocol's whole
            reply is "accepted for delivery"; courier has no delivery receipt and
            will not imply one it does not hold. A client that needs to know the
            mail arrived has to wait for the bounce, not read this field.

    InboundReportCounts:
      type: object
      required: [received, recorded, duplicates, ignored, events]
      description: |
        What one delivery did, counted per **recipient** rather than per request.

        There is no status for "courier read this report and had no opinion on it",
        so the counts carry that distinction instead: an event type courier has read
        and does nothing about answers `200` with all five at zero, and a provider
        that is told so by a `2xx` stops retrying it. A soft bounce answers `200`
        with `ignored` above zero and `recorded` at zero.

        These are **counts and nothing else**. No address, no identifier, no part of
        the payload: the suppression table has no `account_id` and is not exposed
        through any route, so a value in here would be a way to ask courier questions
        about mailboxes it holds.
      properties:
        received:
          type: integer
          minimum: 0
          description: |
            Reports the payload contained, one per recipient. A broadcast to five
            addresses is `5`, because the unit courier acts on is one address.
        recorded:
          type: integer
          minimum: 0
          description: |
            Suppression rows newly written. This is the number that stops courier
            mailing that mailbox.
        duplicates:
          type: integer
          minimum: 0
          description: |
            Reports courier already held. A redelivery is a normal event and is
            answered `200`, never a `409` — a provider retrying a report courier has
            has done nothing wrong.
        ignored:
          type: integer
          minimum: 0
          description: |
            Temporary failures (RFC 5321 §4.2.2 — mailbox full, greylisted). courier
            records **nothing** about these on purpose: suppressing on one is how a
            suppression list starts eating live addresses.
        events:
          type: integer
          minimum: 0
          description: |
            `courier.email.bounced` / `courier.email.complained` outbox rows
            written, in the same transaction as the suppression. Equal to `recorded`
            except when a report's `Message-ID` names no send courier made, in which
            case the suppression is recorded and no event is published.

    ResendReport:
      type: object
      description: |
        One Resend deliverability report, as documented at
        <https://resend.com/docs/webhooks/emails/bounced> and its siblings.

        **This is the provider's schema, not courier's.** courier does not validate
        it and does not accept fields it does not read — the opposite of
        `sendMessage`, whose vocabulary is closed and refuses an unknown field. The
        asymmetry is the point: `sendMessage`'s body is written by a caller who
        cannot fix a typo after the fact, whereas this body is written by a provider
        whose schema courier does not control, and refusing a field courier simply
        has no use for would turn a provider's harmless addition into a delivery
        courier rejects.

        courier **reads** a closed subset of it, and an event type it has not read
        is a `422` rather than a silent no-op — so a provider that adds one produces
        a log line instead of courier quietly recording nothing. That is the
        fail-closed choice, and it costs a retry loop on a change courier cannot
        make sense of; the alternative is silence about a change somebody needed to
        see.
      required: [type, created_at, data]
      properties:
        type:
          type: string
          description: |
            The event. `email.bounced` and `email.complained` are the two courier
            acts on; `email.delivery_delayed` and the other deliverability events
            are understood and have no opinion; a type courier has not read is a
            `422` naming this field.
          examples: [email.bounced, email.complained, email.delivery_delayed]
        created_at:
          type: string
          description: |
            When the **report** happened, RFC 3339. Read at the top level rather than
            from `data`, because `data.created_at` is when the email was sent — hours
            earlier, and the wrong answer to "when did this address bounce".
        data:
          type: object
          properties:
            email_id:
              type: string
              format: uuid
              description: |
                The provider's id for the message. **A broadcast shares one of these
                across every recipient**, which is why courier's deduplication key
                also carries the address.
            message_id:
              type: string
              description: |
                The `Message-ID` courier wrote when it sent the message, quoted back
                as the provider received it. It is how courier ties the report to the
                send — and therefore to the `user_id` and notification type an event
                about it has to carry.

                Optional, and a report without one is not an error: the suppression
                is recorded and no event is published.
            to:
              type: array
              items: { type: string, format: email }
              description: |
                Every recipient the report is about. One suppression per entry, and
                one entry that is not an address courier could send to refuses the
                **whole** report rather than half-applying it.
            bounce:
              type: object
              description: Present on `email.bounced` only.
              properties:
                type:
                  type: string
                  enum: [Permanent, Transient, Temporary, Undetermined]
                  description: |
                    `Permanent` stops the send (RFC 5321 §5.1.1). The other three are
                    temporary and courier records **nothing** about them — including
                    `Undetermined`, which is a *known* value meaning "the provider
                    does not know", and is deliberately read as soft: being told
                    there was a bounce is not being told the mailbox is gone. A value
                    outside this list is a `422`, so a provider that adds one is
                    visible rather than silently soft.
                subType: { type: string }
                message: { type: string }
                diagnosticCode:
                  type: array
                  items: { type: string }
                  description: |
                    The receiving server's own SMTP replies. Kept because "5.1.1
                    does not exist" is the sentence an operator actually needs, and
                    it lands in courier's logs rather than in the suppression row.

    UnsubscribeResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [unsubscribed]
              description: |
                Always this one word, and **the same word on a replay** — a mail
                client that retries a `POST` courier already honoured gets the
                answer the first one got rather than an error.

                It is deliberately the whole of the response. No address, no user
                id, no notification type: the caller is a mail client on an
                unauthenticated surface, and anything echoed back is available to
                whoever found the URL. Whether the unsubscribe was *newly* recorded
                or was already in force is a fact courier's own logs and its
                outbox hold, not something this surface reports.
      description: |
        The answer both `unsubscribe` operations give, and it is the same shape for
        the `GET` and the `POST` because they are the same action.

    NotificationType:
      type: string
      enum: [welcome, password_reset, team_invitation, account_security, email_change_current, email_change_new]
      description: |
        Every notification type courier sends. A type outside this list is a 422
        naming `preferences[0].notification_type`, because a preference for
        something courier will never send is a setting page that lies to the user.

    NotificationPreference:
      type: object
      required: [notification_type, email_enabled, push_enabled]
      properties:
        notification_type: { $ref: '#/components/schemas/NotificationType' }
        email_enabled:
          type: boolean
          description: |
            Whether courier will send this type to this user by email. Defaults
            to true: silence is not consent.
        push_enabled:
          type: boolean
          description: |
            Stored and returned so the answer is complete, but nothing sends push
            — a `true` here does not mean courier will send a push.

    NotificationPreferences:
      type: object
      required: [user_id, preferences]
      properties:
        user_id:
          type: string
          format: uuid
          description: The user these preferences are for, as the path named them.
        preferences:
          type: array
          description: |
            Every notification type, always all of them and never a subset: a
            settings page should not have to guess what it has not been told.
          items: { $ref: '#/components/schemas/NotificationPreference' }

    Notification:
      type: object
      required: [id, notification_event_id, seen_at, read_at]
      description: |
        One in-app notification: something that happened, addressed to one
        person, with the two facts about whether they have looked at it.

        `seen_at` and `read_at` are different facts and both are nullable:

        * `seen_at` — "this appeared in a list". Nobody had to open anything; it
          was on screen in an inbox. This is what a badge can honestly count.
        * `read_at` — "this person opened it". A deliberate act.

        A row that is read and not seen is not a state this service produces —
        the database refuses it (`check (read_at is null or seen_at is not
        null)`) — so `read_at` is never null while `seen_at` is.

        **The recipient is not in the response.** It is the caller's own identity
        subject by construction, so echoing it would be confirming a fact the
        request never established. `account_id` is courier's tenancy key and is
        not in the response for the same reason.
      properties:
        id:
          type: string
          format: uuid
          description: courier's row id, which a client needs to mark a row.
        notification_event_id:
          type: string
          format: uuid
          description: The event this notification is about, for correlation.
        seen_at:
          type: string
          format: date-time
          nullable: true
          description: When it first appeared in a list, or null if it never has.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: When the person opened it, or null if they have not.

    WebhookEndpointStatus:
      type: string
      enum: [enabled, disabled]
      description: |
        `disabled` is two things wearing one column: the customer turned it off,
        or courier's circuit breaker tripped. `disabled_reason` tells them apart,
        and is courier's to clear.

    WebhookEndpoint:
      type: object
      required: [id, account_id, url, status, consecutive_failures]
      properties:
        id: { type: string, format: uuid }
        account_id:
          type: string
          format: uuid
          description: The owning account. Always the caller's.
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, nullable: true, maxLength: 500 }
        status: { $ref: '#/components/schemas/WebhookEndpointStatus' }
        consecutive_failures:
          type: integer
          description: |
            Failures since the last success. At the circuit threshold courier
            disables the endpoint and records why.
        disabled_reason:
          type: string
          nullable: true
          description: |
            Why delivery stopped, when courier is the one who stopped it. Null for
            an endpoint the customer disabled, and null again once they re-enable
            one courier had tripped.

    WebhookEndpointPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookEndpoint' }
        page:
          type: object
          required: [has_more, next_cursor]
          properties:
            has_more: { type: boolean }
            next_cursor:
              type: string
              nullable: true
              description: Null on the last page.

    Problem:
      type: object
      description: RFC 9457, with courier's extensions. Every non-2xx.
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          format: uri
          description: '`https://errors.cafaye.com/<code>`. The machine-readable contract.'
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Specific to this occurrence. Not parsed by clients.
        instance:
          type: string
          nullable: true
          description: The path the request was made to.
        code:
          type: string
          description: The last segment of `type`, in snake_case.
        trace_id:
          type: string
          description: Matches the `X-Trace-Id` response header. Support starts here.
        errors:
          type: array
          description: Present only on a 422.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: The path in the *request*, which is what the caller can fix.
              code:
                type: string
                # Additive. `unknown_field`, `required` and
                # `unknown_notification_type` are `sendMessage`'s, and each earns
                # its place: `CourierWeb.Messages` has a closed vocabulary, so a
                # key courier does not read (`account_id`, a misspelled
                # `emai_enabled`) is a refusal the caller can act on rather than a
                # field silently discarded — and a client that switches on `code`
                # needs to tell "you sent me a field I do not have" from "the value
                # in a field I do have is wrong".
                #
                # `notification_preferences_disabled` is the one code here that is
                # not about syntax at all, and it is here rather than nowhere
                # because `errors[]` is core's only machine-readable extension and
                # a declined preference is a per-field refusal a client has to be
                # able to act on. The alternative was a 409 indistinguishable from
                # a suppressed mailbox, which is worse: two different remedies
                # behind one code.
                #
                # The last three are `receiveResendReport`'s, and they are the same
                # argument from the other direction. That operation's `errors[]` is
                # courier declining to ACT on a report it read, and a provider has
                # to be able to tell "you have introduced an event type courier does
                # not read" from "you sent a bounce type courier does not know" from
                # "one of your addresses is malformed" — three provider-side
                # changes with three different fixes. A single `invalid_format`
                # behind all three is a code that tells a sender nothing, and a
                # refusal a reader cannot act on is a note rather than a diagnosis.
                # `unsubscribed` arrived with the one-click endpoint and is the
                # third refusal of the same shape and the third *remedy*: a
                # declined preference is reversible through the `PUT` beside it, a
                # suppressed mailbox is not courier's to reverse, and a
                # one-click unsubscribe is neither — `email_suppressions` is
                # immutable and no route clears a row. Three refusals at one status
                # behind one code would tell a caller nothing about which of the
                # three things to do next, so they are told apart here.
                enum: [invalid_format, taken, blocked_scheme, blocked_host, blocked_address, dns_failure, unknown_field, required, unknown_notification_type, notification_preferences_disabled, unsubscribed, unsupported_event, unknown_bounce_type, invalid_recipient]
              detail:
                type: string
                description: |
                  Why this one field was refused, when courier has something to add
                  to `code` — a bad `limit` reads "is not a positive integer"
                  rather than only `invalid_format`. Present on some entries and
                  not on others, so a client must not require it.

  responses:
    BadRequest:
      description: |
        The body was not the shape courier was sent. This is 400 and not 422
        because a client could not have known: the request never parsed, so
        there is no field to name and nothing to correct.

        **On `receiveResendReport` this response is reachable only with a valid
        signature**, and that is the security property rather than a limitation: the
        signature is verified before the body is read, and the endpoint's parser is
        deliberately skipped for that route, so an unsigned malformed body is a
        `401` and is told nothing about whether courier could have read it. This
        response is also what a body **larger than courier will read** gets — 1 MiB,
        a bound that exists because the route is unauthenticated and an unbounded
        read is a denial of service handed to whoever finds the URL, while every
        documented provider report is a few kilobytes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/bad_request
            title: Bad request
            status: 400
            detail: The request body was not valid JSON.
            code: bad_request
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotAcceptable:
      description: |
        The request's `Accept` header does not include `application/json`, so
        Phoenix's `:accepts` plug refused to route it. This is the client naming a
        media type courier cannot answer, and courier says so with
        `not_acceptable` rather than with `internal`: an earlier version of courier
        fell through to the `:internal` default here and reported a client that had
        asked for `text/html` as courier having failed, which is the one code every
        generated client retries. Reachable on every operation in this document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_acceptable
            title: Not acceptable
            status: 406
            detail: courier answers application/json.
            code: not_acceptable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Unauthorized:
      description: |
        No authenticated caller. courier does not guess an account for an
        anonymous request.

        **Not this operation's 401.** `receiveResendReport` authenticates by
        signature rather than by token, and its 401 means something else — see
        `SignatureRejected`, which is a response of its own for exactly that reason.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unauthorized
            title: Unauthorized
            status: 401
            detail: This request needs an authenticated caller.
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c

    SignatureRejected:
      description: |
        The request did not carry a valid **provider signature**, so courier did not
        read it and **recorded nothing**. This is `receiveResendReport`'s 401, and
        it is a response of its own rather than the `Unauthorized` every other
        operation shares, because the two mean different things: that one is "no
        bearer token", this one is "not from the provider".

        **The signature is checked before the body is parsed, and nothing upstream
        decodes it either** — this operation's body is deliberately left unparsed by
        the endpoint's `Plug.Parsers`, so the bytes that arrive are the bytes that
        were signed. Two consequences a client should read twice:

          * **a forged request is told nothing about its payload.** An unsigned
            request carrying malformed JSON gets this, not a `400`. A `400` would
            confirm that courier decoded a body nobody authenticated;
          * **a correctly-signed request carrying malformed JSON gets a `400`
            instead.** This response is reachable *with* a valid signature, and the
            body's `400` is reachable only that way.

        The `detail` names courier's own reason and **never repeats a value from the
        request** — an echoed signature, id or timestamp is an oracle telling a
        forger which part to fix. The specific reason is in courier's logs under the
        same `trace_id`.

        **It is not courier's misconfiguration.** A courier that holds no signing
        secret, or one it cannot decode, answers `500` instead: a route answering
        401 to its own misconfiguration is indistinguishable from one under attack,
        and the operator's first question would be the wrong one. See the
        operation's description.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unauthorized
            title: Unauthorized
            status: 401
            detail: >-
              This request did not carry a valid provider signature, so courier did
              not read it. The signature does not match the body received.
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c

    ReportNotActionable:
      description: |
        The request **was** authentic and courier **did** read it, and it will not
        act on it — an event type courier has not read, a bounce type outside the
        documented vocabulary, a field the report needs and does not carry, or an
        address that is not an address courier could send to.

        A `422` and not a `200` is the whole decision. A `200` would be courier
        claiming it did something with a report it could not read, which is the
        silence `Courier.Inbound.Resend` refuses: a provider that adds an event type
        should produce a log line, not nothing. A `422` tells the provider courier
        understood the request and will not act on it.

        A `422` and not a `400` is core's own line — 400 is for malformed syntax
        there is no field to name for, and this report is well-formed. The body that
        is not JSON at all is a `400` instead, and only a **signed** one can reach
        it.

        `errors[].code` says which refusal, and `errors[].field` is named as the
        provider's own documentation spells it (`bounce`, `to`, `type`, …) rather
        than as a path into courier's envelope: the sender wrote `bounce`, not
        `data.bounce`, and a field a sender cannot find in the body it sent is not a
        field it can fix.

        **No value from the payload is echoed.** In particular a rejected address is
        not quoted back — it is in courier's logs, and the response says only that
        one of the addresses is not one courier could send to. The suppression table
        has no `account_id` and is not exposed through any route, so an address in a
        response body would be a way to query mailboxes courier holds.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unclassifiable_event:
              summary: An event type courier has not read
              value:
                type: https://errors.cafaye.com/validation_failed
                title: Validation failed
                status: 422
                detail: >-
                  courier could not act on this report. It is an event type courier
                  has not read, and courier does not act on an event it cannot
                  classify.
                code: validation_failed
                trace_id: 0af7651916cd43dd8448eb211c80319c
                errors:
                  - field: type
                    code: unsupported_event
            unknown_bounce_type:
              summary: A bounce type outside the documented vocabulary
              value:
                type: https://errors.cafaye.com/validation_failed
                title: Validation failed
                status: 422
                detail: >-
                  courier could not act on this report. Its bounce type "Ragequit" is
                  not one of the types courier has read.
                code: validation_failed
                trace_id: 0af7651916cd43dd8448eb211c80319c
                errors:
                  - field: bounce
                    code: unknown_bounce_type
            bad_recipient:
              summary: An address that is not one courier could send to
              value:
                type: https://errors.cafaye.com/validation_failed
                title: Validation failed
                status: 422
                detail: >-
                  courier could not act on this report. One of the addresses it names
                  is not an address courier could send to.
                code: validation_failed
                trace_id: 0af7651916cd43dd8448eb211c80319c
                errors:
                  - field: to
                    code: invalid_recipient

    ReportNotRecorded:
      description: |
        courier read the report and **could not write it**. The transaction unwound,
        so nothing is half-recorded: no suppression without its event, and no event
        about a mailbox courier does not hold.

        `503` and not `500`, and the same argument `sendMessage`'s `503` makes:
        courier is fine and its database is not, which is the whole difference
        between a provider retrying and a provider filing a bug against courier.

        **The retry is safe and it is the designed path, not a fallback.** The
        deduplication is a unique index, so a redelivery of a report courier already
        holds is answered `200` with `data.duplicates` above zero and writes
        nothing. A provider that receives this should retry the same bytes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unavailable
            title: Service unavailable
            status: 503
            detail: >-
              courier could not record this report, so nothing was written and no event
              was published. The report is safe to retry: delivery is at-least-once and
              the same report recorded twice is one row.
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    UnsubscribeNotRecorded:
      description: |
        courier read the token and **could not write the answer**. The transaction
        unwound, so there is no preference without its event and no event about an
        answer courier does not hold — and the unsubscribe has **not** happened,
        so the same request is safe to repeat.

        `503` and not `500`, on the same argument `ReportNotRecorded` makes:
        courier is fine and its database is not, which is the difference between a
        mail client retrying and a mail client giving up. A mail client that gets
        this and does not retry has left a recipient subscribed, which is the
        outcome the one-click requirement exists to prevent.

        **This is not the `Unavailable` a principal's resolver sends.** That one
        means identity could not be reached; this one means this request could not
        be recorded, and the two operations are behind different things entirely.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/unavailable
            title: Service unavailable
            status: 503
            detail: >-
              courier could not record this unsubscribe, so nothing was written and no
              event was published. It is safe to try again.
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotFound:
      description: |
        No such endpoint, for this account. An endpoint belonging to another
        account is also a 404: core's conventions forbid a 403 here, because it
        leaks the existence of a resource the caller cannot see.

        **On the two `unsubscribe` operations this is "no such token"**, and it is
        the only status those operations can send for a token courier did not
        issue. It is a `404` and not a `401` because the token is the resource's
        address rather than a credential presented to a door, and it covers a token
        of the wrong shape and one that is not a string as well — one answer, so
        the endpoint is not an oracle that can be used to test tokens.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: No webhook endpoint with that id.
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotificationPreferencesNotFound:
      description: |
        The preferences for this user id exist and belong to another account.

        Not a 403, for the reason the webhook `NotFound` above gives: a 403 would
        tell a caller that this user id has preferences at all, which is the only
        fact this 404 exists to withhold.

        It is deliberately **narrow**. A user nobody has written preferences for is
        a `200` with the defaults on both operations, because courier holds no
        foreign key to identity's users and cannot tell an account's user from one
        that does not exist. This response means "there is something here and it is
        not yours", and only a stored row can make it true.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: No notification preferences with that user id.
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotificationNotFound:
      description: |
        The notification exists and belongs to another account, or is addressed to
        a different recipient, or the id is not a uuid at all.

        Not a 403, for the reason the webhook `NotFound` above gives: a 403 would
        tell a caller that this id has a notification at all, which is the only
        fact this 404 exists to withhold. The two questions — "does this belong
        to you?" and "does this exist?" — are the same question for a row the
        caller cannot see, and `Courier.Notifications` answers `{:error,
        :not_found}` for exactly the two cases.

        **A non-uuid id is a 404 too, and that is deliberate.** A distinct answer
        for a malformed id would be an oracle that tells a caller which ids are
        well-formed, and the shape of the error leaks nothing about whether the row
        exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: No notification with that id.
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    IdempotencyKeyReused:
      description: |
        The client sent an `Idempotency-Key` it has already used on this endpoint
        **with a different body**. Core's conventions: "Replay with the same key
        but a different body returns 409 `idempotency_key_reused`."

        A client bug, and the fix is in the request: either send the original body
        again to get the original response, or choose a new key. courier will not
        guess which of the two bodies was intended.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/idempotency_key_reused
            title: Idempotency key reused
            status: 409
            detail: That Idempotency-Key was already used for a different request body.
            code: idempotency_key_reused
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Conflict:
      description: |
        The client sent an `Idempotency-Key` whose first request on this endpoint
        is **still being processed**, so there is no stored response to replay
        yet. Two requests with one key arriving at the same time is not a retry.

        Not `idempotency_key_reused`: the bodies are identical, and telling a
        client its key was reused with a different body when it was not is the kind
        of lie a retry loop is built on. Retry the same request with the same key
        shortly and the answer will be the original one.

        Core's `openapi-conventions.md` §Idempotency does not describe this case.
        It is courier's, and `conflict` is a code core already reserves at 409.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/conflict
            title: Conflict
            status: 409
            detail: That Idempotency-Key is still being processed.
            code: conflict
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Internal:
      description: |
        courier failed and the client did nothing wrong. **Every operation in this
        document can answer this one**: it is what `Phoenix.Endpoint.RenderErrors`
        renders for any unhandled raise, including a database that has stopped
        answering. The envelope is courier's and carries the request's
        `trace_id`; the cause is in courier's logs under that id and is not
        repeated to the caller, because these bodies are read by anyone who can
        reach the service.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/internal
            title: Internal server error
            status: 500
            detail: The request could not be completed.
            code: internal
            trace_id: 0af7651916cd43dd8448eb211c80319c

    MessageSuppressed:
      description: |
        The recipient's mailbox cannot be written to, and courier will not write
        to it. **A 409 and not a 422**, because this is not a property of the
        request: a hard bounce (RFC 5321 §5.1.1, permanent failure) and a spam
        complaint (RFC 2142 §5, an abuse report) are facts about a *mailbox*,
        recorded by a provider and not chosen by the caller. 409 `conflict` is
        core's own code for a request colliding with the current state of a
        resource, and it is the status that tells a generated client **not to
        retry**.

        The suppression list is not exposed through any route, so this response is
        the only place the fact surfaces, and it is shaped accordingly: it does
        **not** echo the address, and it carries no `errors[]`, because core
        reserves that for 422 and this is not a field failure. The two states are
        described in `detail` in words only — an operator's response to each is
        different (a pile of `undeliverable` is list hygiene, a pile of complaints
        is a content and sender-reputation problem), and a machine-readable code
        here would turn this response into the one place a caller could probe the
        list.

        `email_suppressions` carries no `account_id` by design, so this is a fact
        about a mailbox rather than about another tenant's data, and it is the same
        posture the send path takes when it answers "no mail went out" rather than
        "here is a list".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            undeliverable:
              summary: The mailbox hard-bounced a previous message
              value:
                type: https://errors.cafaye.com/conflict
                title: Conflict
                status: 409
                detail: >-
                  That mailbox does not exist: it hard-bounced a previous message,
                  and courier does not write to a mailbox that has said it is gone.
                code: conflict
                trace_id: 0af7651916cd43dd8448eb211c80319c
            complained:
              summary: The recipient reported a previous message as spam
              value:
                type: https://errors.cafaye.com/conflict
                title: Conflict
                status: 409
                detail: >-
                  That recipient reported a previous message as spam. courier does
                  not write to someone who has asked not to be written to.
                code: conflict
                trace_id: 0af7651916cd43dd8448eb211c80319c

    Unavailable:
      description: |
        courier could not complete this request because a dependency it does not
        control did not answer. **503 and not 500**, because courier is fine and
        the dependency is not — which is the whole difference between a generated
        client retrying and a generated client filing a bug against courier.

        **The retry is always safe.** On every authenticated operation courier has
        not read the body, has not reached a controller, and has written nothing —
        so this is the one response in this document with no side effects to
        reason about. A failed request also *releases* its `Idempotency-Key`
        rather than storing the failure, so retrying with the same key is not
        locked out for 24 hours.

        ## Two causes, and which operations can get which
        One response covers both because OpenAPI has one slot per status, and
        `sendMessage` can get either.

        **On EVERY operation behind `CourierWeb.Plugs.Principal`** —
        courier resolves a caller by asking identity's `POST /v1/introspections`
        about the token the request carries, because identity's token is opaque
        and has no claim to read locally. So authentication is a network hop on
        every one of them, and this response is what courier sends when:

          * **identity is unreachable, slow, or erroring**;
          * **courier's own credential is wrong** — identity answers 401 for a
            credential it does not accept, and 403 for one that may not ask about
            the token it named. Both are facts about *this deployment*, and
            neither is a fact about the caller's token;
          * **identity answered in a shape courier cannot read.**

        **`sendMessage` only** — the mail provider did not accept the message, or
        courier is not configured to deliver at all:

          * **the provider refused** — a relay that returned an error, a credential
            it rejected, a socket that would not open;
          * **courier cannot deliver** — `COURIER_MAIL_ADAPTER` names an adapter
            that never opens a socket, or names none. Nothing was sent and no
            outbox row was written, so nothing claims a delivery that did not
            happen.

        ## It is deliberately NOT a 401
        A 401 says "your credential is not acceptable". A dependency being down
        says nothing of the sort, and a client that reads this as one will rotate a
        token that was never the problem and be refused again. The case where a 401
        *is* correct — a token that is unknown, revoked, expired, or whose owner
        has left the account — is the case identity answers `200 {"active": false}`
        for, and courier turns that into a 401 with the same body every time. A
        caller therefore cannot tell those apart from this one, which is the
        property that stops a status an attacker provoked from being an oracle for
        whether a leaked token was live.

        ## The detail says nothing about the cause
        identity's status, the dial failure and the shape of its answer are in
        courier's logs under this response's `trace_id`. They are not here because
        this is a response anybody can provoke, and "courier could not confirm who
        is calling" tells a caller neither which credential courier holds nor what
        shape the service on the other side of it is.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            identityUnavailable:
              summary: courier could not ask identity who is calling
              value:
                type: https://errors.cafaye.com/unavailable
                title: Service unavailable
                status: 503
                detail: >-
                  courier could not confirm who is calling, so it is not serving this
                  request.
                code: unavailable
                trace_id: 0af7651916cd43dd8448eb211c80319c
            providerUnavailable:
              summary: sendMessage only — the mail provider refused
              value:
                type: https://errors.cafaye.com/unavailable
                title: Service unavailable
                status: 503
                detail: >-
                  The mail provider did not accept the message. Nothing was sent and
                  nothing was recorded, so this request is safe to retry with the same
                  Idempotency-Key.
                code: unavailable
                trace_id: 0af7651916cd43dd8448eb211c80319c

    ValidationFailed:
      description: |
        The request was well-formed and the thing it asked for is not allowed.
        `errors[].code` distinguishes a typo from a refused destination.

        On `sendMessage` this is also where a **declined preference** is answered,
        with `errors[0].code` `notification_preferences_disabled` and
        `errors[0].field` `type`. That is the opposite status from a suppressed
        mailbox, and deliberately so: a decline is visible through
        `GET /v1/notification_preferences/{user_id}` and changeable through the
        `PUT` beside it, so telling the caller to change something is the accurate
        answer — and `errors[]`, which core reserves for 422 and nothing else, is
        where a client can read that without parsing prose.

        **`errors[0].code` `unsubscribed` is the third answer of that shape, and it
        is the one with no remedy.** The recipient used the one-click unsubscribe
        button in an earlier message (RFC 8058), so courier records that and stops
        sending that notification type. It is a 422 for the same reason the decline
        is — the recipient's own answer is a per-field refusal — and a separate
        code because the two need opposite responses: a declined preference is one
        `PUT` away from being sent again, and an unsubscribe is not. Nothing in
        this API clears an `email_suppressions` row, and the `detail` says so
        rather than pointing a caller at a `PUT` that would not help.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://errors.cafaye.com/validation_failed
            title: Validation failed
            status: 422
            detail: That url is one courier will not send webhooks to.
            code: validation_failed
            trace_id: 0af7651916cd43dd8448eb211c80319c
            errors:
              - field: url
                code: blocked_address
