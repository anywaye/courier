apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: courier
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/anywaye/charts/courier
    chart: courier
    targetRevision: 0.1.2
  destination:
    server: https://kubernetes.default.svc
    namespace: courier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
