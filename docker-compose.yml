# courier's own compose file — an OVERRIDE, not a copy.
#
#   bin/dev            # fetch the pinned kit stack, merge it with this file, up
#
# USE `bin/dev`. The manual form works, and this file used to print it here
# WITHOUT the variable that makes it work:
#
#   KIT_COMPOSE_DIR=<kit>/templates/compose \
#   docker compose --project-directory . \
#     -f <kit>/templates/compose/docker-compose.yml \
#     -f ./docker-compose.yml up -d --wait
#
# `KIT_COMPOSE_DIR` is not optional and omitting it is silent. kit's compose file
# resolves its own build contexts and bind mounts through
# `${KIT_COMPOSE_DIR:-.}`, and compose resolves a relative path against the
# PROJECT DIRECTORY — which `--project-directory .` sets to courier's root. Drop
# the variable and the postgres initdb mount resolves to `<courier>/postgres/
# initdb`, a directory that does not exist, which Docker creates as an empty one.
# Measured on this file after the workaround described below was deleted:
#
#   $ docker compose --project-directory . -f <kit>/… -f ./docker-compose.yml config
#       source: /Users/…/wt-m39-courier-27/postgres/initdb        <- courier's tree
#   $ KIT_COMPOSE_DIR=<kit>/templates/compose docker compose … config
#       source: /Users/kaka/.cache/cafaye/kit/f6d3b74…/templates/compose/postgres/initdb
#
# The cluster comes up healthy either way, holding none of the fleet's
# databases. `bin/dev` sets the variable for exactly that reason, and the
# override this file used to carry had the same bug wearing a workaround's
# clothes.
#
# THIS FILE OWNS THREE THINGS AND NOTHING ELSE
#
#   1. the `postgres` service's database name and role   (kit ships the CLUSTER)
#   2. the `courier` service: its image, its port, its environment
#   3. the crash layer: where this container's stdout/stderr goes
#
# IT USED TO OWN A FOURTH, and the reason it no longer does is worth one line
# because it is the second time this file has carried a workaround for a kit
# defect. It re-pointed two of kit's own paths — the postgres build context and
# the initdb bind — at the fetched tree, because kit wrote them as bare
# `./postgres` and `bin/dev` runs compose with `--project-directory .`, the
# courier root, so compose resolved them to `<courier>/postgres`. That directory
# does not exist; Docker creates a missing bind source as an empty one; the
# mount succeeded, initdb ran nothing, and the cluster came up green holding
# none of the fleet's databases.
#
# kit@f6d3b74 prefixes both paths itself. The workaround is deleted rather than
# left commented, because a comment saying "delete this when kit is fixed" is
# a comment that survives the fix.
#
# WHY THERE IS NO `postgres:` CONTAINER HERE ANY MORE, and it is the first thing a
# reader will look for. kit's stack already ships one, and a second copy is two
# postgres majors to upgrade and a port collision on the second developer on the
# machine. Pointing at kit's is an ENVIRONMENT override, which is the one kind
# compose merges correctly.
#
# WHAT THIS FILE MAY NOT DO, and the collector is the reason
#
#   It may not touch `otel-collector`. Not its image, not its command, and above
#   all not the `volumes:` entry that mounts `otel-collector.yml`. That file
#   carries the redaction allowlist, which kit DERIVES from core's schemas; a
#   service that owned it would be shipping a telemetry boundary nobody derived, and
#   prompt content would leave the process inside it. kit's tests/fleet_check.py
#   fails this repository over any of the three, and the moment `kit.ref` exists
#   below, that failure has no discretion left in it.
#
# WHY THERE IS NO `depends_on: otel-collector`, and it is load-bearing
#
#   Nothing but the collector may be in a readiness path. A service that waits for
#   the collector serves no traffic while the collector is down, which is strictly
#   worse than serving traffic with no traces — and it teaches people to switch
#   telemetry off, which is the opposite of what this packet is for. kit's gate
#   fails on a `depends_on` naming the collector, and its
#   tests/no_telemetry_in_readiness.sh proves the property against a real collector
#   by killing it and showing the service still serving.
#
#   The same rule is why the span exporter has no retry: a collector that is not up
#   yet is the normal state of a fresh `docker compose up`, and the service must not
#   care.

services:
  postgres:
    # kit ships the postgres CLUSTER — one database and one role per service,
    # created by `initdb/10-cluster.sh`, with `REVOKE ALL ON DATABASE … FROM
    # PUBLIC` applied to every database in it. This block is courier's whole of
    # that, and every line in it is load-bearing.
    #
    # ---------------------------------------------------------------------
    # 1. WHAT COURIER DECLARES, AND WHAT IT MUST NOT
    # ---------------------------------------------------------------------
    #
    # `KIT_POSTGRES_DATABASES` is the single place courier's database AND its role
    # come from — one entry, one `CREATE ROLE`, one `CREATE DATABASE … OWNER`.
    # It is spelled out here rather than left to kit's default, so that a kit
    # release which changes the default cannot silently rename courier's database
    # out from under this file.
    #
    # It is written as `${…:-courier}` and NOT as a literal, and that is the part
    # that matters: this is the ONE key a developer has to extend to put a second
    # service on the same cluster. A committed `courier` here would be unoverrideable
    # from `.env`, and "one shared cluster, nine services" would be a description
    # rather than something a stack could do.
    #
    # POSTGRES_USER AND POSTGRES_DB ARE DELIBERATELY NOT OVERRIDDEN. This file used
    # to set both to `courier`, and both are wrong now:
    #
    #   POSTGRES_USER  is the cluster's ADMINISTRATOR. The official image creates
    #                  it as a superuser, and `10-cluster.sh`'s closing sweep grants
    #                  `CONNECT` on every database in the cluster to `current_user`
    #                  — so courier-as-admin is a role that can open every other
    #                  service's database. Measured, on that exact configuration:
    #
    #                    $ psql -U courier -d courier -tAc "create database identity"
    #                    CREATE DATABASE
    #                    $ psql -U courier -d identity -tAc "select id from invoices"
    #                    4242
    #                    $ psql -U courier -d courier \
    #                        -tAc "select has_database_privilege('public','identity','CONNECT')"
    #                    t
    #
    #                  Isolation by privilege is what makes the shared cluster
    #                  safe; isolation by superuser is the absence of it, wearing
    #                  the same green health check.
    #
    #   POSTGRES_DB    is the cluster's ADMINISTRATION database. It is not a
    #                  service's. Naming it `courier` also collides with the
    #                  `CREATE DATABASE courier` the init script runs, which is a
    #                  second failure this file would have shipped the moment
    #                  the init mount above stopped being empty.
    #
    # POSTGRES_PASSWORD IS NOT OVERRIDDEN EITHER, and for a different reason: every
    # role `10-cluster.sh` creates takes `$POSTGRES_PASSWORD`. It is therefore a
    # CLUSTER-wide setting — a per-service value would be a claim about two things
    # at once — and kit exposes it as `KIT_POSTGRES_PASSWORD` in `.env`. The URL
    # below interpolates it rather than hard-coding a pair, so a cluster password
    # changed in `.env` cannot leave this file authenticating as a password that
    # no longer exists. (A password containing `@` or `/` will not survive URL
    # interpolation unescaped; that is the cost of a per-service URL string, and
    # it is not worth a percent-encoder to keep a development default out of a
    # comment.)
    environment:
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES:-courier}
      # courier's SHARE OF THE CLUSTER'S CONNECTIONS, and it is larger than kit's
      # default of 10 because courier's own defaults do not fit inside 10.
      #
      # Measured on this stack, running the committed image against the cluster:
      #
      #   at rest, empty queues        11 concurrent connections
      #   with 60 jobs queued in `webhooks`   11 concurrent connections, peak
      #
      # 11 is `pool_size: 10` from config/runtime.exs plus one connection Oban
      # holds. The `queues: [outbox: 10, webhooks: 5]` concurrency does NOT add
      # fifteen more, because every Oban worker checks a connection out of that
      # same pool — which is why the number does not move under load.
      #
      # At kit's default of 10 courier does not start. Not "degrades", does not
      # start:
      #
      #   [error] Postgrex.Protocol failed to connect: ** (Postgrex.Error)
      #   FATAL 53300 (too_many_connections) too many connections for role "courier"
      #
      # 20 rather than 11 because this is a ceiling rather than a setting: 11 is
      # what courier needs TODAY, and the failure mode of being one connection
      # short is a service that cannot boot. The fleet arithmetic still closes —
      # nine services at 20 is 180 against `max_connections=200` — and that is
      # tight enough to be worth saying out loud rather than leaving to be
      # discovered by the ninth service.
      #
      # IT IS APPLIED AT INITDB AND NOWHERE ELSE. `10-cluster.sh` runs from
      # `docker-entrypoint-initdb.d`, which runs once per volume, so a developer
      # with an existing `postgres-data` keeps `CONNECTION LIMIT 10` after pulling
      # this and will watch courier fail to boot with the error above. The fix is
      # `bin/dev db grant` or one `bin/dev down -v && bin/dev up`, and
      # kit/templates/database/README.md says the same thing about every other
      # value in this block.
      KIT_POSTGRES_ROLE_CONNECTIONS: ${KIT_POSTGRES_ROLE_CONNECTIONS:-20}

  courier:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafaye/courier:dev
    # ON KIT'S `platform` NETWORK, and this line is not optional tidiness.
    #
    # kit puts every service it ships on a network called `platform`. A service
    # in the SECOND compose file that declares no `networks:` lands on the
    # project's `default` network instead, and `default` and `platform` are two
    # different networks in two different DNS domains — so every hostname this
    # service uses stops resolving the moment it starts. Measured, from
    # `docker compose config` on the merged file:
    #
    #     courier:     networks: {default: null}
    #     postgres:    networks: {platform: null}
    #     otel-collector: networks: {platform: null}
    #
    # and the symptom at `up`, which is not a DNS error at all and is why this
    # was worth chasing rather than assuming:
    #
    #     failed to create task for container: failed to initialize logging
    #     driver: dial tcp: lookup otel-collector on 0.250.250.200:53: no such host
    #
    # The `syslog` log driver below resolves `otel-collector` itself, so the
    # container fails to START rather than to serve — which is the only reason
    # this was ever visible. `DATABASE_URL`'s `postgres` and
    # `COURIER_OTEL_ENDPOINT`'s `otel-collector` are the same lookup and would
    # have failed at first connection instead, later and less legibly.
    #
    # No other adopter declares this, and no check requires it, so it is a fleet
    # finding rather than a courier-only one: reported, fixed here because this
    # is the repository this packet was given.
    networks:
      - platform
    # A literal, and NOT a `${KIT_*:default}` — this is courier's OWN port, not one
    # of kit's. kit's port block is a statement about the shared infrastructure, and
    # 4000 is what a Phoenix release defaults to and what courier's own documented
    # port is; moving it is a change to a published contract, not a compose edit.
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # Over the compose network, by service name. The host mapping above is for the
      # developer and the host-side test suite.
      #
      # THE RUNTIME ROLE IS `courier_app`, AND THAT IS THE WHOLE OF THIS CHANGE.
      # kit's `10-cluster.sh` provisions TWO logins per service: `courier`, which
      # owns the database and runs migrations, and `courier_app`, which owns
      # nothing and holds DML per table. This line used to name the former, so the
      # application ran as the role that owns its own tables — and Postgres exempts
      # an owner from its own row-level-security policies, so every policy in
      # `20261003090000_protect_account_scoped_tables.exs` was inert in the dev
      # stack. Naming `courier_app` is what makes the dev stack behave like the
      # deployed one.
      #
      # It owns nothing, so it cannot run migrations, which is why the owner's DSN
      # is a SEPARATE variable below rather than an option on this one.
      #
      # The password is the cluster's because every role takes `POSTGRES_PASSWORD`
      # on a development machine (kit's own words: "Isolation is by PRIVILEGE and
      # never by secret"). In production the two roles carry distinct passwords
      # and nothing about the boundary changes.
      #
      # `application_name` is MISSING HERE, which on a shared cluster is the one
      # setting kit's `templates/database/contract.json` calls "THE ONE THAT IS
      # NOT OPTIONAL": nine services share one `pg_stat_activity`, and a query
      # with no application_name cannot be placed in it. Measured on this stack,
      # with everything else in the contract in place:
      #
      #     select application_name, state, count(*) from pg_stat_activity
      #      where usename = 'courier' group by 1, 2;
      #      |     | idle |    11 |
      #
      # The obvious fix was tried here and does not work. Ecto's `url:` option
      # does not turn an unknown query parameter into a Postgrex startup
      # parameter, so `.../courier?application_name=courier` connects, migrates
      # and serves /readyz, and leaves `application_name` empty — which is the
      # same result as not setting it, wearing a green health check. That is why
      # the URL does not carry it here rather than carrying it and claiming
      # credit for a no-op.
      #
      # It belongs in `:parameters` on the Repo config, which is what
      # kit/templates/database/elixir/repo.exs.snippet does. Adopting that module
      # is the real change and it is a separate one from moving onto the cluster:
      # a new `lib/courier/database.ex`, a `config/runtime.exs` edit on the
      # `:prod` branch that CI's boot contract exercises, and its own tests.
      DATABASE_URL: ecto://courier_app:${KIT_POSTGRES_PASSWORD:-cafaye}@postgres:5432/courier

      # THE OWNER, FOR MIGRATIONS ONLY. Read by `Courier.OwnerRepo` and by nothing
      # else — the application never opens a connection with it, which is a
      # property of `Courier.OwnerRepo` rather than a convention.
      #
      # It has to be a separate variable rather than a flag on `DATABASE_URL`
      # because one variable cannot be two credentials, and the release reads
      # `DATABASE_URL` to start `Courier.Repo`.
      COURIER_OWNER_DATABASE_URL: ecto://courier:${KIT_POSTGRES_PASSWORD:-cafaye}@postgres:5432/courier

      # ---------------------------------------------------------------------
      # OBSERVABILITY, ON BY DEFAULT
      #
      # One variable, and it is the only contract (core D16). Unset it and the
      # collector that ships with the stack is the default — that is the whole of
      # "a deployer gets traces without assembling them". Point it at any OTLP
      # endpoint and courier exports there instead.
      #
      # It is declared here, in the service's own file, rather than defaulted in the
      # Elixir code alone, so a reader of this file can see where telemetry goes
      # without reading the source. `Courier.Telemetry.endpoint/0` has the same
      # default, and `test/courier/telemetry_test.exs` holds the two to one value.
      COURIER_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      # `tenant_id` goes on the RESOURCE, never on a measurement — see the collector
      # config's `transform/cafaye_resource_*` pair. Unset by default: a
      # single-tenant development stack has no tenant to name, and an empty one
      # would show up as a second service row in every collector's service list.
      # COURIER_TENANT_ID: ""
      #
      # `deployment.environment` is an ENUM in core's resource schema
      # (development/test/staging/production), so `local` is not one of the four.
      DEPLOYMENT_ENVIRONMENT: development

      # The key every webhook signing secret is sealed under. Required rather than
      # defaulted, because a default would be a key in version control and every
      # deployment that forgot one would seal its customers' credentials under it.
      # 32 bytes, base64:
      #
      #     openssl rand -base64 32
      COURIER_SECRET_BOX_KEY: "${COURIER_SECRET_BOX_KEY:?set COURIER_SECRET_BOX_KEY, or run: openssl rand -base64 32}"

      # ---------------------------------------------------------------------
      # WHO COURIER ASKS ABOUT ITS CALLERS
      #
      # The resolver is `Courier.Principal.Introspection` outside test
      # (`config/runtime.exs`), so this stack cannot serve an authenticated
      # request without identity. It is NOT in `depends_on`, deliberately and for
      # the same reason the collector is not: a service that refuses to serve
      # while a dependency is down teaches people to run without the dependency,
      # which is worse than answering 503. courier starts, serves `/healthz`,
      # `/readyz` and the provider surface, and answers 503 with
      # `code: unavailable` on everything behind `CourierWeb.Plugs.Principal`.
      #
      # `COURIER_IDENTITY_URL` is by compose service name, like the collector
      # above. `COURIER_IDENTITY_TOKEN` is courier's OWN scoped API token —
      # a credential, so it is required from the host environment and never
      # committed here. Mint one with `POST /v1/accounts/{account_id}/api-keys`
      # against an identity account that belongs to courier and to nothing else.
      # ---------------------------------------------------------------------
      COURIER_IDENTITY_URL: http://identity:4000
      COURIER_IDENTITY_TOKEN: "${COURIER_IDENTITY_TOKEN:?set COURIER_IDENTITY_TOKEN, or mint one with POST /v1/accounts/{account_id}/api-keys}"

      # ---------------------------------------------------------------------
      # THE MAIL ADAPTER, AND WHY IT IS A CATCHER
      #
      # `Courier.MailerAdapter.adapter!/1` raises when COURIER_MAIL_ADAPTER is
      # unset, and refuses `none` in `:prod` — the container is a prod release
      # (Dockerfile sets MIX_ENV=prod), so the Local adapter is not available
      # here. Without this block `bin/dev up` fails: the release boots, hits
      # `config/runtime.exs:200`, and raises.
      #
      # The adapter is `smtp` pointed at the mailpit service below. That is the
      # only configuration that makes the dev stack work with zero credentials
      # and makes mail VISIBLE — a developer can open the web UI and read what
      # courier sent, which is what a dev stack is for. The alternative (A in
      # the packet brief) was to require real SMTP credentials at compose time,
      # which moves the failure from a container crash to a compose error but
      # makes every developer supply a relay before the stack comes up.
      #
      # `COURIER_SMTP_AUTH=never` and `COURIER_SMTP_TLS=never` because mailpit
      # accepts everything unauthenticated on a development machine. No
      # credential is committed here: there is none to commit.
      # ---------------------------------------------------------------------
      COURIER_MAIL_ADAPTER: smtp
      COURIER_SMTP_HOST: mailpit
      COURIER_SMTP_PORT: "1025"
      COURIER_SMTP_AUTH: never
      COURIER_SMTP_TLS: never
      COURIER_SMTP_SSL: "false"

      # ---------------------------------------------------------------------
      # THE OTHER TWO BOOT-REQUIRED VARIABLES, AND WHY THEY WERE MISSING TOO
      #
      # `COURIER_MAIL_ADAPTER` was the first of FIVE boot-required variables the
      # dev stack did not supply, and fixing only it just moves the crash down
      # `config/runtime.exs`. The release evaluates that file top to bottom, so
      # the reported failures were, in order: the mail adapter at line 200, then
      # `COURIER_INBOUND_RESEND_SECRET` at 277, then `SECRET_KEY_BASE` at 350.
      # One at a time, each inside the container, each a crash-loop — which is
      # what "fix the next one and see" looks like when the list is only
      # discoverable by booting.
      #
      # The list is not discoverable by booting. It is five `System.get_env(…) ||
      # raise` pairs in `config/runtime.exs` plus the adapter's own raise in
      # `Courier.MailerAdapter`, and `config/deploy.yml` already transcribes it
      # as prose at lines 218-228. That transcription is the thing to read, and
      # `Courier.ComposeConfigTest` now reads the source itself so the two
      # cannot drift: the test derives the required set from `runtime.exs` and
      # asserts `docker-compose.yml` supplies every member of it.
      #
      # WHY THESE TWO GET A DEVELOPMENT VALUE AND THE TWO ABOVE DO NOT. The test
      # above is only worth anything if the fix is not "give everything a
      # default", because a default is precisely what
      # `Courier.MailerAdapter.adapter!/1` refuses for good reason. The
      # distinction is whether a local substitute exists:
      #
      #   * `COURIER_SECRET_BOX_KEY` seals per-endpoint webhook secrets. The dev
      #     stack has no customers, so there is nothing to seal — but there is
      #     also no way for a developer to invent the right key, so it stays a
      #     `${…:?}` compose error naming itself.
      #   * `COURIER_IDENTITY_TOKEN` authenticates courier to identity, and only
      #     identity can mint one. No local substitute, so it stays `:?`.
      #   * `SECRET_KEY_BASE` signs courier's OWN cookies and endpoint tokens,
      #     on a machine with no users and no reachable network. A committed
      #     development value is what `config/dev.exs:58` and
      #     `config/test.exs:75` already do, and what the Phoenix 1.8 generator
      #     ships in its own compose file. It authenticates nobody anywhere.
      #   * `COURIER_INBOUND_RESEND_SECRET` is the PROVIDER's signing secret, so a
      # committed value is the sharpest thing on this list and it gets the most
      # explanation. The default is the same shape `config/test.exs:136` already
      # commits — a base64 blob that decodes to a sentence about being a fake —
      # and it is safe here for one measured reason: **courier's port is not
      # published**, so nothing off this machine can reach `POST /inbound/resend`
      # to sign anything under it. The moment that changes, this default is a
      # version-controlled secret under which anyone who learns the stack's URL
      # can forge a hard bounce against a real mailbox, and it must become the
      # `:?` form above.
      #
      # It is `:-` and not `:?` so a developer does not have to go to a provider's
      # dashboard to boot a stack with no inbound traffic to receive. Set the real
      # `whsec_` value in `.env` to exercise the inbound path for real — the
      # environment wins over this default.
      # ---------------------------------------------------------------------
      SECRET_KEY_BASE: "N0hG2os3k49qghyM9nsz+v7uuI6N8Msgch1e1YE9lmjC2n5bahmQKOrq2a5Up+aj"

      COURIER_INBOUND_RESEND_SECRET: "${COURIER_INBOUND_RESEND_SECRET:-whsec_Y291cmllciBkZXYgc3RhY2sgcGxhY2Vob2xkZXIsIG5vdCBhIHJlYWwgcmVzZW5kIHNpZ25pbmcgc2VjcmV0}"

      # The sixth, and the one that proves the point of reading the list off the
      # file instead of off the three failures a developer happened to see.
      #
      # `COURIER_ERROR_RELAY_TOKEN` is required by a DIFFERENT SHAPE from the
      # other five: bound to a variable, then refused three dozen lines later by
      # `if is_nil(error_relay_token) do raise`. Any reader keyed on the
      # `System.get_env(…) || raise` shape misses it, and a test asserting
      # "every boot-required variable is supplied" then passes while courier is
      # crash-looping on it — a green check over a partial set, which is the
      # failure this repository's own rules name twice. It was found by booting
      # this stack, not by reading `config/deploy.yml`, whose prose list at
      # lines 218-228 does name it (line 245 of the `secret:` block).
      #
      # Same reasoning as the inbound secret: it is a shared secret, so the value
      # below is a `:?` and a developer sets their own. There is no local
      # substitute for it, and the dev stack's crash layer reports into
      # courier's OWN relay rather than a fleet one.
      COURIER_ERROR_RELAY_TOKEN: "${COURIER_ERROR_RELAY_TOKEN:?set COURIER_ERROR_RELAY_TOKEN, or run: openssl rand -hex 32}"

    # THE CRASH LAYER, and it is the reason a panic reaches an operator with no
    # per-language log SDK in it.
    #
    # Every one of the six languages writes a fatal error to stderr; in a container
    # that is the log stream. Docker's `syslog` driver ships it over the compose
    # network to the collector's `syslog/crash` receiver, which makes a panic a log
    # record with a `service.name` on it and no per-language dependency at all.
    #
    # `syslog` rather than `filelog` on `/var/lib/docker/containers`, and that is a
    # portability decision with a history: the filelog form works on a Linux host and
    # does not work at all under Docker Desktop or OrbStack, where the daemon's
    # filesystem lives inside a VM the host cannot bind-mount without asking for a
    # shared directory. The syslog driver delivers the same bytes from the same
    # place on every platform.
    #
    # NO HOST PORT, and the receiver it talks to is not published either. A syslog
    # receiver on the host loopback is an unauthenticated log-injection point for
    # anything else on the machine.
    #
    # `tag` is the process identity the collector promotes to `service.name` when a
    # record has none — see `transform/cafaye_logs`. It has to match the service
    # name or a crash is filed against `unknown`.
    # NO LOG-DRIVER OVERRIDE. See the identical note in identity/docker-compose.yml
    # for the full argument; the short form is that `syslog` makes the DOCKER
    # DAEMON resolve `otel-collector`, in the host namespace, where container
    # names do not exist:
    #
    #   failed to initialize logging driver: dial tcp: lookup otel-collector:
    #   0.250.250.200:53: no such host
    #
    # The container never starts, so the crash layer is unreachable precisely
    # when it is needed. It does not degrade, it prevents. gateway/docker-compose.yml
    # already said so out loud — "fails to start gateway rather than starting it
    # without traces."
    #
    # The panic still reaches an operator. Every language writes a fatal error to
    # stderr, `json-file` captures it, and `docker logs` shows it — on every host,
    # with no DNS involved.
    #
    # And the collector runs an `otlp` LOGS receiver on 4317/4318, so this
    # service's existing OTel SDK can ship logs there over OTLP, resolved INSIDE
    # the container network where the embedded DNS answers. Same receiver, same
    # bytes, and it does not depend on the daemon's resolver.
    #
    # `tag: "courier"` had one job: the collector's `transform/cafaye_logs`
    # promotes it to `service.name` when a record carries none. OTLP log records
    # carry `service.name` from the SDK's resource attributes instead, so nothing
    # is lost on that axis either.

    # The database and the mail catcher. Not the collector, for the reason at the
    # top of this file. Mailpit is in the readiness path because courier cannot
    # send without it — but it is a local container, not a network dependency,
    # and a developer who kills it sees courier fail loudly rather than queue
    # mail silently.
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `/readyz`, over the container's own loopback. Readiness rather than
      # `/healthz` because readiness is the one that consults the database, and a
      # healthcheck that passes against a database that is gone is a healthcheck that
      # reports a working service that answers 503.
      #
      # No `curl` in the image, and no shell either — the release is distroless, so
      # a `CMD-SHELL` probe cannot run at all.
      test:
        - CMD
        - /app/bin/courier
        - eval
        - "IO.puts(:ok)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------
  # MAILPIT — the dev stack's mail catcher
  #
  # WHY THIS EXISTS. `Courier.MailerAdapter.adapter!/1` raises when
  # COURIER_MAIL_ADAPTER is unset, and refuses `none` in `:prod`. The container
  # is a prod release, so the Local adapter is not available. Without a relay
  # to point at, `bin/dev up` fails: the release boots, hits
  # `config/runtime.exs:200`, and raises.
  #
  # Mailpit is a lightweight SMTP catcher. It accepts every message
  # unauthenticated on port 1025 and stores it in memory. The web UI on port
  # 8025 lets a developer read what courier sent — which is what a dev stack
  # is for. No credential is committed here: there is none to commit.
  #
  # WHY IT IS COURIER'S AND NOT KIT'S. Courier is the only service in the
  # fleet that sends mail today. Adding mailpit to kit's shared template would
  # add a container to every service's stack for no benefit. The override
  # model exists precisely so a service can add its own dependencies without
  # touching the shared template. A second mail sender would add its own
  # mailpit the same way.
  #
  # WHY IT IS IN COURIER'S READINESS PATH. Courier cannot send without it.
  # A developer who kills mailpit sees courier fail loudly (connection
  # refused) rather than queue mail silently — which is the correct failure
  # mode for a dev stack. This is NOT the same as the collector rule above:
  # the collector is a shared observability dependency that no service should
  # gate on, while mailpit is courier's own delivery target.
  mailpit:
    image: axllent/mailpit:v1.22.0
    ports:
      # The web UI, so a developer can read what courier sent. The SMTP port
      # (1025) is NOT published — it is only needed by courier inside the
      # compose network, and publishing it would let anything on the machine
      # send mail through the catcher.
      - "${KIT_MAILPIT_PORT:-15025}:8025"
    healthcheck:
      # Mailpit's `readyz` subcommand, which probes the server's own HTTP API
      # and exits 0 only when it answers. The image is distroless (no shell),
      # so a CMD-SHELL probe cannot run at all.
      #
      # THE FULL PATH IS SPELLED OUT, and that is measured rather than assumed:
      # a healthcheck's CMD form execs the command DIRECTLY — the image's
      # ENTRYPOINT (`/mailpit`) is NOT prepended to it. `["CMD", "readyz"]`
      # fails every check with `exec: "readyz": executable file not found in
      # $PATH`, and the container sits in `unhealthy` while the server inside
      # it is perfectly fine. Measured on axllent/mailpit:v1.22.0.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - platform
