
services:
  postgres:
    environment:
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES:-courier}
      KIT_POSTGRES_ROLE_CONNECTIONS: ${KIT_POSTGRES_ROLE_CONNECTIONS:-20}

  courier:
    build:
      context: .
      dockerfile: Dockerfile
    image: anywaye/courier:dev
    networks:
      - platform
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: ecto://courier_app:${KIT_POSTGRES_PASSWORD:-anywaye}@postgres:5432/courier

      COURIER_OWNER_DATABASE_URL: ecto://courier:${KIT_POSTGRES_PASSWORD:-anywaye}@postgres:5432/courier

      COURIER_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      DEPLOYMENT_ENVIRONMENT: development

      COURIER_SECRET_BOX_KEY: "${COURIER_SECRET_BOX_KEY:?set COURIER_SECRET_BOX_KEY, or run: openssl rand -base64 32}"

      COURIER_IDENTITY_TOKEN: "${COURIER_IDENTITY_TOKEN:?set COURIER_IDENTITY_TOKEN, or mint one with POST /v1/accounts/{account_id}/api-keys}"

      COURIER_MAIL_ADAPTER: smtp
      COURIER_SMTP_HOST: mailpit
      COURIER_SMTP_PORT: "1025"
      COURIER_SMTP_AUTH: never
      COURIER_SMTP_TLS: never
      COURIER_SMTP_SSL: "false"

      SECRET_KEY_BASE: "N0hG2os3k49qghyM9nsz+v7uuI6N8Msgch1e1YE9lmjC2n5bahmQKOrq2a5Up+aj"

      COURIER_INBOUND_RESEND_SECRET: "${COURIER_INBOUND_RESEND_SECRET:-whsec_Y291cmllciBkZXYgc3RhY2sgcGxhY2Vob2xkZXIsIG5vdCBhIHJlYWwgcmVzZW5kIHNpZ25pbmcgc2VjcmV0}"

      COURIER_ERROR_RELAY_TOKEN: "${COURIER_ERROR_RELAY_TOKEN:?set COURIER_ERROR_RELAY_TOKEN, or run: openssl rand -hex 32}"


    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /app/bin/courier
        - eval
        - "IO.puts(:ok)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.22.0
    ports:
      - "${KIT_MAILPIT_PORT:-15025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - platform
