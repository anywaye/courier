

services:
  db:
    volumes:
      - courier-pg:/var/lib/postgresql/data
      - ./ops/glitchtip-database.sql:/docker-entrypoint-initdb.d/10-glitchtip.sql:ro

  glitchtip:
    # Pinned **by digest**, and the reason is stated rather than assumed: this is
    # the service that holds every crash report courier will ever record, so
    # "whatever `latest` was this morning" is not good enough for it. The tag is
    # `glitchtip/glitchtip`, and the digest below is what that tag resolved to.
    #
    # GlitchTip is MIT licensed, verified **from this image rather than from the
    # repository page**: `/code/LICENSE` is the MIT text and `/code/NOTICE.md`
    # attributes the vendored Sentry code to Sentry under BSD-3-Clause
    # (`/code/sentry/LICENSE`). That matters for commercial self-hosting, so it
    # was checked rather than assumed — see the licensing note in the packet
    # report. MIT grants no trademark rights, so the "GlitchTip" name itself is
    # not licensed here; the image is used unmodified and unbranded.
    image: glitchtip/glitchtip@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@db:5432/glitchtip
      SECRET_KEY: local-development-only-not-a-secret-0Qa7Tv3Mz9Kd2Bx4Wn8Lf6Hg1Js5Ry
      VALKEY_URL: ""
      APP_URL: http://localhost:8000
      ALLOWED_HOSTS: "localhost,glitchtip"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEBUG: "false"
      GRANIAN_WORKERS: "1"
      GLITCHTIP_EMBED_WORKER: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_URL: ecto://postgres:postgres@db/courier_dev
      POOL_SIZE: "10"
      PHX_HOST: localhost
      SECRET_KEY_BASE: local-development-only-not-a-secret-z0Yx3Kq9Wv7Tp2Lm5Nc8Rb4Fs6Hd1Jg0
      COURIER_SECRET_BOX_KEY: Y2FmYXllLWxvY2FsLWRldi1zZWNyZXQtYm94LTMyYnk=
      COURIER_ERROR_RELAY_TOKEN: local-development-only-not-a-secret-4aTf7Kn2Wq9Zv6Bx1Mh5Rd8Lc3Py
      COURIER_ERROR_REPORTING_DSN: http://local-development-only-not-a-secret-4aTf7Kn2Wq9Zv6Bx1Mh5Rd8Lc3Py@courier:4003/1
      COURIER_ERROR_SINK_DSN: "${COURIER_ERROR_SINK_DSN:-}"
      COURIER_RELEASE: "${COURIER_RELEASE:-local-compose}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-local}"

volumes:
  glitchtip-pg: