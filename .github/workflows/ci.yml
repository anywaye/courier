      - name: tier — no database (819 tests, 38 files)
        # These files never touch `Courier.Repo`. They are gated on a database
        # anyway, because `mix test` is aliased to `ecto.create` first and aborts
        # before the first test when there is no server — so this tier is the
        # proof that a runner without a database verifies nothing at all, SSRF
        # table included. The file list is derived from the case templates
        # rather than written out, so a new test file cannot fall outside its
        # tier, and an empty list is a hard error rather than a whole-suite run.
        # `error_relay_test.exs` and `error_relay/policy_test.exs` are in this
        # tier and that is the *claim* the error-reporting packet makes: the relay
        # holds no `Repo` and adds no migration, so the redaction boundary can be
        # tested with no database at all. `CourierWeb.ErrorReportingTest` is in
        # the other tier because it stops `Courier.Repo` under the application
        # supervisor to prove the same thing from the other side — and
        # `test/courier/principal/introspection_url_test.exs` joined this tier
        # with w64: its subject is what the TREE states (the port identity is
        # dialed on, in four files that disagreed), which is a claim about files
        # on disk and not about a row — and its tree-wide grep is the one check
        # that would catch a wrong value in a file no thought of.
        # `test/courier/telemetry_canary_test.exs` joined it, because the
        # one-click unsubscribe's 404 is the first request in that file that
        # reaches a repo at all.
        run: |
          set -euo pipefail
          grep -rLE 'use (Courier\.DataCase|CourierWeb\.ConnCase)' test --include='*_test.exs' |
            sort > "$RUNNER_TEMP/nodb-tier.txt"
          if [ ! -s "$RUNNER_TEMP/nodb-tier.txt" ]; then
            echo "::error::no-database tier matched no files" >&2
            echo "  an empty list would run the WHOLE suite and call it a tier" >&2
            exit 1
          fi
          echo "files: $(wc -l < "$RUNNER_TEMP/nodb-tier.txt" | tr -d ' ')"
          log="$RUNNER_TEMP/nodb.log"
          status=0
          xargs mix test < "$RUNNER_TEMP/nodb-tier.txt" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the no-database tier exited $status" >&2
            exit "$status"
          fi
          bin/assert-suite "$log" "no database" 819

      - name: tier — database (982 tests, 56 files)
        # Every file here goes through Courier.DataCase / CourierWeb.ConnCase
        # and therefore through the Ecto SQL sandbox: the SQL layer, the
        # migrations `mix ecto.setup` applies, Oban's tables, and the
        # authorization matrix asserted over real requests. This is the tier
        # that dies without the `services: postgres` block above, which is why
        # the block is above.
        run: |
          set -euo pipefail
          grep -rlE 'use (Courier\.DataCase|CourierWeb\.ConnCase)' test --include='*_test.exs' |
            sort > "$RUNNER_TEMP/db-tier.txt"
          if [ ! -s "$RUNNER_TEMP/db-tier.txt" ]; then
            echo "::error::database tier matched no files" >&2
            echo "  an empty list would run the WHOLE suite and call it a tier" >&2
            exit 1
          fi
          echo "files: $(wc -l < "$RUNNER_TEMP/db-tier.txt" | tr -d ' ')"
          log="$RUNNER_TEMP/db.log"
          status=0
          xargs mix test < "$RUNNER_TEMP/db-tier.txt" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the database tier exited $status" >&2
            exit "$status"
          fi
          bin/assert-suite "$log" "database" 982

      - name: tier — the SSRF table (62 tests, in-memory resolver)
        # courier-03's table, run on its own so the log carries a line that can
        # only exist if this harness ran: loopback, link-local, RFC1918, IPv6,
        # IPv4-mapped IPv6, userinfo-hidden loopback and DNS rebinding, each
        # asserted one address class at a time, every one of them answered by
        # Courier.TestSupport.TestDns from a table the test writes. One second
        # of work, and it is the difference between "the SSRF guard is tested"
        # and "there is a file about SSRF".
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ssrf.log"
          status=0
          mix test test/courier/webhooks/url_guard_test.exs 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the SSRF table exited $status" >&2
            exit "$status"
          fi
          bin/assert-suite "$log" "SSRF table (url_guard_test.exs)" 62

      - name: lockfile guard
        # `bin/prime` runs `mix deps.get`, which is allowed to fetch and is not
        # allowed to resolve differently. A prime that moves mix.lock is a prime
        # that can make two worktrees disagree about the same commit, and the
        # difference is invisible in a green suite. Cheap, and it catches a class
        # of drift nothing else here would.
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- mix.lock; then
            echo "::error::bin/prime moved mix.lock; the commit and the lockfile disagree" >&2
            exit 1
          fi
          echo "mix.lock unchanged by the gate"

      - name: coverage
        # The floor kit's Elixir job cannot enforce (see the header). MIX_ENV=test
        # is explicit and required: `def cli` sets
        # `preferred_envs: [precommit: :test]`, which shadows `mix coveralls`'
        # own `@preferred_cli_env :test`, so without it the task runs the suite
        # in dev and Mix refuses. `--minimum-coverage` is deliberately absent:
        # excoveralls has no such flag and hands unknown flags to `mix test`,
        # which rejects them. So the number is read out of the report and
        # compared here, which makes this a gate rather than a report.
        #
        # `export` on its own line rather than a `MIX_ENV=test mix …` prefix:
        # shellcheck reads the prefix form as an assignment and reports
        # SC2209 ("use var=$(command)"), which fails actionlint's shellcheck
        # tier. Same environment for the one command that reads it.
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/coveralls.log"
          status=0
          export MIX_ENV=test
          mix coveralls 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::mix coveralls exited $status" >&2
            exit "$status"
          fi
          total="$(sed -n 's/^\[TOTAL\][[:space:]]*\([0-9.]*\)%.*$/\1/p' "$log" | tail -n 1)"
          if [ -z "$total" ]; then
            echo "::error::no [TOTAL] line in the coverage report; nothing was measured" >&2
            exit 1
          fi
          if [ "$(awk -v a="$total" -v b="$COVERAGE_FAIL_UNDER" 'BEGIN { print (a + 0 < b + 0) ? 1 : 0 }')" != 0 ]; then
            echo "::error::coverage ${total}% is below the ${COVERAGE_FAIL_UNDER}% floor" >&2
            exit 1
          fi
          echo "coverage ${total}% (floor ${COVERAGE_FAIL_UNDER}%)"

      - name: what actually ran
        # The claim, in the run summary, where a reader looks before believing a
        # green badge. Every number on this table was asserted by the step named
        # beside it; none of them is a count of anything.
        run: |
          set -euo pipefail
          {
            echo "### courier CI — tiers that ran"
            echo
            echo "| tier | asserted | checked by |"
            echo "|---|---|---|"
            echo "| whole suite (\`bin/prime\`) | 1801 passed | \`bin/assert-suite\` |"
            echo "| no database, 38 files | 819 passed | tier step |"
            echo "| database, 56 files | 982 passed | tier step |"
            echo "| SSRF table | 62 passed | tier step |"
            echo "| coverage | ${COVERAGE_FAIL_UNDER}% floor (86.3% measured) | coverage step |"
            echo "| mix.lock | no diff after the gate | lockfile step |"
            echo
            echo "The floors are decrease detectors, not targets: a green run means"
            echo "nothing was deleted, skipped or excluded since these numbers were"
            echo "measured. Adding a test turns CI red until the floor is raised, which"
            echo "is the intended direction."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # The build that ships.
  #
  # Nothing else in this file compiles in `:prod`: bin/prime, every `mix test`
  # and the coverage run are development or test. kit's workflow builds no image
  # and no release ("No job builds or pushes an image"), and it cannot know that
  # courier's release carries ERTS, that its boot needs four environment
  # variables, and that one of them is a key it must refuse to default. That is
  # courier's contract, so it is courier's job.
  release:
    name: release (prod build, boot contract)
    runs-on: ubuntu-latest
    # 20, and not GitHub's 360-minute default: prod deps, one release build,
    # three boot probes — no suite, no database, minutes of work.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: read the toolchain pins from mise.toml
        id: pins
        # The same `[tools]` pin the gate job uses, read the same way, so the
        # release assembled here is the release the Dockerfile copies out of
        # _build/prod on the same two versions.
        run: bin/toolchain-pins

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.pins.outputs.elixir }}
          otp-version: ${{ steps.pins.outputs.erlang }}

      - name: build the release
        # No COURIER_SECRET_BOX_KEY here, deliberately: `mix release` does not
        # evaluate config/runtime.exs, it copies it into the release to be
        # evaluated at boot. A build that needed the key would mean the key is a
        # build input, which is the thing the next step proves it is not.
        run: |
          set -euo pipefail
          MIX_ENV=prod mix deps.get --only prod
          MIX_ENV=prod mix release --overwrite

      - name: the boot contract
        # Three assertions, no database and no server, each a process expected to
        # fail for a named reason:
        #
        #   1. no key      -> refuses, and names COURIER_SECRET_BOX_KEY
        #   2. key, no URL -> got past the key, refuses, and names DATABASE_URL
        #   3. both        -> boots, and holds the key it was given
        #
        # (2) is the one that matters: a lone "it refuses without the key" test
        # is satisfied by a release that refuses everything.
        #
        # The key below is TEST-ONLY, and is the same string as the gate job's.
        # It is a fixture for this assertion, not a default: nothing in
        # config/runtime.exs reads a fallback, and (1) is the proof.
        env:
          COURIER_SECRET_BOX_KEY: Y291cmllci10ZXN0LW9ubHkta2V5LTMyLWJ5dGVzISE=
          DATABASE_URL: ecto://postgres:postgres@localhost/courier_test
          SECRET_KEY_BASE: ci-only-not-a-secret-00000000000000000000000000000000
        run: |
          set -euo pipefail
          rel=_build/prod/rel/courier/bin/courier

          if env -u COURIER_SECRET_BOX_KEY -u DATABASE_URL -u SECRET_KEY_BASE \
            "$rel" eval 'IO.puts("booted")' > "$RUNNER_TEMP/boot-nokey.log" 2>&1; then
            echo "::error::the release booted with no COURIER_SECRET_BOX_KEY" >&2
            exit 1
          fi
          if ! grep -q 'COURIER_SECRET_BOX_KEY is missing' "$RUNNER_TEMP/boot-nokey.log"; then
            echo "::error::the refusal did not name COURIER_SECRET_BOX_KEY" >&2
            cat "$RUNNER_TEMP/boot-nokey.log" >&2
            exit 1
          fi
          echo "refuses to boot without COURIER_SECRET_BOX_KEY"

          if env -u DATABASE_URL -u SECRET_KEY_BASE \
            "$rel" eval 'IO.puts("booted")' > "$RUNNER_TEMP/boot-nodb.log" 2>&1; then
            echo "::error::the release booted with no DATABASE_URL" >&2
            exit 1
          fi
          if ! grep -q 'DATABASE_URL is missing' "$RUNNER_TEMP/boot-nodb.log"; then
            echo "::error::the refusal did not name DATABASE_URL" >&2
            cat "$RUNNER_TEMP/boot-nodb.log" >&2
            exit 1
          fi
          echo "accepts the test-only key, then refuses on DATABASE_URL"

          booted="$("$rel" eval 'IO.puts(
            Application.get_env(:courier, :secret_box_key) ==
              System.get_env("COURIER_SECRET_BOX_KEY"))')"
          if [ "$booted" != "true" ]; then
            echo "::error::the release booted but does not hold the key it was given" >&2
            exit 1
          fi
          echo "boots, and seals under the key it was given"
