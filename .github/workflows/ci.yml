---
# courier's CI.
#
# Three jobs, and the split between them is the whole point of this file:
#
#   ci       calls kit's reusable workflow. The shared half — one `uses:` line,
#            no copy of anything, so a fix in kit reaches courier on the next run.
#   gate     the service-specific half. A database, the gate itself, the tier
#            counts, the lockfile guard, the coverage floor.
#   release  the build that actually ships, and the boot contract.
#
# WHY THE COMPANION JOBS CANNOT LIVE IN THE SHARED WORKFLOW
#
#   kit is configuration, and a step that knows what courier needs in order to be
#   tested at all is not configuration — it is courier. Specifically:
#
#   1. A database. `mix test` in courier is aliased to
#      `ecto.create ++ ecto.migrate ++ test` (mix.exs), so a runner with no
#      postgres aborts *before the first test executes*: 0 of 630 run, exit 1.
#      A caller cannot hand a reusable workflow a service container — GitHub
#      allows only `name`, `uses`, `with`, `secrets`, `strategy`, `needs`, `if`,
#      `concurrency` and `permissions` on a job that calls one, so `services:`
#      is not reachable from here at all. kit also must not hard-code a
#      database, or the five services that are not courier inherit one.
#
#   2. The gate is a repository command, not a workflow concept. `bin/prime` is
#      what a developer runs, and it is what this job runs. A shared workflow
#      that retyped those steps would be a second gate, and a second gate is a
#      second thing to be wrong.
#
#   3. The tier counts. The floors below are courier's numbers, in courier's
#      tree. No other repository has 372 database tests or a 62-case SSRF table.
#
#   4. The lockfile guard, the coverage floor, and the release build: all three
#      are courier's lockfile, courier's threshold, and courier's release.
#
# WHAT IS EXPECTED TO BE RED TODAY, AND WHY IT IS STILL HERE
#
#   The `ci` job is expected to be red on master, on two steps, for reasons that
#   live in kit's file and not in this one:
#
#   - `test` runs a bare `mix test`, which is `ecto.create` first. There is no
#     postgres in that job (see 1 above), so it dies before any test runs.
#   - `coverage` runs `mix coveralls --minimum-coverage N`. `mix coveralls`
#     comes from **excoveralls** — the hex package named `coveralls` is the
#     Erlang one and has no Mix task at all — excoveralls has no
#     `--minimum-coverage` flag (it hands unknown flags to `mix test`, which
#     rejects them), and this repository's `def cli` sets
#     `preferred_envs: [precommit: :test]`, which shadows the task's own
#     `@preferred_cli_env :test`, so the command also needs an explicit
#     `MIX_ENV=test` that kit's step does not pass.
#
#   So the coverage floor is enforced in `gate`, where it can be, from the same
#   number passed to kit as `coverage-fail-under`. Delete this job when kit's
#   Elixir job grows a `services`/`env` seam — and not before, on the strength
#   of a green `ci` job, because there will not be one until then.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # "Prove it runs": `gh workflow run ci` re-runs everything on demand, and it
  # is the only way to run this on a branch that has no pull request.
  workflow_dispatch:

# Least privilege for the whole file. kit's reusable workflow declares the same,
# and a caller should not widen what it is granted by accident.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The shared half.
  #
  # The `.github/workflows/` in this path is not decoration. GitHub resolves a
  # cross-repository reusable workflow at
  # `{owner}/{repo}/.github/workflows/{file}@{ref}` and documents that
  # subdirectories of the workflows directory are not supported, so a
  # `uses: cafaye/kit/workflows/ci.reusable.yml@master` line resolves to nothing
  # and the build is red before it starts. kit-04 owns that move.
  #
  # The input names are kit's own, read from kit's README.md ("How a service repo
  # adopts kit") and the `on.workflow_call` block of the workflow itself.
  ci:
    name: ci (kit)
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      language: elixir
      # The directory holding mix.exs. The repository is flat, so this is '.'.
      working-dir: .
      # The toolchain, pinned, from mise.toml's `[tools]`. kit's default is a
      # floating `1.18`/`27`, which is the opposite of a pin. This is the one
      # place a version is written twice — GitHub cannot read a file into a
      # `with:` input — and the `gate` job fails if it and mise.toml disagree.
      versions: '{"elixir":"1.20.4-otp-29","erlang":"29.1.1"}'
      # 86.3% measured on the commit that added this line; the floor is 80 so an
      # unrelated change cannot red the build, and raising it is a one-line diff.
      # kit's own note is that a threshold left at 0 fails nothing.
      coverage-fail-under: '80'
      # A string, and 'false', on purpose. courier has not copied
      # kit/templates/otel/elixir/, so the conformance job would run kit's own
      # copy of the suite and prove something about kit rather than about
      # courier. The moment courier copies the template *with* its suite, this
      # becomes 'true' and a claim about propagation becomes a red build.
      telemetry: 'false'

  # --------------------------------------------------------------------------
  # The gate.
  #
  # Runs the same command a developer runs, against a database it provisions
  # itself, and then proves each environment-gated tier actually ran by naming
  # it and counting it. PLAN.md §1: a suite that exits 0 with tests skipped has
  # run less than it appears to, and a gate that skips is not green.
  gate:
    name: gate (bin/prime, tiers, lockfile, coverage)
    runs-on: ubuntu-latest
    # 30, and not GitHub's 360-minute default: a hung job burns billing hours.
    # This job's real cost is minutes — ecto setup, the 1663-test suite run
    # whole and again by tier, coveralls — so 30 is a ceiling a healthy run
    # never reaches, not a target.
    timeout-minutes: 30

    services:
      postgres:
        # The same string docker-compose.yml pins, character for character. An
        # unpinned `postgres` means the suite's result depends on which tag was
        # cached when the job started, and a *different* tag than the compose
        # service means CI and a developer's laptop disagree about the server
        # the 372 database-tier tests ran against.
        image: postgres:17-alpine
        env:
          # The credentials config/test.exs hard-codes, so `mix ecto.setup` and
          # every sandbox checkout find the server they were written for.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The health check is what makes the tier deterministic rather than
        # lucky: without it the first `mix ecto.create` races the server and the
        # database tier is the thing that flakes. `pg_isready` is true when the
        # server accepts connections, not when the container process is up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    env:
      # TEST-ONLY VALUE. Not a production default, and not treated as one.
      # `config/runtime.exs` requires COURIER_SECRET_BOX_KEY in prod and refuses
      # to boot without it, because a default would be a key in version control
      # that every deployment which forgot to set one would seal its customers'
      # credentials under. This job must not invent a value production would
      # accept, so:
      #   - `mix test` never reads it. config/test.exs sets its own fixed
      #     test-only key; the `release` job is the one that exercises the prod
      #     path, and it asserts the refusal as well as the success.
      # It is set here only so the one variable that looks like a secret is
      # visibly a test value rather than a hole in the contract.
      COURIER_SECRET_BOX_KEY: Y291cmllci10ZXN0LW9ubHkta2V5LTMyLWJ5dGVzISE=
      # The coverage floor, read by the coverage step and printed in the summary.
      # The same number is passed to kit above; this is the copy that is checked.
      COVERAGE_FAIL_UNDER: '80'

    steps:
      - uses: actions/checkout@v7

      - name: read the toolchain pins from mise.toml
        id: pins
        # mise.toml is the repository's `[tools]` pin and CI does not get to have
        # a second one. Reading it here means this job builds with the toolchain
        # `mise install` gives a developer, by construction rather than by
        # review. bin/toolchain-pins writes to $GITHUB_OUTPUT, so the pins are
        # never retyped in a step.
        run: bin/toolchain-pins

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.pins.outputs.elixir }}
          otp-version: ${{ steps.pins.outputs.erlang }}

      - name: kit's `versions` input must equal mise.toml
        # The check that keeps the one unavoidable duplicate from becoming a lie.
        run: bin/toolchain-pins --check .github/workflows/ci.yml

      - name: the gate
        # bin/prime, unmodified: `mix local.hex --force`, `mix deps.get`,
        # `mix ecto.setup`, `mix test`. Not a CI-only variant of it. The status
        # is captured from the pipeline under `pipefail`, because a pipeline's
        # exit code is its last command's and a red gate that reads 0 is the
        # exact shape PLAN.md §1 warns about.
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/prime.log"
          status=0
          ./bin/prime 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::bin/prime exited $status — the gate is red" >&2
            exit "$status"
          fi
          # Remeasured on the REBASED tree carrying BOTH the notifications
          # reader (W32: whole 1488 -> 1520, database 823 -> 855, +32) AND the
          # third subscription (W39: +24, split 5 no-database / 19 database):
          # whole suite 1520 -> 1544, no-database 665 -> 670 (30 files),
          # database 855 -> 874 (47 files). 1544 is 670 + 874, re-measured by
          # running the tier greps on this tree, not by adding the two branches'
          # deltas on paper.
          #
          # REMEASURED on the tree carrying the introspection seam's address and
          # key (w64): whole 1544 -> 1551, no-database 670 -> 677 (31 files),
          # database unchanged at 874 (47 files). All 7 are in
          # `test/courier/principal/introspection_url_test.exs`, which reads
          # files from disk and touches no `Courier.Repo` — the same placement
          # rule as the backup packet's cross-file contract test: a claim about
          # what the tree STATES is a claim no database can check. 1551 is
          # 677 + 874, so the parts still sum to the whole.
          #
          # REMEASURED on the tree carrying the two email-change notices (w70):
          # whole 1551 -> 1563, no-database 677 -> 685 (31 files), database
          # 874 -> 878 (47 files). The +12 split 8 / 4, read off the case
          # templates the two tier greps use: 8 in `mailers_test.exs` (a plain
          # `ExUnit.Case` — the composed message needs no row), 4 in
          # `messages_controller_test.exs` (a `CourierWeb.ConnCase` — the
          # claim is that the type is sendable through the real door). 1563 is
          # 685 + 878, so the parts still sum to the whole.
          #
          # REMEASURED on the tree carrying the SECOND PROVIDER (w71): whole
          # 1563 -> 1575, no-database 685 -> 697 (31 files), database UNCHANGED
          # at 878 (47 files). The +12 are two files, both plain `ExUnit.Case`
          # because configuration mapping and refusals need no row: 7 in
          # `mailer_adapter_test.exs` (the Postmark configuration block and
          # the table-generated supported-values refusal) and 5 in
          # `mailer_adapter_credentials_test.exs` (the Postmark startup line
          # and the two repository scans). 1575 is 697 + 878, so the parts
          # still sum to the whole.
          #
          # AND IT MOVES AGAIN for the proof that the closed set stays closed
          # in every environment: 1575 -> 1576, no-database 697 -> 698,
          # database UNCHANGED at 878. The one test asserts
          # `COURIER_MAIL_ADAPTER` naming `Swoosh.Adapters.Local` is refused
          # in `:dev` and `:test` as well as `:prod`. 1576 is 698 + 878, so
          # the parts still sum to the whole.
          #
          # AND IT MOVES AGAIN for the HELM CHART (w85): whole 1576 -> 1582,
          # no-database 698 -> 704 (31 files), database UNCHANGED at 878 (47
          # files). The +6 are one file, `chart_test.exs`, a plain
          # `ExUnit.Case` because its subject is what the chart FILES state.
          # 1582 is 704 + 878, so the parts still sum to the whole.
          #
          # AND IT MOVES AGAIN for the PUBLISH LOOP'S MISSING END (w96):
          # whole 1587 -> 1593, no-database 709 -> 715 (32 files), database
          # UNCHANGED at 878 (47 files). The +6 are the same file,
          # `chart_test.exs`, and for the same reason: the publish workflow's
          # contract is what two files on disk state — the caller at
          # `.github/workflows/publish.yml` and `chart/Chart.yaml` — and a
          # claim about files is a claim no database can check. The six
          # assert the caller exists, triggers on a push to master, calls
          # kit's composed `publish.reusable.yml@master`, grants
          # `packages: write`, passes `push: true`, and names the chart
          # directory whose `Chart.yaml` version equals the substrate's
          # `targetRevision: 0.1.0`. 1593 is 715 + 878, so the parts still
          # sum to the whole.
          #
          # **AND THE BASELINE ITSELF WAS STALE BY FIVE, which this raise
          # catches up rather than papers over.** The w90 ingress packet
          # added 5 tests to `chart_test.exs` and raised nothing, so the
          # floor said 1582/704 while the tree measured 1587/709 — green
          # throughout, because a floor is a decrease detector and cannot
          # see tests that were added. Measured on this tree before the
          # first commit of this packet: 1587 whole (709 + 878), and the
          # no-database tier's file count is 32, not the 31 the w85
          # paragraph records. The raise is to the measurement, not to
          # the measurement plus the old floor's error.
          #
          # AND IT MOVES AGAIN for the force_ssl RUNTIME OPT-IN (w100):
          # whole 1593 -> 1601, no-database 715 -> 723 (32 -> 33 files),
          # database UNCHANGED at 878 (47 files). The +8 are the
          # compile-time redirect's removal and its replacement: one new
          # file, `test/courier_web/plugs/force_ssl_test.exs` (9 tests,
          # a plain `ExUnit.Case` because its subject is the plug and the
          # config files), minus the `router_test.exs` block asserting the
          # probes' exemption from the deleted key. 1601 is 723 + 878, so
          # the parts still sum to the whole — re-measured by running the
          # tier greps on this tree.
          #
          # AND IT MOVES DOWN for per-action TENANT SCOPE (w105): whole
          # 1601 -> 1600, no-database UNCHANGED at 723 (33 files), database
          # 878 -> 877 (47 files, one file swapped for another). `49de49b`
          # deletes the `TenantIdentity` plug and its 7 pipeline-shape tests;
          # `tenant_scope_test.exs` replaces them with 6 stronger ones (see
          # gate.yml). 1600 is 723 + 877.
          #
          # REMEASURED on the tree carrying the THIRD PROVIDER — the
          # Cloudflare Email adapter, which sends through the MailChannels
          # transactional API: whole 1600 -> 1624, no-database 723 -> 747
          # across 33 -> 34 files, database UNCHANGED at 877 across the
          # same 47 files. 1625 is 748 + 877, so the parts still sum to the
          # whole. **The +24 split 5 / 19, and the 19 were the PREVIOUS
          # WORKER'S uncommitted tests, gated for the first time by this
          # packet's recovery commit** — one of them called an undefined
          # `cloudflare_config/0`, so the file would not even have compiled.
          # See gate.yml for the measurement, and for why it was taken on a
          # fresh postgres rather than on kit's shared cluster.
          # AND IT MOVES AGAIN for the OUTBOX PUBLISHER (BRK-2): whole 1625 ->
          # 1646, no-database 748 -> 759 (34 -> 35 files), database 877 -> 887
          # (47 -> 49 files). The +21 split 11 / 10 by the case template, which is
          # the same derivation the two greps use:
          #   * `test/courier/nats_test.exs` is a plain `ExUnit.Case` (11 tests)
          #     because its subject is a process and a URL — no row is read.
          #   * `test/courier/nats_publisher/bus_test.exs` (4) and
          #     `test/courier/nats_publisher/unconfigured_test.exs` (6) are both
          #     `Courier.DataCase` because each asserts about an `outbox_events`
          #     row: the first that it was marked published from a real broker's
          #     ack, the second that it was NOT marked at all.
          # 1646 is 759 + 887, so the parts still sum to the whole.
          #
          # AND IT MOVES AGAIN for the FIRST CONSUMER (BRK-6): whole 1646 ->
          # 1663, no-database 759 -> 760 (35 files, the wiring file's flipped
          # subscription assertions are source reads), database 877 -> 903
          # (49 -> 51 files). The +17 split 1 / 16 by the case template:
          #   * `test/courier/consumers/subscriber_test.exs` (6) and
          #     `test/courier/consumers/user_created_test.exs` (10) are
          #     `Courier.DataCase` because each asserts about `consumed_events`
          #     and `outbox_events` rows.
          # 1663 is 760 + 903, so the parts still sum to the whole —
          # re-measured by running the two tier greps on this tree.
          #
          # AND IT MOVES AGAIN for the MIGRATE/BOOTSTRAP SPLIT
          # (roll/c5-courier-migrate): whole 1663 -> 1673, no-database
          # 760 -> 770 (35 -> 36 files), database UNCHANGED at 903 (51 files).
          # The +10 are one file, `test/courier/release_migrate_config_test.exs`,
          # a plain `ExUnit.Case` because its subject is `config/runtime.exs`
          # evaluated as a boot and two shell entrypoints read from disk — no
          # row is read. It is in the no-database tier for the reason
          # `backup_config_test.exs` is: a configuration claim that could only
          # be checked against a live postgres would be one a database-less
          # runner silently skips. 1673 is 770 + 903, so the parts still sum to
          # the whole — re-measured by running the two tier greps on this tree.
          #
          # AND IT MOVES AGAIN for the IMAGE-DIGEST PIN (adopt-digest): whole
          # 1673 -> 1679, no-database 770 -> 776 (36 files), database UNCHANGED
          # at 903 (51 files). The +6 are the digest render proofs in
          # `test/courier/chart_test.exs`, a plain `ExUnit.Case` because every
          # claim is about files on disk and `helm template` rendering — no row
          # is read. 1679 is 776 + 903, so the parts still sum to the whole —
          # re-measured by running the two tier greps and `mix test` on this
          # tree.
          #
          # AND IT MOVES AGAIN for SMTP STARTTLS (fix/smtp-tls): whole 1679 ->
          # 1688, no-database 776 -> 785 (36 files, the same 36 — no new file),
          # database UNCHANGED at 903 across the same 51 files. The +9 are
          # one file, `test/courier/mailer_adapter_test.exs`, a plain
          # `ExUnit.Case` with `async: false` (whole-VM env mutation). 8 shape
          # tests name the STARTTLS `tls_options`, the pinned
          # `versions: [:"tlsv1.2", :"tlsv1.3"]`, the `verify: :verify_peer`
          # with `cacerts: :public_key.cacerts_get()`, the SNI, the `depth` and
          # `customize_hostname_check`, the implicit-TLS `sockopts` half, the
          # `tls: :never` half carrying neither, and `verify is never :verify_none`;
          # the 9th is the handshake proof against `smtp.gmail.com:587` with
          # the shipped `tls_options`, asserting NOT `:tls_failed`. Before this
          # packet the defaults answered `:tls_failed` while the pod's
          # `openssl s_client -starttls smtp` verified `0 (ok)` on the same
          # host — the failure was what the client put on the wire. A runner
          # with no outbound 587 skips the network half and still sees the 8
          # shape tests. 1688 is 785 + 903, so the parts still sum to the
          # whole — re-measured by running the two tier greps and `mix test`
          # on this tree.
          #
          # cf-byo-sending-domain adds 29 tests, every one a database-tier test
          # (`tenant_sending_domains_test.exs`, 21, and
          # `deliver_sending_domain_test.exs`, 8; both drive real rows through
          # `Courier.DataCase`). Re-measured by running both tier greps and the
          # whole suite on this tree: whole 1740 = no-database 795 + database
          # 945. The old whole floor (1688) and no-database floor (785) were
          # already short of the tree before this packet; the floors below are
          # the measurement, not the old number plus 29.
          #
          # cf-message-id adds 5 tests, all in the no-database tier
          # (`cloudflare_delivery_test.exs` is a plain `ExUnit.Case`; the send
          # path it drives touches no `Courier.Repo`). Re-measured on this tree
          # by the two tier greps and `mix test`: whole 1747 = no-database 802
          # (36 files) + database 945 (54 files). The whole moved by the same 7
          # the no-database tier did, so the parts still sum to the whole.
          #
          # cf-inbound-optional adds 5 tests, all in the no-database tier
          # (`release_migrate_config_test.exs` gains 5; a plain `ExUnit.Case`
          # because its subject is `config/runtime.exs` evaluated as a boot and
          # the cost sentence on a boot log line). Re-measured on this tree by
          # the two tier greps and `mix test`: whole 1752 = no-database 807
          # (36 files) + database 945 (54 files). The floor sits AT the
          # measurement with zero headroom.
          #
          # REMEASURED on the tree carrying cf-payment-failed — the warning for a
          # payment attempt that did not go through: whole 1753 -> 1769, so the
          # floor moves with it. **The baseline itself was stale by one** (the
          # recorded floor read 1752 against a measured 1753, green throughout,
          # because a floor is a decrease detector and cannot see a test that was
          # added), so this raise is to the measurement plus this packet's 16, not
          # to the old floor plus a delta. The 16 split 14 database / 2
          # no-database by the case template, the same derivation the two tier
          # greps use:
          #   * `test/courier/consumers/payment_failed_test.exs` (14) is a
          #     `Courier.DataCase` because it asserts about `consumed_events` and
          #     `outbox_events` rows over the real loop.
          #   * `test/courier/mailers_config_test.exs` (2) is a plain
          #     `ExUnit.Case` because the arms are configuration substitution and
          #     a rendered body — no row is read.
          # 1769 is 810 + 959, so the parts still sum to the whole.
          #
          # REMEASURED on the tree carrying the SENDING-DOMAIN API: whole
          # 1769 -> 1797, no-database 810 -> 815 (37 files), database
          # 959 -> 982 (56 files). The +28 split 5 / 23 by the case template, the
          # same derivation the two tier greps use:
          #   * `test/courier_web/controllers/sending_domains_controller_test.exs`
          #     (23) is a `CourierWeb.ConnCase` because every claim in it is a
          #     claim about a ROW through the real router — the row a registration
          #     writes, the proof a verification runs, the 404s another account
          #     gets, and the credential a response must not carry. It is
          #     `async: false` for the fixture reason `tenant_sending_domains_test.exs`
          #     is: whole-VM application env and one shared `CloudflareServer`.
          #   * `test/courier_web/router_test.exs` (5) is a plain `ExUnit.Case`
          #     because its subject is the resolved route and its pipeline.
          # 1797 is 815 + 982, so the parts still sum to the whole.
          bin/assert-suite "$log" "whole suite (bin/prime)" 1801
      #
      # Remeasured on the tree carrying `config/kamal-backup.yml` and
      # `config/deploy.yml`: whole suite 1156, which is 577 with no database and
      # 579 with one. The 22 added by the backup packet split 16 / 6, and the
      # split IS the claim rather than an accident:
      #
      # **The no-database tier grew by 16** from
      # `test/courier/backup_config_test.exs`, which reads two files from disk and
      # touches no `Courier.Repo`. That placement is the point and not a
      # convenience: it holds the CROSS-FILE contract — every secret
      # `config/kamal-backup.yml` names must be in the `backup` accessory's
      # `env.secret` list, which `kamal-backup validate` builds from that list and
      # from nothing else — and a backup configuration that could only be checked
      # against a live postgres would be one a database-less runner silently skips.
      # It is also in the tier that proves `mix test` executing zero tests on a
      # runner with no database is caught, which is the tier's reason to exist.
      #
      # **The database tier grew by 6** from
      # `test/courier/backup_tables_test.exs`, a `Courier.DataCase` because its
      # subject is the SCHEMA: it reads `information_schema` on the connected
      # database to check what a `pg_dump` would carry. "courier keeps nothing on
      # local disk" is a claim about courier's COLUMNS, and asserting it from the
      # comment beside `paths:` would be asserting the comment. The day somebody
      # adds a `bytea` column or a `storage_key`, that test goes red and README's
      # "what this does not cover" section has to be rewritten — which is the
      # mechanism, not the intention.
      #
      # **1218 is 623 + 595**, which is the consistency check worth making: a whole
      # suite that is not the sum of its own tiers is a suite where a file has been
      # left out of both.
      #
      # **REMEASURED on the tree carrying the one-click unsubscribe, and the ONE
      # NUMBER THAT WENT DOWN is the one worth reading.** courier-24 adds 64 tests
      # and moves a file between the tiers:
      #
      #   * **the no-database tier went 623 -> 619** and
      #     `test/courier/telemetry_canary_test.exs` moved out of it.
      #     `test/courier/telemetry_canary_test.exs` is the redaction boundary's
      #     proof, and every request it drove was refused before it reached a
      #     controller that touches a database — which is exactly why a file with
      #     no sandbox could drive the real router at all.
      #     `POST /unsubscribe/:token` is the first route in that file whose 404
      #     depends on a row, so its canary needs a sandbox.
      #   * **The alternative was refused, and the reasoning is the point**: a canary
      #     can be planted on a request the `:accepts` plug refuses, and the file
      #     would have stayed in the no-database tier. That would have kept the
      #     number and made the tier's own claim — "these tests never touch
      #     `Courier.Repo`" — quietly false, which is the same defect this tier
      #     exists to prevent. **A floor is a decrease detector; a tier is a
      #     statement about what the tests do, and a statement that is only true
      #     because a request was answered early is a lie with a number on it.**
      #   * **the database tier grew to 663**, from 21 tests in
      #     `test/courier/unsubscribes_test.exs` (it writes a row in
      #     `email_suppressions`), 5 in
      #     `test/courier/unsubscribe_headers_test.exs` (the negative case is a
      #     claim about a table with no token rows in it), 19 in
      #     `test/courier_web/controllers/unsubscribe_controller_test.exs` (real
      #     HTTP against a route that reads a row), 4 in
      #     `test/courier/deliver_test.exs`, and 19 in the files that gained tests
      #     where their claims already lived: the router and the canary.
      #
      # **1282 is 619 + 663**, which is the consistency check worth making: a whole
      # suite that is not the sum of its own tiers is a suite where a file has been
      # left out of both.
      #
      # **REMEASURED on the tree carrying the tenant identity, and this one is a
      # CATCH-UP rather than a packet's own delta.** Merge `4eb7585` added 15
      # tests and none of the three floors below moved, so for one merge the whole
      # suite was slack by 15 rather than by 6 and nothing turned red — because all
      # three are decrease detectors and a floor under the measurement is silence.
      # The whole-suite floor here is 1291 = a measured 1297 less the same margin
      # of 6 `gate.yml` holds, and it is kept equal to `gate.yml`'s `minimum`
      # rather than to the measured count: a floor that is right in one place and
      # slack in another is worse than one that is uniformly slack, because a
      # reader who checked the one that was updated concludes the rest are fine.
      #
      # **All 15 are in the database tier, and the no-database tier did not move.**
      # The split is read off the case templates, which is the same derivation the
      # two tier steps below use, so it cannot be a guess:
      # `test/courier/tenancy_test.exs` is a `Courier.DataCase` (its subject is
