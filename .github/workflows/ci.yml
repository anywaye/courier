      # and nothing else did. Higher than the 1-in-8 recorded there for whole-
      # suite `bin/prime` runs, and still this machine rather than CI: not
      # adjusted, and not hidden either.
      #
      # The previous values here were 1472 (665 + 807) on the tree carrying the
      # fleet's first subscription, 1423 (659 + 764) on the tree carrying the
      # mail catcher, 1282 (619 + 663) on the tree carrying the
      # one-click unsubscribe, 1218 (623 + 595) on the tree carrying the door
      # opener, 1156 (577 + 579) on the tree carrying
      # `config/kamal-backup.yml`, and 1134 (561 + 573) on the tree carrying the
