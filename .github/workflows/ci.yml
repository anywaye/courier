      #
      # **1348 is 645 + 703**, so the parts still sum to the whole.
      #
      # REMEASURED on the tree carrying the IN-APP NOTIFICATION RECORD: whole
      # 1348 -> 1409, database 703 -> 764, files 40 -> 42, no database unchanged
      # at 645 across the same 28 files. **All 61 are in the database tier and the
      # split is read off the case templates rather than guessed**, the same
      # derivation the two tier steps use: one file,
      # `test/courier/notifications_test.exs` (45 tests), is a `Courier.DataCase`
      # because every claim in it is a claim about a ROW; the other,
      # `test/courier/notifications_boundary_test.exs` (16 tests), is one for a
      # different and sharper reason — **its subject is `pg_class` and
      # `cafaye.unprotected_tables()`**, so it is a claim about what the DATABASE
      # holds and cannot be made by a test that never reaches one. Putting it in
      # the other tier would make that tier's own claim ("these tests never touch
      # `Courier.Repo`") false for the same reason the one-click unsubscribe
      # moved `telemetry_canary_test.exs` out of it.
      #
      # The database tier also grew by 1 test in an EXISTING file:
      # `test/courier/backup_tables_test.exs` did not gain one — it went RED, with
      #
      #     the database carries ["notification_events", "notifications"], which
      #     is neither a table courier's migrations create nor one of
      #     ["schema_migrations", "oban_peers"]. A table nobody has decided to
      #     back up is a table a restore loses.
      #
      # which is that test doing exactly its job on a table nobody had declared,
      # and the two tables it names are now declared with what each is FOR. That
      # is the shape of the claim working: a new table cannot be added without
      # somebody deciding whether a `pg_dump` of courier's one database carries
      # it, and `seen_at`/`read_at` are named there explicitly because an inbox
      # restored with its read state lost shows every notification as unread.
      #
      # **1409 is 645 + 764**, so the parts still sum to the whole.
      #
      # REMEASURED on the tree carrying the dev stack's MAIL CATCHER and the six
      # boot-required variables: whole 1409 -> 1423, no database 645 -> 659, files
      # 28 -> 29, database tier unchanged at 764 across the same 42 files.
      # **All 14 are in the no-database tier, and the split is read off the case
      # templates rather than guessed**, the same derivation the two tier steps
      # use: one new file, `test/courier/compose_config_test.exs`, a plain
      # `ExUnit.Case` because its subject is two files on disk — the compose
      # override and `config/runtime.exs` — and it touches no `Courier.Repo`.
      #
      # **1423 is 659 + 764**, so the parts still sum to the whole.
      #
      # REMEASURED on the tree carrying the SECOND SUBSCRIPTION — the
      # `identity.member.accepted` consumer, the first event courier can act on:
      # whole 1472 -> 1488, database 807 -> 823, files 44 -> 45, no database
      # UNCHANGED at 665 across the same 30 files. **All 16 are in the database
