      #
      # The floor sits AT the measurement again, with zero headroom, for the reason
      # the telemetry paragraph gives: the next packet that adds a test goes red
      # until it raises this number. That is the rule working, not a gap in it.
      #
      # REMEASURED on the tree carrying the dev stack's MAIL CATCHER and the six
      # boot-required variables: whole suite 1409 -> 1423, no-database 645 -> 659,
      # files 28 -> 29, database tier unchanged at 764 across the same 42 files.
      #
      # **The +14 are all in the no-database tier and the split is read off the
