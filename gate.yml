# gate.yml — how courier is gated, declared rather than guessed.
#
# WHY THIS FILE EXISTS. The cafaye standard for declaring a gate lives in
# `cafaye/core`: `schemas/gate.schema.json` is the format, `harness/gate_check.py`
# is the checker, and `docs/gate.md` is the reasoning (including the two
# alternatives that were measured and rejected). courier is adopting it, not
# inventing it. The short version of why: across fifteen repositories "run the
# gate" had five spellings, and every one of them was found by a human getting
# it wrong. A gate that is discovered by failure is a gate that was never
# declared.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command resolves, `bin/prime` exists and is executable, `mise run prime`
# resolves to that same file, the CI workflow really invokes it, and — the part
# that matters — that running the gate makes the suite's own summary line
# appear, at or above the floor below. It does NOT prove the tests touched
# anything they claim to, and it does not prove a requirement is satisfied: a
# requirement is the operator's to satisfy, before gating.
#
# MEASURED, NOT GUESSED. Every number and every pattern here came from running
# this repository's gate and reading its output. The figures below are courier at
# master 59247b6, except the suite count, which the observability packet
# re-measured on `worker/sell-observability` after adding the redaction tests:
#
#   * the gate is `mise run prime`, which runs `./bin/prime`;
#   * the suite prints exactly one `Result:` line, `Result: 678 passed`;
#   * a warm gate takes ~37s; a cold one (deps + compile) is minutes;
#   * `./bin/prime` on its own does NOT work without mise on PATH — line 14 is
#     `mix local.hex --force` and it exits 127 with "mix: command not found".
#     That is why `command` names mise and not the script.
version: 1
name: courier

gate:
  # The command a person or a tool runs, as an argv and never a shell string, so
  # the exit code is the gate's own. This fleet's one recorded false green was
  # `… | tail -45; echo "PRIME EXIT=$?"` under zsh, where `$?` is tail's.
  #
  # mise and not `bin/prime`, and that is a measured claim rather than a taste.
  # bin/prime's first act is `mix local.hex --force`; run with a PATH that has no
  # mise shims it dies at line 14 with "mix: command not found" and the gate
  # never runs a test. Declaring `[bin/prime]` would be declaring a command that
  # only works inside a shell somebody has already set up — which is the same
  # class of defect as a `run` string naming a file that does not exist.
  command: [mise, run, prime]
  # The fleet's spelling, and the task a developer is told to run in AGENTS.md
  # and in mise.toml's own header. Checked against mise.toml: its `run` string
  # has to resolve to `entrypoint` below, so the task and this file cannot drift
  # apart into two different gates.
  miseTask: prime
  # The file behind the command, and the file the mise task resolves to.
  entrypoint: bin/prime
  # Deliberately generous. A warm gate measured ~37s wall clock (deps already
  # fetched, compiled, database already migrated). A cold checkout has to fetch
  # 60+ hex packages, compile them, create and migrate the database, and then
  # run the suite: minutes. A floor tight enough to be a bug detector here is
  # tight enough to be a flake generator on somebody's first run, and a timeout
  # that fires on a cold clone is a gate that reports a red that is not the
  # suite's answer. The suite's own budget is the thing to tune here, not this.
  timeoutSeconds: 1800
  proof:
    # The one line that cannot appear unless ExUnit ran to the end of the suite.
    # It is a proof rather than a convention because `gate.proof-missing` is a
    # FAILURE: a gate that exits zero having run nothing is a red, not a green.
    # This is the defect the format exists to catch — cafaye-rb's database tier
    # never executed once and the run printed `ok`.
    - id: suite
      # Measured from eight real runs. The shape is anchored at both ends on
      # purpose: ExUnit's other shapes are `Result: 0 tests` (nothing ran) and
      # `Result: P/T passed` (a failure), and a fractional line must NOT satisfy
      # this proof. `$` with a re.MULTILINE compile is what makes that true —
      # verified against a real failing run, where this pattern matches nothing
      # and the red run is caught by the exit code instead.
      #
      # A ` (...)` test-type breakdown is tolerated for the same reason
      # `bin/assert-suite` tolerates it: the 1.20 formatter appends one when
      # test types differ, and today courier has none. The group is
      # NON-CAPTURING — `(?: … )` — and that is load-bearing, not a style
      # choice: `minimum` is read from the pattern's SINGLE capture group, so a
      # second capturing group is `gate.proof-invalid`. The first draft of this
      # file wrote `( … )` by mistake and the checker refused it with exactly
      # that finding, which is the check working on the declaration that
      # declares the checks.
      match: '^Result: ([0-9]+) passed(?: \([^)]*\))?$'
      # 672 is what the suite reports today minus the small deliberate margin,
      # measured, not copied from core's 163 or from courier's own CI floor. This
      # is a DECREASE-DETECTOR: `minimum` is read from the LAST match, so a run
      # that printed 678 and then 560 would be caught, and a suite that quietly
      # lost 118 tests cannot report itself as passing.
      #
      # The margin below the measured 678 is deliberate and small. courier is a
      # growing repository and this floor is a ratchet that is meant to be
      # raised as the suite grows, not a target the suite must hit.
      #
      # Remeasured on the tree carrying `config/kamal-backup.yml` and
      # `config/deploy.yml`: 1156 whole-suite tests, so 1150 with the same
      # deliberate margin of 6 that 1128 held against a measured 1134, 1067 against
      # a measured 1073, 672 against a measured 678, 722 against 728, 816 against
      # 822, and 912 against 918.
      #
      # 1156 measured with `./bin/prime`, and it is the sum of the two CI tiers
      # measured the same way in the same run: 577 with no database and 579 with
      # one. That the parts sum to the whole is the consistency check worth making:
      # a mismatch would mean a test file belongs to neither tier, which would make
      # both tier floors wrong rather than the total merely stale.
      #
      # The 22 this packet adds split 16 / 6, and the split is the claim rather
      # than an accident. `test/courier/backup_config_test.exs` reads two files
      # from disk and touches no `Courier.Repo`, so it belongs to the tier a
      # runner WITHOUT a database still executes — a backup configuration that
      # could only be checked against a live postgres would be one a database-less
      # runner silently skips. `test/courier/backup_tables_test.exs` is a
      # `Courier.DataCase` because its subject is the SCHEMA, read out of
      # `information_schema` on the connected database, and the whole point of it
      # is that "nothing on local disk" is a claim about courier's columns rather
      # than about a comment.
      #
      # **Remeasured on the tree carrying the one-click unsubscribe: 1282
      # whole-suite tests, so 1276 with the same margin of 6.** The 64 this packet
      # adds are NOT all in the database tier, and the one number that went DOWN is
      # the one worth reading twice:
      #
      # **The no-database tier went 623 -> 619 and the database tier went 595 ->
      # 663.** `test/courier/telemetry_canary_test.exs` moved from the first to the
      # second, and it moved because of what it asserts rather than where it sits:
      # every request that file drove was refused before it reached a controller
      # that touches a database, which is why a file with no sandbox could drive
      # the real router. The one-click unsubscribe is the first route in that file
      # whose 404 depends on a row, so its canary needs a sandbox — and a canary
      # proved on a request the `:accepts` plug refuses would keep the file in the
      # no-database tier while the tier's own claim ("these tests never touch
      # `Courier.Repo`") quietly stopped being true. The tier is a statement about
      # what the tests do, so the file followed the code.
      #
      # The 64 the packet adds, split by why each file is where it is:
      #
      #   * **the database tier**, 68: 21 from
      #     `test/courier/unsubscribes_test.exs` (it writes a row in
      #     `email_suppressions` and reads the send path's refusals back), 5 from
      #     `test/courier/unsubscribe_headers_test.exs` (the negative case is a
      #     statement about a table with no token rows in it), 19 from
      #     `test/courier_web/controllers/unsubscribe_controller_test.exs` (real
      #     HTTP against a route whose answer depends on a row), 4 from
      #     `test/courier/deliver_test.exs` (the send path's own new refusal, in
      #     the file that owns the send path's refusals) and 19 from the two files
      #     that gained tests where their claims already lived: the router and the
      #     canary.
      #   * **the no-database tier**, -4: the canary file's 10 moved out, and the
      #     other 14 are the net of the new tests in files that touch no repo.
      #
      # 1282 is also 619 + 663, which is the consistency check above restated: a
      # whole suite that is not the sum of its own tiers is a suite where a file
      # has been left out of both.
      #
      # **Remeasured on the tree carrying the tenant identity: 1297 whole-suite
      # tests, so 1291 with the same margin of 6.** This one is a CATCH-UP rather
      # than a packet's own delta, and the distinction is the whole point of it:
      # merge `4eb7585` added 15 tests and the floor here stayed at 1276, so for
      # one merge the ratchet was slack by 15 rather than by 6. **Nothing turned
      # red, and that is the finding.** `minimum` is a decrease-detector, so a
      # floor BELOW the measurement is silence — the gate cannot see this class of
      # drift at all, and the only thing that ever caught it was the rule being
      # read by a person. The rule held on eleven previous raises and did not hold
      # here; that is a convention with a 92% record, not a mechanism.
      #
      # **All 15 are in the database tier: 663 -> 678, and the no-database tier
      # did not move at all.** The split is not a guess — it is read off the two
      # files' case templates, which is the same derivation CI's own tier steps
      # use. `test/courier/tenancy_test.exs` is a `Courier.DataCase` because its
      # subject is the transaction that sets and discards the tenant identity,
      # and `test/courier_web/plugs/tenant_identity_config_test.exs` is a
      # `CourierWeb.ConnCase` because it drives real requests through the real
      # endpoint. Both files assert over a live database, so both are
      # `grep -rlE 'use (Courier\.DataCase|CourierWeb\.ConnCase)'`, and the
      # database tier's file count went 33 -> 35 while the no-database tier's
      # stayed at 27.
      #
      # **1297 is 619 + 678**, so the consistency restatement above still holds
      # and no file has fallen outside both tiers. That is the check that had to be
      # re-run rather than assumed: had either new file matched neither grep, the
      # sum would have come out at 1282 while the whole suite reported 1297, and
      # the 15 would have been in a tier nobody counts.
      #
      # **THE MEASUREMENT IS ONLY TRUSTWORTHY ON A FRESH DATABASE, and this is the
      # first time that has been written down here at all** — across eleven
      # previous raises of this floor, not one mentioned that the shared
      # `courier_test` carries stale rows from earlier runs and produces 8 false
      # failures in `test/courier_web/plugs/idempotency_test.exs`
      # (`assert claims() == 0`, `left: 1, right: 0`). Those 8 reproduce on
      # courier's master and are therefore not regressions; they are rows left
      # behind by a run that was interrupted. The number above was taken with
      # `MIX_TEST_PARTITION` naming a partition that did not exist, through
      # `bin/prime` unmodified: `Result: 1297 passed`, exit 0, zero failures, 11
      # migrations applied.
      #
      # **Had that run come out contaminated, the correct action was to leave this
      # line at 1276 and report the contamination.** It is worth being concrete
      # about why, because the reason is not tidiness. The contaminated run reports
      # `1289/1297 passed` and `Failed: 8`; a reader who took the passed-count at
      # face value would have written `1289 - 6 = 1283`, which is 8 BELOW the true
      # floor — green forever, because this is a decrease detector, and
      # indistinguishable from a ratchet nobody moved. A floor moved on a dirty
      # measurement does not merely stay wrong; it reproduces this exact defect at
      # a smaller scale and removes the last chance to notice.
      #
      # The previous value here was 1285 against a measured 1291, then 1276
      # against a measured 1282, then 1212
      # against a measured 1218, and the one before that 1150 against a measured
      # 1156, remeasured on the MERGED tree after the inbound base and the event
      # builders. The value before that was 1128 against a measured 1134, 1067
      # against a measured 1073, 672 against a measured 678, 722 against 728, 816
      # against 822, and 912 against 918. Every one of those is this rule: the
      # floor moves in the same commit that changes what courier verifies.
      #
      # **Remeasured on the tree carrying the queue's PRODUCER: 1314 whole-suite
      # tests, so 1308 with the same margin of 6.** Before this packet courier had
      # three Oban workers and nothing that ever put a job in the queue
      # (`Oban.insert` appeared zero times in `lib/`), and 1301 of its tests were
      # green while every send left a durable outbox row that nothing would ever
      # publish — 1301 tests that drove `perform/1` and asserted nothing about who
      # calls it. The 13 this packet adds are in the database tier, 682 -> 695 and
      # its file count 36 -> 38, and the no-database tier is unchanged at 619
      # across the same 27 files; **1314 is 619 + 695**, so the parts still sum to
      # the whole.
      #
      # The floor is a DECREASE detector and these 13 are tests nobody had, so
      # leaving it at 1295 would have been the same silence as every other packet
      # that forgot. It moves here.
      #
      # AND IT MOVES AGAIN for the app role: 1308 -> 1311, against a measured
      # 1317. **The three are tests that moved TIER rather than tests that
      # appeared** — `error_reporting_test.exs` left the no-database tier because
      # it now reads `schema_migrations` through `Courier.OwnerRepo`, and a
      # `bigserial`-backed read as `courier_app` is a `permission denied` rather
      # than a files-on-disk claim. A floor that only ever moves when a test is
      # written is a floor that cannot see a test changing what it needs, and this
      # is the packet where that happened.
      #
      # AND IT MOVES A THIRD TIME for telemetry: 1311 -> 1343, against a measured
      # 1343 with NO margin, because `test/courier/otel_export_test.exs` adds 26
      # tests to the no-database tier and `telemetry_test.exs` gains one. The
      # margin the paragraph above describes is deliberately absent here and
      # should stay that way: this packet's suite count is measured and the floor
      # sits AT it, so the next packet that adds tests goes red until it raises
      # the number. That is the rule working, not a gap in it — and it is the
      # FIRST time in this file's history that a floor has been set with zero
      # headroom.
      #
      # 1348 is the seventh-defect packet: `test/courier/telemetry_disabled_test.exs`
      # adds 5, and ALL of them are in the DATABASE tier — it is a
      # `CourierWeb.ConnCase`, because the claim is a real request's status code
      # over the real router rather than a configuration's shape. So the split is
      # 645 no-database / 703 database and this number is their sum.
      #
      # REMEASURED on the tree carrying the IN-APP NOTIFICATION RECORD, and
      # **ALL 61 ARE IN THE DATABASE TIER.** The split is read off the case
      # templates by the same `grep` the two tier steps in
      # `.github/workflows/ci.yml` use, so it cannot be a guess:
      #
      #   * `test/courier/notifications_test.exs` — 45 tests, a
      #     `Courier.DataCase`, because every claim in it is a claim about a ROW.
      #   * `test/courier/notifications_boundary_test.exs` — 16 tests, also a
      #     `Courier.DataCase`: its subject is `pg_class` and
      #     `cafaye.unprotected_tables()`, which is a claim about a real database
      #     and cannot be made by a test that never reaches one.
      #
      # So the no-database tier is **unchanged at 645 across the same 28 files** —
      # re-measured rather than assumed, for the reason the paragraph above gives:
      # an unchanged floor that was never re-run is not evidence.
      #
      # **1409 is 645 + 764**, so the parts still sum to the whole. That is the
      # check that had to be re-run rather than assumed: had either new file
      # matched neither grep, the whole suite would have reported 1409 while the
      # tiers summed to 1348, and the missing 61 would have been in no tier at
      # all.
      #
      # The floor sits AT the measurement again, with zero headroom, for the reason
      # the telemetry paragraph gives: the next packet that adds a test goes red
      # until it raises this number. That is the rule working, not a gap in it.
      #
      # REMEASURED on the tree carrying the dev stack's MAIL CATCHER and the six
      # boot-required variables: whole suite 1409 -> 1423, no-database 645 -> 659,
      # files 28 -> 29, database tier unchanged at 764 across the same 42 files.
      #
      # **The +14 are all in the no-database tier and the split is read off the
      # case template, not guessed**: one new file,
      # `test/courier/compose_config_test.exs`, a plain `ExUnit.Case` because its
      # subject is two files on disk — `docker-compose.yml` and
      # `config/runtime.exs` — and it touches no `Courier.Repo`. That placement is
      # the rule `backup_config_test.exs` established: a configuration claim that
      # could only be checked against a live postgres would be one a
      # database-less runner silently skips.
      #
      # **1423 is 659 + 764**, so the parts still sum to the whole — the check
      # that has to be re-run rather than assumed.
      #
      # THE MEASUREMENT IS NOT OBVIOUS AND THE PREVIOUS NUMBER WAS WRONG. A
      # partial version of this packet raised the floor to 1419 on a count of ten
      # tests that were not the ten that shipped; the file that landed carries
      # fourteen. A floor set from a prediction rather than from a run is a floor
      # that either blocks the next packet or, worse, sits under the tree and
      # describes it no longer.
      #
      # REMEASURED on the tree carrying the FLEET'S FIRST SUBSCRIPTION — the
      # `identity.member.invited` consumer — merged on top of the mail-adapter
      # packet: whole suite 1423 -> 1472, no-database 659 -> 665 across
      # 29 -> 30 files, database tier 764 -> 807 across 42 -> 44 files.
      #
      # **The +49 are the consumer packet's, and the split is read off the case
      # templates the two tier greps use, not guessed**: three new files —
      # `test/courier/consumers_test.exs` and
      # `test/courier/consumers/member_invited_test.exs`, both a
      # `Courier.DataCase` because their claims are about rows and the relay
      # claim loop's marking, and `test/courier/consumers/wiring_test.exs`, a
      # plain `ExUnit.Case` because its subject is configuration wiring and it
      # touches no `Courier.Repo`. `backup_tables_test.exs` grew by 9 in the
      # same packet.
      #
      # **1472 is 665 + 807**, so the parts still sum to the whole — re-measured
      # by running the tier greps on the merged tree, not by adding the two
      # branches' deltas on paper.
      #
      # REMEASURED on the tree carrying the SECOND SUBSCRIPTION — the
      # `identity.member.accepted` consumer, the first event courier can act on:
      # whole suite 1472 -> 1488, no-database UNCHANGED at 665 across the same 30
      # files, database tier 807 -> 823 across 44 -> 45 files.
      #
      # **The +16 are one file, `test/courier/consumers/member_accepted_test.exs`,
      # and it is a `Courier.DataCase` because every claim in it is a claim about
      # rows** — the notification the handler writes, the `consumed_events` row
      # the loop marks, and the dedupe the primary key enforces. The no-database
      # tier did not move, and that is the re-measurement rather than an
      # assumption: an unchanged floor that was never re-run is not evidence.
      #
      # **1488 is 665 + 823**, so the parts still sum to the whole — re-measured
      # by running the tier greps on this tree, not by adding the two branches'
      # deltas on paper.
      #
      # REMEASURED on the tree carrying the NOTIFICATIONS READER — the HTTP surface
      # over the in-app notification record: whole suite 1488 -> 1520, no-database
      # UNCHANGED at 665 across the same 30 files, database tier 823 -> 855 across
      # 45 -> 46 files.
      #
      # **The +32 are two files, and both are in the database tier**: 31 from
      # `test/courier_web/controllers/notifications_controller_test.exs`, a
      # `CourierWeb.ConnCase` because every claim in it is a claim about a ROW
      # through the real router — the notifications the controller lists, the
      # marks it applies, and the 404s it answers for a row in another account.
      # The other is one test in `test/courier_web/plugs/principal_config_test.exs`,
      # which is already in the database tier: it asserts the plug assigns the
      # whole principal, not just the account, which is the load-bearing half of
      # the reader's recipient resolution.
      #
      # **1520 is 665 + 855**, so the parts still sum to the whole — re-measured
      # by running the tier greps on this tree, not by adding the two branches'
      # deltas on paper.
      #
      # REMEASURED on the REBASED tree carrying BOTH the notifications reader AND
      # the THIRD SUBSCRIPTION — the `identity.session.revoked` consumer, the
      # first event courier can mail: whole suite 1520 -> 1544, no-database
      # 665 -> 670 across the same 30 files, database tier 855 -> 874 across
      # 46 -> 47 files.
      #
      # **The +24 split 5 / 19, and the split is read off the case templates the
      # two tier greps use, not guessed.** `test/courier/mailers_test.exs` gained
      # 5 in the no-database tier — it is a plain `ExUnit.Case` because its
      # subject is the composed message, which needs no row. The new file,
      # `test/courier/consumers/sessions_revoked_test.exs`, is a
      # `Courier.DataCase` because every claim in it is a claim about rows: the
      # `consumed_events` row the loop marks, the outbox row the send writes,
      # and the dedupe the primary key enforces. Two existing files changed
      # assertions without gaining tests: `notification_preferences_test.exs`
      # and the controller test both enumerate the types `Mailers.types()`
      # returns, and the fourth type is now one of them.
      #
      # **The database tier's file count is 47, not 46, and that is the rebase
      # rather than a drift**: master added
      # `test/courier_web/controllers/notifications_controller_test.exs` and this
      # branch added `test/courier/consumers/sessions_revoked_test.exs`, both
      # `Courier.DataCase`/`CourierWeb.ConnCase` files, so the merged tree carries
      # 45 + 2. The no-database tier's 30 files are unchanged because neither
      # packet added a file to it — `mailers_test.exs` already existed.
      #
      # **1544 is 670 + 874**, so the parts still sum to the whole — re-measured
      # by running the tier greps on this tree, not by adding the two branches'
      # deltas on paper.
      #
      # REMEASURED on the tree carrying the introspection seam's address and key:
      # whole suite 1544 -> 1551, no-database 670 -> 677 across 30 -> 31 files,
      # database tier UNCHANGED at 874 across the same 47 files.
      #
      # **The +7 are one file, `test/courier/principal/introspection_url_test.exs`,
      # and it is a plain `ExUnit.Case` because its subject is what the TREE
      # states** — the port identity is dialed on, in four files that disagreed
      # about it — and a claim about files on disk is a claim no database can
      # check. The placement is the rule `compose_config_test.exs` and
      # `backup_config_test.exs` established, and the tree-wide grep in that
      # file is the one check that would catch a wrong value in a file no
      # thought of.
      #
      # **1551 is 677 + 874**, so the parts still sum to the whole — re-measured
      # by running the tier greps on this tree, not by adding the two branches'
      # deltas on paper. The floor sits AT the measurement with zero headroom,
      # for the reason the telemetry paragraph gives: the next packet that adds
      # a test goes red until it raises this number.
      minimum: 1551

external:
  # NOT self-contained, and saying so is the point. The gate needs a postgres
  # nobody in this repository carries, a toolchain this repository pins rather
  # than ships, and a hex fetch on a cold checkout. A declaration that called
  # this self-contained would be describing a gate nobody has ever run on a
  # clean machine — the same defect as identity's gate being green over a
  # database nobody had migrated, told the other way round.
  # The reasoning for each requirement is in the comment above it. The `name`
  # field is capped at 200 characters by the schema, and that cap is the format
  # telling me something true: this field is a NAME a reader can check against,
  # not an essay. The first draft of this file put the whole argument in `name`
  # and the checker refused it with `gate.schema` — which is the schema working.
  selfContained: false
  requirements:
    - kind: database
      # WHY THIS IS A REQUIREMENT AND NOT A DETAIL. `mix ecto.setup` creates AND
      # migrates courier_test, and `mix test` is aliased to `ecto.create` plus
      # `ecto.migrate` — so unlike identity, this repository cannot quietly run
      # its whole suite against an empty schema. That is a property of the
      # repository, and it is a reason to be relieved, not a reason to pretend
      # the database is not needed. Without a migrated postgres the gate still
      # cannot run at all.
      #
      # AND WHAT SATISFIES IT CHANGED, which is why this block was rewritten
      # rather than left alone. It used to say `docker compose up -d db`, and that
      # command named a service courier no longer has: this repository adopted
      # kit's stack, and a service that adopts kit's stack owns no container of
      # its own. A `satisfy` command that no longer runs is worse than a missing
      # one — it is a gate declaration that reports a satisfied operator while
      # describing a repository that does not exist.
      #
      # The host-side suite and the dev container are therefore on DIFFERENT
      # databases, and the reason is a compose fact rather than a preference.
      # `ports:` is a LIST, and a second file's list is APPENDED rather than
      # substituted — so courier publishing its own port on kit's postgres gives
      # you postgres on kit's port AND on courier's, and kit's
      # `tests/fleet_check.py` fails exactly that. The dev container reaches
      # courier's database over the compose network by service name, where no port
      # is involved; the host-side suite needs a postgres on 5432 that is courier's
      # to publish, and it no longer is.
      name: >-
        PostgreSQL at localhost:5432 as postgres/postgres, the credentials
        config/test.exs hard-codes. Satisfied by any local postgres on that
        address; the gate measured against a native PostgreSQL 18.4.
      satisfy:
        # A REPOSITORY-RELATIVE FILE, so the checker verifies it is there — and
        # here it also RUNS nothing, because it is a file, which is the point: a
        # `satisfy` command that this checker executes would start a database
        # every time somebody validated a gate declaration.
        #
        # It is `bin/gate-db` rather than a bare `docker run` argv because the argv
        # needs `POSTGRES_PASSWORD=postgres`, and an argv item carrying `=` is a
        # shell string wearing an argv's clothes — which core's checker refuses, and
        # rightly. A script is also where the port-collision explanation belongs.
        #
        # Deliberately NOT `bin/dev`: it brings up kit's stack, whose postgres is
        # published on `${KIT_POSTGRES_PORT:-15500}` under kit's own credentials,
        # and pointing courier's suite at it would mean the gate ran against a
        # container the dev loop also mutates.
        command: [bin/gate-db]
        unmet: >-
          mix ecto.setup exits nonzero with a Postgrex/ConnectionError, or the
          run ends with no `Result:` line at all because `mix test` never started
    - kind: toolchain
      # WHY THIS IS MEASURED RATHER THAN ASSUMED. See the note on `command`
      # above: bin/prime under a PATH with no mise shims exits 127 at line 14
      # with "mix: command not found". The requirement is not "a compiler
      # exists" — it is specifically the two versions mise.toml pins.
      name: >-
        mise, plus the Elixir 1.20.4 and Erlang 29.1.1 pinned in mise.toml.
        Without the pins there is no `mix` on PATH and bin/prime dies at line
        14 before running a test.
      satisfy:
        # A bare name, so this is a claim about the machine and the checker
        # reports it as unproven rather than guessing. `mise install` is the
        # command mise's own header in this repository's mise.toml names.
        command: [mise, install]
        unmet: >-
          bin/prime exits 127 at line 14 with "mix: command not found" in the
          message
    - kind: network
      # WHY "ONCE, ON A COLD CHECKOUT" AND NOT ALWAYS. deps/ and _build/ are
      # gitignored and populated after the first run, and a warm gate was
      # measured with the network untouched — the fetch is genuinely a
      # cold-checkout cost and saying "network" flatly would over-claim a
      # requirement this gate does not always have.
      name: >-
        hex.pm, ONCE, on a cold checkout only — `mix local.hex --force` and
        `mix deps.get` fetch 60+ packages. A warm gate needs no network.
      satisfy:
        # A bare name for the same reason as the other two. `mix deps.get` is
        # the command that performs the fetch; it needs mise's environment, so
        # the honest spelling is the one mise runs. Verified working from a
        # bare PATH.
        command: [mix, deps.get]
        unmet: >-
          mix local.hex --force or mix deps.get exits nonzero on a cold
          checkout with no network, and the suite never starts
  # NOT required, and named so nobody goes looking for them:
  #   * no credential. The one variable that looks like a secret,
  #     COURIER_SECRET_BOX_KEY, is required by config/runtime.exs in :prod only
  #     and fixed to a committed test-only value in config/test.exs. `mix test`
  #     never reads it from the environment — the gate needs no secret.
  #   * no service beyond the database above. Oban runs in :manual testing mode
  #     and the NATS publisher is the Noop stand-in, both configured in
  #     config/test.exs, so nothing dials out during the gate.
  #   * no filesystem path outside the repository. deps/ and _build/ are written
  #     inside the tree and are gitignored.

ci:
  # The workflow, and the argv it runs. Checked TEXTUALLY against the workflow's
  # `run:` bodies, so a workflow that stops calling the gate becomes
  # `gate.ci-disagrees` rather than a quiet divergence. courier's gate job runs
  # `./bin/prime` unmodified — the repository's own rule is that the CI gate is
  # the same command, not a CI variant of it — and every element of `invokes`
  # has to appear in one of those bodies.
  workflow: .github/workflows/ci.yml
  invokes: [bin/prime]
