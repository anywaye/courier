
name: courier
description: anywaye courier — transactional email, notification preferences, and every outbound webhook.

language: elixir
core: ^0.2.0

exposes:
  api: openapi.yaml

  events:
    - courier.email.queued
    - courier.email.delivered
    - courier.email.bounced
    - courier.email.complained
    - courier.notification.suppressed

consumes:
    - identity.member.invited
    - identity.member.accepted
    - identity.session.revoked
    - identity.user.created
    - billing.payment.succeeded
    - billing.payment.failed

dependencies: []

env:
  - name: PORT
    required: false
    secret: false
    description: "Listen port."
  - name: DATABASE_URL
    required: true
    secret: true
    dev_default: "auto"
    description: "Postgres DSN."
  - name: COURIER_IDENTITY_TOKEN
    required: false
    secret: true
    dev_default: "auto"
    description: "Scoped API token for introspection."

repository:
  url: git@github.com:anywaye/courier.git
  defaultBranch: master
  visibility: private

owner:
  team: courier
  contact: courier@anywaye.com
