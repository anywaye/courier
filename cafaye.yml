# cafaye.yml — the cafaye project manifest for courier.
#
# The schema is owned by cafaye/core, and core is pre-1.0, so this file is a
# DRAFT written against core's current manifest conventions
# (core/docs/manifest-conventions.md, core/schemas/cafaye.manifest.schema.json).
# When core freezes the manifest spec, `caf init` regenerates and validates this
# file and it stops being hand-maintained. Do not add fields core does not
# define.
#
# UNRESOLVED, and deliberately not guessed here:
#   - `core: ^0.2.0` was `^0.1.0` until courier-14, and the guess this comment
#     used to record has been settled: core publishes `0.2.0` in its own `VERSION`
#     file (core-17), and its contract harness now resolves this line and fails
#     the build when the declared range does not admit the published version. The
#     note is kept rather than deleted because it is the only record in this file
#     of which line is enforced by something outside this repository, and the
#     next reader of a `core:` bump should know the pin is checked rather than
#     assumed. To change it: edit `VERSION` in core first, then this line in the
#     same commit, or this range will be red on the next core change.
#   - `exposes.api` points at `openapi.yaml`, which as of courier-05 documents
#     every route the router serves except `/healthz` and `/readyz`, and says so
#     in its own header. It used to be partial — courier-03 left
#     `/v1/notification_preferences/{user_id}` out of the document deliberately
#     and said so — so the direction in which a route could exist undocumented
#     was unenforced. It is enforced now, in both directions, by
#     `test/courier_web/openapi_document_test.exs`, which reads this document and
#     `lib/courier_web/router.ex` and fails if they disagree. The two probes are
#     the only omission, they are named in the document's header and in the test's
#     exclusion list with the reason, and the test fails if that list stops naming
#     a route the router serves.
#   - `POST /v1/messages` is courier's only door into its send path, and it is
#     the operation the platform's password reset, email verification, email
#     change and team invitation flows are all waiting on. It is declared in the
#     document at `2.1.0` — a minor bump, one additive operation, no change to
#     any existing path. Two consequences worth naming here rather than leaving a
#     reader to find them:
#
#       * `503 unavailable` is now a status courier sends on a customer operation,
#         not only from `GET /readyz`. A send has a dependency courier does not
#         control, and a send has to be able to say the provider refused. The
#         document's header records the change and
#         `test/courier_web/openapi_error_responses_test.exs` had its "unreachable"
#         list corrected in the same commit rather than being deleted.
#       * the document's `errors[].code` enum gained `unknown_field`, `required`,
#         `unknown_notification_type` and `notification_preferences_disabled`, all
#         emitted by the send surface. The vocabulary is closed on purpose, so a
#         body carrying a field courier does not read is a 422 naming it rather
#         than a field silently discarded.
#
#     None of this changes `exposes` below, which already pointed at the document.
#   - `POST /inbound/resend` is the provider webhook courier receives signed
#     deliverability reports on, and the document is at `2.2.0` because of it — one
#     additive operation, a new `webhookSignature` security scheme and three new
#     reusable responses, with no existing path, verb, request field or response
#     shape changed. Two things are load-bearing about it:
#
#       * **It is the first operation in the document that is not behind a bearer
#         token.** An inbound provider webhook is signed rather than
#         JWT-authenticated — core's `docs/openapi-conventions.md` §Auth says so
#         explicitly — so it declares `security: [{webhookSignature: []}]` and the
#         document-level `security: [bearerAuth: []]` still describes the other
#         nine. It is deliberately **outside `/v1`**, which is this service's
#         contract with a tenant: a generated client for a path under `/v1` sends a
#         bearer token, and this one cannot use it.
#       * **It takes no `Idempotency-Key`,** and the document's header says why — a
#         provider's retry identity is its signature, and the deduplication is the
#         unique index on `(provider, provider_event_id)` rather than a header no
#         provider sends. `openapi_error_responses_test.exs` reads the document and
#         the router against each other for the header, so a route that gained the
#         plug without the document, or the reverse, fails there.
#
#     Its 400 is reachable only with a valid signature, and that is a security
#     property rather than a gap — so the check that provokes each status per
#     operation signs its malformed body for this one. The correction is in
#     `openapi_error_responses_test.exs` and says so where it is made.
#
#     The events it emits are `courier.email.bounced` and `courier.email.complained`,
#     which the list below already declared. They now have a caller, written in the
#     same transaction as the suppression row.
#   - Every operation in `openapi.yaml` requires authentication, and the two
#     `notification_preferences` operations used to be documented as served
#     WITHOUT it — because that is what the router did, which was a
#     disagreement with core's conventions rather than a settled fact. It is
#     closed: both are behind `CourierWeb.Plugs.Principal` and behind
#     `notification_preferences.account_id` for tenancy, `openapi.yaml` is
#     `2.0.0`, and no operation declares `security: []`. The cost the old note
#     warned about was paid here rather than later: a client generated from
#     `1.4.0` sends no token and receives a 401, which is a major `info.version`
#     and a regenerated SDK. There was no 2.x client to regenerate, which is the
#     only reason this was the cheap moment rather than somebody's build break.
#     The inbound operation is the one entry in this file with a `security` other
#     than `bearerAuth`, and it is not a reopening of that gap.
#   - `POST` and `GET /unsubscribe/{token}` are the RFC 8058 one-click door, and
#     the document is at `2.3.0` because of them — one additive path with two
#     operations, a new `UnsubscribeToken` parameter, an `UnsubscribeResult`
#     schema, one new reusable response and one new `errors[].code` (`unsubscribed`
#     on `sendMessage`), with no existing path, verb, request field or response
#     shape changed. Two things about it are load-bearing:
#
#     * **They are the only operations in the document that a generated client has
#       no business calling**, and they declare `security: []` — which says "this
#       operation presents no credential scheme", NOT "this operation is
#       unauthenticated". RFC 8058 §3.1 forbids the request from carrying cookies
#       or authorization at all, so a mail client behind `CourierWeb.Plugs.Principal`
#       would answer every unsubscribe with a `401`; what stands in for the
#       credential is the opaque token in the path, documented as the
#       `UnsubscribeToken` parameter, and an unknown one is a 404 rather than a
#       401 because it is a resource's address.
#     * **Neither declares a 401, and the document says why on each.** A token
#       courier did not issue names no resource, which is a 404, and
#       `test/courier_web/openapi_error_responses_test.exs` provokes every status
#       this route can send against the document in both directions — so a future
#       401 here would fail rather than ship.
#
#   - `consumes` has one entry, and it is the fleet's first. Every service
#     published and nobody subscribed, so the bus was one-ended; this is the
#     other end. `identity.member.invited` is in core's catalog
#     (`core/docs/event-naming.md`), which is core's rule 6 — a subscription to a
#     type no publisher declares ships silently and fails on somebody else's
#     deploy.
#
#     **The handler is `Courier.Consumers.MemberInvited`, and it currently
#     refuses.** The payload carries `account_id`, `invitation_id`, `email`,
#     `role` and `invited_by_id`; the `team_invitation` template also needs
#     `account_name`, `invited_by` and `url`, and **the accept URL is
#     unrecoverable from any event** — identity returns the invitation token in
#     its 201 and stores only the digest. See
#     `REPORT-courier-consumer-invite-01.md` and the handler's moduledoc. The
#     subscription is declared anyway, because the consumer, its dedupe and its
#     retry budget are the part that had never been built, and the payload gap
#     is one line in identity rather than a reason not to have the other end of
#     the bus.
#
#     The entry is held to `Courier.Consumers.subscribed/0` by a test in both
#     directions, and every entry comes with an idempotent consumer because
#     delivery is at-least-once (PLAN.md §3): `consumed_events` keys on the
#     envelope's own id, so a redelivery collides on the primary key.
#
#   - `identity.member.accepted` is the second entry, and the first one courier
#     can act on. It is published from the same file
#     (`identity/internal/outbox/tenancy.go`, `NewMemberAccepted`) when an
#     invitation is redeemed and the membership is created, with payload
#     `account_id`, `user_id`, `role` and the account as the subject. The
#     handler is `Courier.Consumers.MemberAccepted`, and it records an in-app
#     notification: the payload carries a `user_id`, which is a real person, and
#     `Courier.Notifications` needs nothing else. **Email is deliberately not
#     attempted** — the payload carries no address, and courier has no identity
#     client (the refusal in `REPORT-courier-consumer-invite-01.md` §2.6
#     stands). The unblock is one line in identity's `NewMemberAccepted`: carry
#     the member's address.
#
#     **The name divergence is consumed, not resolved.** core's catalog
#     (`core/docs/event-naming.md`) calls this fact `identity.member.joined`;
#     identity publishes `accepted` per the packet decision recorded at
#     `tenancy.go:55-70`. courier subscribes to what is published — a
#     subscription to a type no publisher declares fails on somebody else's
#     deploy (core's rule 6) — and the divergence is reported rather than
#     renamed: `REPORT-courier-consumer-memberaccepted-01.md`.

name: courier
description: cafaye courier — transactional email, notification preferences, and every outbound webhook.

language: elixir
core: ^0.2.0

# courier serves HTTP traffic, so it declares a contract surface.
#
# The five event types below are core's, not this repository's: they are courier's
# row in `core/docs/event-naming.md`, and core asserts that its catalog and its
# example manifests agree in both directions. They are declared here so courier's
# own manifest says the same thing core does.
#
# `email.delivered` is emitted: `Courier.Deliver` writes it to `outbox_events` in
# the same transaction as the send and `Courier.Workers.ProcessOutboxWorker`
# relays it; `Courier.EventsTest` checks this list against
# `Courier.Events.types()`. As of courier-21 that is also true of the HTTP path:
# `POST /v1/messages` reaches the same `Courier.Deliver`, so a message sent over
# HTTP emits the same event with the same guarantees.
#
# `email.bounced` and `email.complained` are emitted as of this packet too:
# `POST /inbound/resend` writes each one to `outbox_events` in the **same
# transaction** as the suppression row it belongs to, so there is no suppression
# without the announcement and no announcement about a mailbox courier does not
# hold. The one gap is stated rather than papered over: a report whose
# `Message-ID` names no send courier made records its suppression and publishes no
# event, because core's schema requires a `user_id` the report does not carry and
# `Courier.InboundReports` reads it back off the send rather than inventing it.
#
# `courier.email.queued` still has no builder, because the send path is
# synchronous and has no backlog for a queue-depth metric to measure.
#
# `courier.notification.suppressed` HAS ITS FIRST CALLER as of the one-click
# unsubscribe, and the type was already declared above: `POST /unsubscribe/{token}`
# writes the `email_suppressions` row and this event in the same transaction, with
# `reason: "preference_off"`. **It is still not called for a refused SEND**, and
# that is the sentence in `Courier.Deliver` this packet did not change — a person
# pressing the unsubscribe button in a mail client is a standing answer that
# changed, which is a different fact from a send courier turned down, and a
# consumer that cannot tell them apart has been handed a lie.
exposes:
  # courier's first documented HTTP surface. Written to core's
  # `docs/openapi-conventions.md`: `/v1` prefix, `info.version` present, problem+json
  # for every non-2xx, cursor pagination, and the auth stated per operation.
  #
  # As of courier-21 this is nine operations across three resources — webhook
  # endpoints, notification preferences, and `POST /v1/messages`. It was already
  # declared before that packet; what courier-21 added is the send operation and
  # the `503` it can answer, not the pointer.
  api: openapi.yaml

  # Three segments, always: `<service>.<entity>.<action>` (core/docs/event-naming.md
  # §courier, and core's frozen `eventType` grammar). courier-01/02 shipped
  # `email.delivered` and four siblings, which `caf contract lint` rejects; core
  # records the same drift in its own docs. The spellings below are the conforming
  # ones, and they are the names courier's `Courier.Events` catalog now uses too.
  events:
    - courier.email.queued
    - courier.email.delivered
    - courier.email.bounced
    - courier.email.complained
    - courier.notification.suppressed

consumes:
    - identity.member.invited
    - identity.member.accepted

# Other cafaye services. Empty: courier depends on postgres, not on a sibling
# service, and the services that will depend on it depend the other way round.
dependencies: []

repository:
  url: git@github.com:cafaye/courier.git
  defaultBranch: master
  visibility: public

owner:
  team: courier
  contact: courier@cafaye.com
