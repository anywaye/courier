# tenancy.yml — what courier declares about its own account boundary.
#
# Checked by cafaye/core's contract harness, from the fleet root:
#
#     /Users/kaka/Code/any/moon/cafaye/core/harness/bin/tenancy-check .
#
# `identity/tenancy.yml` is the reference shape and was read in full before this
# file was written. Two things are carried over deliberately and one is not.
#
# TWO WARNINGS ARE THE CORRECT ANSWER FOR AN ELIXIR SERVICE, and they are named
# here rather than left for a reader to wonder about.
# `tenancy.scope-key-unused` fires because `harness/tenancy_check.py`'s scanner
# recognises SQL — `select … from`, `update … set`, `delete from` — and an Ecto
# query is none of those; `tenancy.enumeration-partial` then names every line in
# the four sources below carrying `account_id` that the scanner could not tie to
# a statement. Neither finding is courier's boundary being weak: it is core's
# scanner reading a language it cannot classify, which is the exact condition
# those two were given non-fatal severities for. What they cost is real and is
# stated rather than assumed — **the checker cannot prove this enumeration is
# closed**, so this file and `test/courier/**` are what hold it, and
# `REPORT-courier-tenancy-declare.md` maps which holds what.
#
# CARRIED OVER, AND THE CARRYING IS THE FINDING: the `rls` block records what
# the DATABASE does, and courier's database does it — **six tables are
# row-level-security FORCED**, by `cafaye.protect_table/2` calls in
# `20261003090000_protect_account_scoped_tables.exs` (`idempotency_keys`,
# `notification_preferences`, `webhook_endpoints`),
# `20261006120000_create_notifications.exs` (`notification_events`,
# `notifications`) and `20261016090000_create_tenant_sending_domains.exs`
# (`tenant_sending_domains`). kit's substrate writes
# `alter table … force row level security` and four policies per table —
# `_cafaye_select`, `_cafaye_insert`, `_cafaye_update`, `_cafaye_delete` — each
# qualified on `cafaye.current_account_id()`. So the database half is real, and
# saying so in this file is correct.
#
# WHAT THE DECLARATION SAYS INSTEAD, AND WHY: `databaseEnforced: false` with an
# empty table list. Not because the database does nothing — because this
# checker's DDL scanner cannot parse an `.exs` migration, so it cannot see the
# `protect_table/2` calls, and the `tenancy.rls-unreadable` warning below names
# exactly those three files. Declaring `true` in the shape the schema requires
# (a populated `rls.tables` with each policy named) was measured to produce
# `tenancy.rls-policy-absent`: the scanner finds no relation in sources it cannot
# read, and a hand-written `.sql` copy of the DDL fails too, because the
# policies are created by a function call the scanner cannot follow. A
# declaration pointing at a file that does not exist in this repository is the
# same defect this file exists to prevent, so the `false` stays and this comment
# carries the truth the format cannot express: **the database enforces on six
# tables; the declaration says what this checker can prove, not what the
# database does.**
#
# NOT CARRIED OVER, and this is the finding rather than an oversight: the
# `no-identity` arm of every entry point below is answered by a **refusal at the
# door**, and `schemas/tenant-isolation.schema.json` says a refusal is not an
# acceptable answer to a cross-tenant read. Courier's shape has no other answer.
# Read the long comment above `entryPoints` before reading the three arms.
version: 1
service: courier

# This service reads and writes other people's data: their webhook endpoints and
# their sealed signing secrets, their users' notification answers, and their
# idempotency claims. The table below the webhook fan-out is the sharpest one —
# an endpoint's url is a place courier will sign and POST to — so `false` here
# would be a lie rather than a declaration.
accountScoped: true

scope:
  # The column every account-scoped statement in this service scopes by, and the
  # spelling is the schema's, the migration's and `CourierWeb.Plugs.Principal`'s.
  # Not `tenant_id`: that spelling is courier's OTEL **resource** attribute
  # (`COURIER_TENANT_ID`), it is not on any row, and `Courier.Observability`'s
  # allowlist refuses it as a span attribute — so the two vocabularies both
  # exist in this tree and only one of them is a column.
  key: account_id
  # FOUR FILES, NOT A DIRECTORY, and the reason is a completeness obligation.
  # These are the four files that carry an account-scoped **read** — a predicate
  # or a `get_by` that filters a statement by the acting account — and naming
  # anything wider would drag in `lib/courier_web/plugs/principal.ex`, whose six
  # references to `account_id` are the door rather than a query, and the schema
  # modules, whose references are column declarations.
  #
  # WHAT IS DELIBERATELY NOT HERE, named so it cannot be mistaken for an
  # oversight. Each of these mentions `account_id` and none of them is an
  # account-scoped read of a row:
  #
  #   lib/courier/idempotency_key.ex         `field :account_id` and the
  #                                           `cast/unique_constraint` lists. The
  #                                           unique index on
  #                                           `(account_id, endpoint, idempotency_key)`
  #                                           is what makes the claim atomic, and
  #                                           `idempotency.ex` is the file that reads it.
  #   lib/courier/outbox_event.ex            `put_change(:account_id, ...)` on an
  #                                           insert. The schema says an insert is
  #                                           absent from `entryPoints[].operation`
  #                                           because it creates a row rather than
  #                                           reaching one.
  #   lib/courier/notification_preference.ex `field :account_id` plus the comment
  #                                           explaining why it is NOT in the
  #                                           request's `@fields`. Read by
  #                                           `notification_preferences.ex`.
  #   lib/courier/principal.ex,              the principal itself, and the door's
  #   lib/courier/principal/**               resolution. `Principal` is how an
  #                                           account gets onto the context at all.
  #   lib/courier/suppressions.ex,           `email_suppressions` and
  #   lib/courier/unsubscribe*.ex            `unsubscribe_tokens` have no
  #                                           `account_id` column **by design** —
  #                                           an address is an address. Those three
  #                                           references are comments saying so, and
  #                                           the design is load-bearing rather than
  #                                           a gap: an unsubscribe has no principal
  #                                           to record, and a stateful unsubscribe
  #                                           row is the difference between
  #                                           "stops product updates" and "cannot
  #                                           reset their password". `POST
  #                                           /v1/messages` consults both tables and
  #                                           neither can be scoped by account.
  #
  # AND THE ONE QUERY THAT IS NOT SCOPED, which is here rather than left for a
  # reader to find: `Courier.Idempotency.complete/4` and `release/1` reach a row
  # by primary key alone (`Repo.get!(id)`, `where([k], k.id == ^id)`). Nothing
  # hands either a foreign id — `CourierWeb.Plugs.Idempotency` passes the `id`
  # out of the `claim/1` it just made for this principal, in the same request —
  # so the boundary is real, and it is also **above the statement rather than in
  # it**. See the comment on `idempotency-keys-fetch` below.
  sources:
    - lib/courier/idempotency.ex
    - lib/courier/notification_preferences.ex
    - lib/courier/webhook_endpoints.ex
    - lib/courier/workers/dispatch_webhooks_worker.ex

rls:
  # False, and the false is about THIS DECLARATION, not about the database.
  # Read the header above for the six tables that are RLS-forced; what is
  # written here is why the declaration cannot say so in the shape the schema
  # requires. Three facts, in the order they decided it:
  #
  #   1. The scanner reads `rls.sources` as SQL. A `.exs` migration is a file
  #      it cannot parse, so `ddl.relation(name)` answers `None` for every table
  #      and `tenancy.rls-policy-absent` fires on each one — measured, not
  #      inferred. Pointing `sources` at a hand-written `.sql` copy gets past
  #      the table check and fails on the policy name, because the policies are
  #      written by `cafaye.protect_table/2` and the scanner cannot follow a
  #      function call to the four policies it creates.
  #   2. The old comment here claimed "none of the ten migrations mentions
  #      `row level security`, `create policy`…". There are THIRTEEN migrations
  #      now, and the claim was always literally true and misleading in intent:
  #      the DDL is inside a `select cafaye.protect_table(…)` string, so a text
  #      scan for the DDL's own words finds nothing while the database is
  #      forced. A comment that says "no RLS DDL" about a tree that calls
  #      `protect_table` five times is the same defect as the declaration it
  #      was explaining.
  #   3. So the `false` stays, and it is the honest answer to the question the
  #      checker can actually ask: "is the database half of this declaration
  #      proven closed by a machine that can read it?" No — and
  #      `tenancy.rls-unreadable` below is the checker saying so itself, naming
  #      the two files. Being named there is the difference between "I cannot
  #      see this" and a confident zero.
  #
  # WHAT HOLDS THE LINE INSTEAD, since the database half is machine-unproven
  # here: `entryPoints[].enforced.line` above, which `tenancy_check.py` checks
  # still carries `account_id`; the suite connecting as `courier_app`, a policy
  # subject rather than a superuser, so the policies are enforced against the
  # role courier actually runs as; and
  # `test/courier/workers/dispatch_webhooks_worker_identity_test.exs`, which
  # asserts the identity is on the connection for every protected read the
  # worker makes. The application's own tests are what hold the boundary — the
  # same instinct `test/courier/backup_tables_test.exs` applies to what courier
  # stores.
  databaseEnforced: false
  # `priv/repo/migrations`, all thirteen of them, and this list is the evidence
  # the checker read to reach the `rls-unreadable` warning below: `read_ddl`
  # reads every file here and reports a table as protected on
  # `enable`/`force`/`create policy` alone, and two of the thirteen are `.exs`
  # files carrying RLS DDL as a string this scanner cannot parse. Silence is
  # reported rather than assumed — that is what the warning is.
  sources:
    - priv/repo/migrations
  # Empty **because** `databaseEnforced` is false. The schema refuses `false`
  # with a populated list in both directions, and the reason is the one that
  # applies here: a service that says its database does nothing and then lists
  # tables it does something to is the same omission facing the other way. The
  # six protected tables are named in the header above, with the reason this
  # block cannot name them itself.
  tables: []

# THE DECLARED ENUMERATION IS SEVEN ENTRY POINTS ACROSS FOUR TABLES, and the
# third of those tables is one table (`webhook_endpoints`) reached four ways.
#
# WHAT IS NOT DECLARED, named here rather than left for a reader to infer:
#
#   * `POST /v1/messages` is an account-scoped OPERATION with no account-scoped
#     READ. It reads `notification_preferences` by `user_id` through
#     `enabled?/3`, which takes no account on purpose, and it reads
#     `email_suppressions` by address in a table that has no `account_id`
#     column. The account it writes goes onto the outbox row and the endpoint
#     cannot leak from a send.
#   * `Courier.NotificationPreferences.enabled?/3` is deliberately
#     account-less — the unique index is on `(user_id, notification_type)`, one
#     answer per person — so there is no predicate here to declare.
#   * `Courier.OutboxEvent` and `Courier.WebhookDeliveries` are read by id and by
#     dispatch state, never by a caller's account. `webhook-deliveries-dispatch`
#     below is the fan-out **into** them and it is declared as `call`, which is
#     the schema's word for a worker's scoping living above the statement.
#   * `CourierWeb.Plugs.Principal` is where the account enters, and it is NOT an
#     entry point — see the next paragraph, which is the most important comment
#     in this file.
#
# THE `no-identity` ARM IS A REFUSAL, AND THAT IS A FINDING FOR CORE RATHER THAN
# A DEFECT IN COURIER. Read what the schema asks for: "`no-identity` reads zero
# rows". Read what courier can actually prove: a request with no bearer token is
# stopped by `CourierWeb.Plugs.Principal` with 401 and **never reaches a
# statement at all** (`assert conn.halted`,
# `test/courier_web/controllers/webhook_endpoints_controller_test.exs:106`). There
# is no query to answer with an empty result, because there is no query — and
# unlike a 403-for-another-account, a 401 for no token leaks nothing at all: the
# caller named no id, so nothing about any row was confirmed.
#
# The alternative was to leave every arm pointing at the library with a `nil`
# account, which would have been a **false green**: `WebhookEndpoints.get(id,
# nil)` does return `nil`, but only because `account_id` is `NOT NULL` and
# `= NULL` matches nothing — not because a boundary refused it — and no such
# call is driven anywhere in this suite. A test written to make the checker
# green is exactly the thing this file exists to be unable to hide.
#
# So every `no-identity` arm below names the line that proves the pipeline
# **halted**, which is a stronger claim than an empty result: the query was
# never issued. The `expects` token is `halted` rather than `401` because `401`
# does not satisfy the schema's own `expects` pattern and `halted` says the
# thing that matters.
#
# THE OTHER TWO ARMS ARE THE ORDINARY SHAPE. `other-account` is a real, valid
# credential for a different account and is answered as nonexistence — `nil`, `[]`,
# `{:error, :not_found}`, or a 404 — never a 403, which would confirm the id
# exists. `own-account` reads the row's **own value** back, never a liveness
# token, because a service that returns nothing to everybody satisfies the two
# denial arms for free.
entryPoints:
  # --------------------------------------------------------------------------
  # webhook_endpoints, reached four ways. Three are declared at the query and
  # one at its only caller, and the split is a fact about the code: `page/3` has
  # no library-level cross-tenant test of its own — `webhook_endpoints_test.exs`
  # has no `describe "page"` block — so its arms point at the controller test
  # that drives it, which is where its only caller is.
  # --------------------------------------------------------------------------
  - id: webhook-endpoints-get
    operation: select
    subject: webhook_endpoints
    enforced:
      # `Repo.get_by/3` with `account_id:` as one of its keywords. It is a
      # `query-filter` and not a `bind-parameter` because Elixir builds the
      # `WHERE` from the keyword list rather than from a positional `$2` — the
      # key is on the line, which is the whole of what
      # `tenancy.scope-lost` checks.
      #
      # THE LINE MOVED, and the move is recorded rather than silently followed:
      # it was 95 (a docstring's closing `"""`) until w3p1's Cloudflare packet
      # reflowed this module's signatures, and the failure it produced was
      # `tenancy.scope-lost` naming a line carrying no key. 99 is the
      # `Repo.get_by/3` itself — the only line in `get/2` that carries the key,
      # and the one the whole function exists to run.
      mechanism: query-filter
      file: lib/courier/webhook_endpoints.ex
      line: 99
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          # The test head was the declared line; the assertion is this halted
          # check, inside the loop over all six actions — every action, not one.
          expects: halted
          file: test/courier_web/controllers/webhook_endpoints_controller_test.exs
          line: 106
        - id: other-account
          asserts: absent
          # The context's own test, and `nil` rather than an error: the answer to
          # "do you have this?" for a row the caller cannot see is no. The
          # `describe` head was the declared line; the assertion is the `== nil`
          # in "returns nothing for an account that does not own it".
          expects: nil
          file: test/courier/webhook_endpoints_test.exs
          line: 188
        - id: own-account
          asserts: present
          # The row's own id, read back through the same `get/2`. The declared
          # line was an `attrs(%{url: "file:///etc/passwd", …})` in the SSRF
          # test — a different test entirely; the read-back is this line.
          expects: id
          file: test/courier/webhook_endpoints_test.exs
          line: 180

  - id: webhook-endpoints-list
    operation: select
    subject: webhook_endpoints
    enforced:
      # `where([endpoint], endpoint.account_id == ^account_id)` — the predicate
      # itself, inside `list/2`'s pipeline. It was line 110, the docstring above
      # the `@spec`, until w3p1's reflow; 114 is the `where` that carries the
      # key and is the only line in the function that does.
      mechanism: query-filter
      file: lib/courier/webhook_endpoints.ex
      line: 114
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          # The test head was the declared line; the assertion is this halted
          # check, inside the loop over all six actions — every action, not one.
          expects: halted
          file: test/courier_web/controllers/webhook_endpoints_controller_test.exs
          line: 106
        - id: other-account
          asserts: absent
          # The other account's seed `create` was the declared line; the
          # assertion is the `== []` in "returns another account's nothing".
          expects: "[]"
          file: test/courier/webhook_endpoints_test.exs
          line: 229
        - id: own-account
          asserts: present
          # Both of the account's ids and not the other account's, asserted as a
          # list so the third row's absence is part of the claim. The declared
          # line was blank; the assertion is this `Enum.map(found, & &1.id)`.
          expects: id
          file: test/courier/webhook_endpoints_test.exs
          line: 222

  - id: webhook-endpoints-enabled
    operation: select
    subject: webhook_endpoints
    enforced:
      # The fan-out list, and the reason `(account_id, inserted_at) WHERE status
      # = 'enabled'` exists. This is the `where` carrying both halves of that
      # index's leading predicate — `account_id` here and the status one token
      # later. It was line 124 (a docstring) before w3p1's reflow.
      mechanism: query-filter
      file: lib/courier/webhook_endpoints.ex
      line: 128
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          # The test head was the declared line; the assertion is this halted
          # check, inside the loop over all six actions — every action, not one.
          expects: halted
          file: test/courier_web/controllers/webhook_endpoints_controller_test.exs
          line: 106
        - id: other-account
          asserts: absent
          # The `enabled = create!()` seed was the declared line; the assertion
          # is the `== []` in "never returns another account's endpoint".
          expects: "[]"
          file: test/courier/webhook_endpoints_test.exs
          line: 272
        - id: own-account
          asserts: present
          # The declared line was `assert found.status == :disabled` — the
          # disabled-endpoint test, a different question; the own-account read
          # is this `found.id == enabled.id`.
          expects: id
          file: test/courier/webhook_endpoints_test.exs
          line: 259

  - id: webhook-endpoints-page
    operation: select
    subject: webhook_endpoints
    enforced:
      # The `where` inside `page/3`'s query — the account predicate the page is
      # built on, one line below the `with` that validates the limit. It was
      # declared at 156, the `validate_limit` line, which carries no key: a
      # cursor check is not a tenancy check and the declaration said it was.
      mechanism: query-filter
      file: lib/courier/webhook_endpoints.ex
      line: 160
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          # The test head was the declared line; the assertion is this halted
          # check, inside the loop over all six actions — every action, not one.
          expects: halted
          file: test/courier_web/controllers/webhook_endpoints_controller_test.exs
          line: 106
        # BOTH denial arms are at the controller, and that is the state of this
        # surface rather than a preference: `GET /v1/webhook_endpoints` is
        # `page/3`'s only caller and the suite pins the boundary over HTTP.
        - id: other-account
          asserts: absent
          # The declared line was blank — the gap between two tests; the
          # assertion is the empty `data` list in "never lists another
          # account's".
          expects: "[]"
          file: test/courier_web/controllers/webhook_endpoints_controller_test.exs
          line: 256
        - id: own-account
          asserts: present
          # The `describe` head was the declared line; the assertion is the
          # one-element `data` list in "lists the caller's own endpoints".
          expects: id
          file: test/courier_web/controllers/webhook_endpoints_controller_test.exs
          line: 247

  # --------------------------------------------------------------------------
  # idempotency_keys — the table `(account_id, endpoint, idempotency_key)`.
  # --------------------------------------------------------------------------
  - id: idempotency-keys-fetch
    operation: select
    subject: idempotency_keys
    enforced:
      # `fetch/3` reads by `(account_id, endpoint, key)` and `expires_at`, and
      # the account is the first term of the triple core names — which is why a
      # second account presenting the same uuid gets a different claim rather
      # than somebody else's answer. The unique index on those three columns is
      # named at `lib/courier/idempotency.ex:72` and it is the same index
      # `refusal/1` matches on by name.
      #
      # THE LINE IS THE `where` CARRYING THE TRIPLE'S FIRST TERM, and it is 164
      # rather than 151. 151 was the `@doc """` opening the docstring above
      # `fetch/3` — a line carrying no key at all, so the declaration described
      # a boundary on a line that had none. The predicate is the one below, and
      # it is the only line in `fetch/3` that names the account.
      mechanism: query-filter
      file: lib/courier/idempotency.ex
      line: 164
    negative:
      asserts: absent
      cases:
        # `POST /v1/messages` is the only route carrying `CourierWeb.Plugs.Idempotency`,
        # and `:idempotent` is piped after `:authenticated` in
        # `lib/courier_web/router.ex`, so a request with no bearer is stopped
        # before a key is ever claimed.
        - id: no-identity
          asserts: absent
          # The declared line was `assert conn.status == 401`; the arm's token is
          # the envelope's own code, asserted on the next line — the 401 alone
          # would be satisfied by any refusal.
          expects: unauthorized
          file: test/courier_web/controllers/messages_controller_test.exs
          line: 116
        - id: other-account
          asserts: absent
          # The declared line was blank; the assertion is the `== nil` closing
          # the `as_account(@other_account, …)` call — the comment above that
          # call is why running as the file's own account would satisfy it for
          # free.
          expects: nil
          file: test/courier/idempotency_test.exs
          line: 133
        - id: own-account
          asserts: present
          # The declared line was the claim itself; the assertion is the read
          # back — `found.id == claim.id` in "finds a claim that is inside its
          # window".
          expects: id
          file: test/courier/idempotency_test.exs
          line: 104

  # --------------------------------------------------------------------------
  # notification_preferences — and the one place courier's boundary is NOT a
  # predicate on the query.
  #
  # WHAT THIS BOUNDARY NOW IS, and the split is the finding. `addressable/2`
  # compares the acting account against the stored row's `account_id`, and
  # `Courier.NotificationPreferences`'s moduledoc, the suite and
  # `REPORT-courier-app-role.md` all record what the role switch did to it: as
  # `courier_app` the `owner/1` read is a subject of the `select` policy, so
  # another account's row is not returned at all and **the comparison never
  # runs**. `test/courier/notification_preferences_test.exs` sets the
  # `@moduletag account:` identity to the OWNER on the sandbox connection, so
  # its `{:error, :not_found}` arms pass *as the owner* — the Elixir defence
  # is proved, and the answer the repository actually serves a cross-tenant
  # read is different and is proved elsewhere.
  #
  # WHERE, exactly, and the two halves are two different tests:
  #
  #   the Elixir comparison  `test/courier/notification_preferences_test.exs`
  #                         :233 and :254, both run as the owner
  #   the database policy   `test/courier_web/controllers/notification_preferences_controller_test.exs`
  #                         :135 "another account cannot read this one's
  #                         preferences" — a REAL request, another REAL
  #                         credential, answered 200-with-defaults
  #                         byte-identical to a user nobody has written for
  #                         (:190), which is the stricter form of
  #                         nonexistence and leaks strictly less than the
  #                         404 it replaced
  #                         :205 "another account cannot write this one's
  #                         preferences, and writes nothing" — 404, with the
  #                         victim's row read back as its owner (:233)
  #
  # The declaration keeps the OWNER-identity arms on the library file because
  # those are the lines that carry the comparison's own spelling of nothing and
  # the schema asks an absent arm for one; the controller file is where the
  # boundary a caller meets is proved, and it is named here rather than left
  # for a reader to find. **A reader who wants the boundary a customer can
  # observe should read the controller test, not these two lines.**
  # --------------------------------------------------------------------------
  - id: notification-preferences-list
    operation: select
    subject: notification_preferences
    enforced:
      # `repository-method`, and the choice is the finding. `list/2` reads by
      # `user_id` alone — the unique index is `(user_id, notification_type)`, one
      # answer per person rather than one per account — and `addressable/2`
      # compares the account the caller is acting as against the `account_id`
      # the stored row carries. The boundary is a comparison in Elixir, so a
      # `query-filter` here would name a predicate this line does not have.
      #
      # The predicate being above the statement is also why the 404 is narrow:
      # `nil` (a user nobody has written for) is `:ok`, because courier holds no
      # foreign key to identity's users and cannot tell that user from one that
      # does not exist. Only a row that EXISTS and belongs elsewhere is a 404.
